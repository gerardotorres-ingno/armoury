name: Weekly data update

on:
  schedule:
    - cron: '0 9 * * 1'      # lunes 09:00 UTC
  workflow_dispatch:          # y a mano desde la pestaña Actions

permissions:
  contents: write             # commitear snapshots y changelogs
  pages: write                # publicar el sitio
  id-token: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # mfm.mjs necesita el paquete `yaml`. Sin esto la corrida falla.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # ---- 1. catálogo (unidades, armas, reglas) --------------------
      - name: Extract datasheets
        run: node extract.mjs

      # ---- 2. puntos oficiales -------------------------------------
      - name: Fetch Munitorum Field Manual
        run: node mfm.mjs

      # ---- 3. comparar contra el snapshot anterior ------------------
      # La primera corrida no tiene con qué comparar: sólo planta la base.
      - name: Build changelog
        run: |
          if [ -d snapshots/latest ]; then
            node diff.mjs snapshots/latest output > changelog-new.md
            node diff.mjs snapshots/latest output --json > app/changelog.json
          else
            echo "# Baseline snapshot — nothing to compare yet" > changelog-new.md
            echo '{}' > app/changelog.json
          fi
          cat changelog-new.md

      # ---- 4. generar la app ---------------------------------------
      - name: Fetch mission data
        run: node missions.mjs

      - name: Build app
        run: node prepare-data.mjs

      # ---- 5. archivar y commitear ---------------------------------
      - name: Commit snapshot and changelog
        run: |
          STAMP=$(date +%Y-%m-%d)
          mkdir -p changelogs
          cp changelog-new.md "changelogs/$STAMP.md"
          rm -rf snapshots/latest
          mkdir -p snapshots/latest
          cp output/*.json snapshots/latest/

          git config user.name  "data-bot"
          git config user.email "actions@github.com"
          git add -f snapshots changelogs app/index.html app/changelog.json
          git diff --staged --quiet || git commit -m "data: $STAMP"
          git push

      # ---- 6. publicar ---------------------------------------------
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: ./app }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
