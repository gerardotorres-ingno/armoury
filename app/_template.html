  for (const id of s.active) box.append(secRow(b, id, true, who));

  if ((s.done || []).length) {
    const dh = el('div','rrole');
    dh.innerHTML = '<span>COMPLETED</span><span>' + s.done.length + '</span>';
    box.append(dh);
    for (const id of s.done) {
      const c = secOf(id); if (!c) continue;
      const r = el('div','slot');
      r.innerHTML = '<div class="id"><div class="nm" style="opacity:.6">' + esc(c.n) + '</div>' +
        '<div class="meta">' + (s.vp[id] ?? 0) + ' VP \u00b7 round ' + (s.scored?.[id] ?? '?') + '</div></div>';
      box.append(r);
    }
  }

  const foot = el('div','hint');
  foot.textContent = s.deck.length + ' left in deck · ' + s.active.length +
    ' in hand · ' + (s.done || []).length + ' completed';
  box.append(foot);
  return box;
}

function secRow(b, id, tactical, who){
  who = who || 'me';
  const s = initSec(b, who), c = secOf(id);
  const row = el('div','slot');
  if (!c) { row.textContent = 'Card removed from the library.'; return row; }

  // Los VP se llevan POR RONDA, no como un acumulado suelto: cada carta
  // tiene su tope por ronda además del de la partida, y sin separar las
  // rondas no se puede aplicar ninguno de los dos.
  s.byRound = s.byRound || {};
  const key = id + '@' + b.round;
  const scoredBefore = Object.entries(s.byRound)
    .reduce((a, [k, v]) => k.startsWith(id + '@') && k !== key ? a + (+v || 0) : a, 0);

  // Una carta que ya puntuó queda COMPLETADA: no admite más VP.
  s.scored = s.scored || {};
  const completed = !!s.scored[id];

  const capRound = +c.pr || +c.max || 99;
  const capLeft  = Math.max(0, (+c.max || 99) - scoredBefore);
  const cap = completed ? 0 : Math.min(capRound, capLeft);

  const info = el('div','id');
  const rules = (c.tiers || []).map((t) =>
    '<u>' + esc([t.mode, t.w].filter(Boolean).join(' · ')) +
    (t.max ? ' · max ' + esc(t.max) : '') + '</u>' +
    (t.i || []).map(([vp, tx]) => '<em><b>' + esc(vp) + '</b> ' + esc(tx) + '</em>').join('')
  ).join('');
  info.innerHTML = '<div class="nm">' + esc(c.n) + '</div>' +
    '<div class="meta">' + (c.pr ? c.pr + ' per round · ' : '') + 'max ' + c.max +
    (scoredBefore ? ' · ' + scoredBefore + ' already scored' : '') + '</div>' +
    (rules ? '<div class="crules">' + rules + '</div>' : '');

  const stepv = el('div','step');
  const minus = el('button'); minus.textContent = '\u2212';
  const val = el('input'); val.type='text'; val.inputMode='numeric';
  val.value = s.byRound[key] ?? 0;
  const plus = el('button'); plus.textContent = '+';
  const set = (n) => {
    n = Math.max(0, Math.min(cap, n | 0));
    s.byRound[key] = n;
    s.vp[id] = scoredBefore + n;
    val.value = n; saveBattle(b); syncSecToScore(b, who);
  };
  minus.onclick = () => set((s.byRound[key] ?? 0) - 1);
  plus.onclick  = () => set((s.byRound[key] ?? 0) + 1);
  val.onchange  = () => set(parseInt(val.value,10) || 0);
  stepv.append(minus, val, plus);

  row.append(info, stepv);

  if (tactical) {
    const ok = el('button','btn'); ok.textContent = 'ACHIEVED';
    ok.onclick = () => {
      // Queda registrada como completada: sigue a la vista con sus puntos,
      // pero ya no suma más.
      s.scored = s.scored || {};
      s.scored[id] = b.round;
      s.done.push(id);
      s.active = s.active.filter((x) => x !== id);
      saveBattle(b); renderBattles();
    };
    ok.title = 'Scored — no further points from this card';
    // Descartar cuesta y da 1 PM: es la regla, y conviene que se vea.
    const dc = el('button','btn'); dc.textContent = 'DISCARD +1CP';
    dc.onclick = () => {
      s.active = s.active.filter((x) => x !== id);
      s.deck.push(id);
      b.cp[who] = Math.min(b.round, (b.cp[who] || 0) + 1);
      saveBattle(b); renderBattles();
    };
    row.append(ok, dc);
  }
  return row;
}

/* Los VP de secundarias alimentan la fila del marcador de la ronda actual. */
/* Los VP de la ronda actual salen de las cartas puntuadas EN esa ronda. */
function syncSecToScore(b, who){
  who = who || 'me';
  const s = initSec(b, who);
  const suffix = '@' + b.round;
  const manual = who === 'me' ? (b.manualSec || {}) : (b.manualSecThem || {});
  if (manual[b.round - 1]) return;               // esa ronda la escribiste a mano
  const thisRound = Object.entries(s.byRound)
    .reduce((a, [k, v]) => k.endsWith(suffix) ? a + (+v || 0) : a, 0);
  b[who][b.round - 1].s = Math.min(VP_CAP.perRound, thisRound);
  saveBattle(b);
}

/* Acepta "Nombre", "Nombre, total" y "Nombre, por ronda, total", con coma,
 * punto y coma, tabulación o el último número pegado al nombre. Cuanto más
 * tolerante, menos veces hay que volver a tipear. */
function parseCards(text){
  const out = [];
  for (const raw of String(text).split(/\r?\n/)) {
    let line = raw.trim();
    if (!line || /^formats accepted/i.test(line)) continue;

    let parts = line.split(/\s*[,;\t|]\s*/).filter(Boolean);
    if (parts.length === 1) {
      // "Bring It Down 6" → nombre y un número al final
      const m = /^(.*?)\s+(\d{1,2})$/.exec(line);
      if (m) parts = [m[1], m[2]];
    }

    const name = (parts[0] || '').trim();
    if (!name) continue;
    const nums = parts.slice(1).map((x) => parseInt(x, 10)).filter(Number.isFinite);

    let pr = 0, max = 5;
    if (nums.length >= 2) { pr = nums[0]; max = nums[1]; }
    else if (nums.length === 1) { max = nums[0]; }

    out.push({ id: 'c' + Date.now() + '_' + out.length, n: name, max, pr });
  }
  return out;
}

function importLib(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='application/json';
  inp.onchange = async () => {
    try {
      const d = JSON.parse(await inp.files[0].text());
      if (!Array.isArray(d)) throw new Error('Not a card list.');
      secLib = d.filter((c) => c && c.n).map((c, i) => ({
        id: c.id || 'c' + (Date.now() + i),
        n: String(c.n),
        max: parseInt(c.max, 10) || 5,
        pr: parseInt(c.pr ?? c.perRound, 10) || 0,   // 0 = sin tope por ronda
      }));
      saveLib(); renderBattles();
    } catch (e) { alert(e.message || 'Could not read that file.'); }
  };
  inp.click();
}

/* ============================================================
   ASISTENTE DE LISTA
   
   Cuatro pasos: facción y tamaño → destacamentos → mejoras → unidades.
   No sugiere qué llevar: no tengo datos de meta y una recomendación
   inventada es peor que ninguna. Lo que hace es no dejarte avanzar sin
   lo obligatorio y mostrar en todo momento qué falta.
   
   El único mínimo de composición que declara el catálogo es 1 Personaje
   por ejército; el resto son los topes que la app ya valida.
   ============================================================ */
let wizStep = 0;

const WIZ_STEPS = ['Army', 'Detachment', 'Enhancements', 'Units'];

/* Requisitos de una lista, con su estado. Alimenta la barra del asistente
   y también sirve como resumen dentro del editor. */
function requirements(l){
  const f = factionOf(l.faction);
  const req = [];
  if (!f) return req;

  const { total } = review(l);
  const chars = l.slots.filter((sl) => {
    const u = unitOf(l, sl.unitId);
    return u && (u.kw || []).includes('Character');
  }).length;

  req.push({
    k: 'char', t: 'At least one Character',
    ok: chars > 0,
    d: chars ? chars + ' in the list' : 'The army roster requires one',
  });

  const dl = detsOf(f);
  const spent = (l.dets || []).reduce((a, n) =>
    a + ((dl.find(([x]) => x === n) || [])[1] ?? 0), 0);
  req.push({
    k: 'det', t: 'A detachment',
    ok: (l.dets || []).length > 0,
    d: (l.dets || []).length ? spent + ' / ' + dpBudget(l) + ' DP used' : 'Pick at least one',
  });

  const missions = missionsFor(l, f);
  if (missions.size) {
    req.push({
      k: 'mis', t: 'Force Disposition',
      ok: !!l.mission && missions.has(l.mission),
      d: l.mission || [...missions.keys()].join(' / '),
    });
  }

  req.push({
    k: 'pts', t: 'Within the points limit',
    ok: total <= l.limit,
    d: total + ' / ' + l.limit + (total > l.limit ? '  (' + (total - l.limit) + ' over)' : ''),
  });

  // Aliados: sólo aparece si la lista realmente lleva alguno.
  for (const [name, by] of (f.ally || [])) {
    const cap = by[l.limit];
    let spent = 0;
    const copies2 = copyIndex(l);
    for (const [si, sl] of l.slots.entries()) {
      const u = unitOf(l, sl.unitId);
      if (u && u.fc === name) spent += ptsFor(u, sl.size, copies2[si]) + gearPoints(u, sl);
    }
    if (!spent) continue;
    req.push({
      k: 'ally:' + name, t: name + ' allowance',
      ok: cap == null || spent <= cap,
      d: spent + (cap != null ? ' / ' + cap : '') + ' pts',
    });
  }

  const hard = review(l).issues.filter((i) => i.hard).length;
  req.push({
    k: 'legal', t: 'No blocking issues',
    ok: hard === 0,
    d: hard ? hard + ' to fix' : 'clear',
  });

  return req;
}

function reqBar(l){
  const box = el('div','reqbar');
  for (const r of requirements(l)) {
    const c = el('div', 'req' + (r.ok ? ' ok' : ''));
    c.innerHTML = '<b>' + (r.ok ? '\u2713' : '\u2022') + ' ' + esc(r.t) + '</b>' +
                  '<i>' + esc(r.d) + '</i>';
    box.append(c);
  }
  return box;
}

function renderWizard(v, l){
  const f = factionOf(l.faction);

  // pasos
  const nav = el('div','wsteps');
  WIZ_STEPS.forEach((name, i) => {
    const b = el('button', 'wstep' + (i === wizStep ? ' on' : (i < wizStep ? ' done' : '')));
    b.innerHTML = '<span>' + (i + 1) + '</span>' + name;
    b.onclick = () => { wizStep = i; renderLists(); };
    nav.append(b);
  });
  v.append(nav);

  const body = el('div');
  body.style.cssText = 'margin-top:4px';

  if (wizStep === 0) {
    body.append(hint('Faction and points are fixed once the list exists — changing ' +
                     'them later would silently invalidate what you built.'));

    const fsel = el('select');
    fsel.style.cssText = 'width:100%;font-family:var(--disp);font-weight:600;font-size:16px';
    for (const group of ['Imperium','Chaos','Xenos','Otros']) {
      const fs = DATA.factions.filter((x) => x.group === group);
      if (!fs.length) continue;
      const og = document.createElement('optgroup'); og.label = group;
      for (const x of fs) {
        const o = el('option'); o.value = x.slug; o.textContent = x.name;
        if (x.slug === l.faction) o.selected = true;
        og.append(o);
      }
      fsel.append(og);
    }
    fsel.onchange = () => {
      l.faction = fsel.value; l.dets = []; l.enh = []; l.slots = []; l.mission = '';
      saveList(l); renderLists();
    };
    body.append(labelledBlock('Faction', fsel));

    const psel = numSelect([500,1000,1500,2000,2500,3000], l.limit, (n) => {
      l.limit = n; saveList(l); renderLists();
    });
    psel.style.width = '100%';
    body.append(labelledBlock('Battle size', psel));

    const fmt = el('div','bar');
    fmt.append(check('Allow Legends',  l.legends,  (x) => { l.legends = x; saveList(l); }));
    fmt.append(check('Allow Crucible', l.crucible, (x) => { l.crucible = x; saveList(l); }));
    body.append(fmt);
  }

  if (wizStep === 1) {
    body.append(hint('Spend your Detachment Points. Two detachments with the same ' +
                     'unique tag cannot be combined, and your Force Disposition ' +
                     'comes from the one you pick.'));
    body.append(detachmentsFor(l, f));
    const bar2 = el('div','bar');
    bar2.append(labelled('Mission', missionInput(l, f)));
    body.append(bar2);
  }

  if (wizStep === 2) {
    body.append(hint('Optional. Enhancements go on Characters and their points ' +
                     'count towards the limit.'));
    body.append(enhancementsFor(l, f));
  }

  if (wizStep === 3) {
    const add = el('button','btn pri');
    add.textContent = '+ ADD UNIT';
    add.style.cssText = 'width:100%;padding:11px;margin-bottom:10px';
    add.onclick = () => { picking = true; selected = null; wizard = false; renderLists(); };
    body.append(add);
    body.append(hint('The assistant stops here: which units to take is a judgement ' +
                     'call, and I have no tournament data to base a recommendation on. ' +
                     'What it does check is on the left.'));
  }

  v.append(body);
  v.append(reqBar(l));

  // navegación
  const foot = el('div','bar');
  foot.style.marginTop = '14px';
  if (wizStep > 0) {
    const back = el('button','btn'); back.textContent = '\u2190 BACK';
    back.onclick = () => { wizStep--; renderLists(); };
    foot.append(back);
  }
  if (wizStep < WIZ_STEPS.length - 1) {
    const next = el('button','btn pri'); next.textContent = 'NEXT \u2192';
    next.onclick = () => { wizStep++; renderLists(); };
    foot.append(next);
  } else {
    const done = el('button','btn pri'); done.textContent = 'OPEN THE LIST';
    done.onclick = () => { wizard = false; renderLists(); };
    foot.append(done);
  }
  const skip = el('button','btn'); skip.textContent = 'SKIP TO EDITOR';
  skip.onclick = () => { wizard = false; renderLists(); };
  foot.append(skip);
  v.append(foot);
}

/* ============================================================
   TABLERO DE UNIDADES
   
   Durante la partida: marcar qué unidad ya actuó en cada fase y anotar
   las heridas que va recibiendo. Al terminar, eso permite responder
   preguntas concretas — qué unidad murió en la ronda 2, cuál nunca
   llegó a disparar, cuánto castigo aguantó cada una.
   
   No calcula nada del juego: registra lo que pasó en la mesa.
   ============================================================ */
const PHASES = [['m','Move'], ['s','Shoot'], ['c','Charge'], ['f','Fight']];

function trackOf(b){
  b.track = b.track || {};      // slotIndex -> { w, dead, act:{ '2:s': true } }
  return b.track;
}

/* Heridas totales de una unidad: perfil W por cantidad de modelos. */
function unitWounds(l, sl){
  const u = unitOf(l, sl.unitId);
  const w = u && u.st ? parseInt(u.st[3], 10) : 0;
  return Number.isFinite(w) ? w * (sl.size || 1) : 0;
}

function trackerPanel(b){
  const box = el('div');
  box.style.cssText = 'margin:18px 0';
  box.append(sideTracker(b, 'me'));
  box.append(sideTracker(b, 'them'));

  const l = lists.find((x) => x.id === b.mine);
  if (l) box.append(analysisPanel(b, l));
  return box;
}

/* Un lado del tablero. El rival se sigue igual que vos si cargaste su lista
 * con LOAD A LIST; si no, queda una lista libre donde anotás sus bajas, que
 * es el dato que después importa. */
function sideTracker(b, side){
  const mine = side === 'me';
  const l = lists.find((x) => x.id === (mine ? b.mine : b.oppList));
  const box = el('div');
  box.style.cssText = 'margin-bottom:16px';

  const head = el('div','rrole');
  head.innerHTML = '<span>' + (mine ? 'MY UNITS' : esc((b.opponent || 'THEIR') + '\u2019S UNITS').toUpperCase()) +
    '</span><span>round ' + b.round + '</span>';
  box.append(head);

  if (!l || !l.slots.length) {
    if (mine) { box.append(note('Pick one of your lists above to track its units.')); return box; }
    box.append(freeKills(b));
    return box;
  }

  const t = mine ? trackOf(b) : trackThemOf(b);
  const copies = copyIndex(l);

  for (const [i, sl] of l.slots.entries()) {
    const u = unitOf(l, sl.unitId);
    const st = t[i] = t[i] || { w: 0, dead: null, act: {} };
    const maxW = unitWounds(l, sl);
    const dead = st.dead != null;

    const row = el('div', 'trow' + (dead ? ' dead' : ''));

    const name = el('div','tname');
    name.innerHTML = '<b>' + esc(u ? u.n : '?') + (sl.size > 1 ? ' \u00d7' + sl.size : '') + '</b>' +
      '<i>' + (dead ? 'destroyed in round ' + st.dead
                    : (maxW ? st.w + ' / ' + maxW + ' wounds' : 'no profile')) + '</i>';
    row.append(name);

    // fases de ESTA ronda
    const acts = el('div','tacts');
    for (const [k, label] of PHASES) {
      const key = b.round + ':' + k;
      const on = !!st.act[key];
      const p = el('button', 'ph' + (on ? ' on' : ''));
      p.textContent = label;
      p.disabled = dead;
      p.onclick = () => {
        if (on) delete st.act[key]; else st.act[key] = true;
        saveBattle(b); renderBattles();
      };
      acts.append(p);
    }
    row.append(acts);

    // heridas
    const wr = el('div','step');
    const minus = el('button'); minus.textContent = '\u2212';
    const val = el('input'); val.type='text'; val.inputMode='numeric'; val.value = st.w;
    const plus = el('button'); plus.textContent = '+';
    const set = (n) => {
      n = Math.max(0, Math.min(maxW || 999, n | 0));
      st.w = n;
      // Al llegar al máximo se marca sola, con la ronda: es el dato que
      // después responde "¿en qué turno la perdí?".
      if (maxW && n >= maxW && st.dead == null) st.dead = b.round;
      if (maxW && n < maxW) st.dead = null;
      saveBattle(b); renderBattles();
    };
    minus.onclick = () => set(st.w - 1);
    plus.onclick  = () => set(st.w + 1);
    val.onchange  = () => set(parseInt(val.value, 10) || 0);
    wr.append(minus, val, plus);
    row.append(wr);

    const kill = el('button','btn');
    kill.textContent = dead ? 'REVIVE' : 'DESTROYED';
    kill.onclick = () => {
      st.dead = dead ? null : b.round;
      if (!dead && maxW) st.w = maxW;
      saveBattle(b); renderBattles();
    };
    row.append(kill);

    box.append(row);
  }

  // resumen de la ronda
  const pend = l.slots.filter((_, i) =>
    t[i] && t[i].dead == null && !PHASES.some(([k]) => t[i].act[b.round + ':' + k])).length;
  const foot = el('div','hint');
  foot.textContent = pend + ' units have not acted this round · ' +
    l.slots.filter((_, i) => t[i] && t[i].dead != null).length + ' destroyed so far';
  box.append(foot);
  return box;
}

function trackThemOf(b){
  b.trackThem = b.trackThem || {};
  return b.trackThem;
}

/* Sin la lista del rival: bajas a mano, con su ronda. Es lo mínimo que
 * hace falta para reconstruir la partida después. */
function freeKills(b){
  b.kills = b.kills || [];
  const box = el('div');

  box.append(hint('Their list is not loaded. Use LOAD A LIST in the Lists tab to track ' +
                  'their units properly, or just note what you destroyed and when.'));

  for (const [i, k] of b.kills.entries()) {
    const row = el('div','slot');
    const n = el('input'); n.type='text'; n.value = k.n; n.placeholder = 'unit destroyed';
    n.style.cssText = 'flex:1;min-width:0;font-family:var(--disp);font-weight:600;font-size:15px;' +
      'background:transparent;border:none;border-bottom:1px solid var(--rule2);padding:3px 0;color:var(--ink)';
    n.oninput = () => { k.n = n.value; saveBattle(b); };

    const r = el('select');
    for (let x = 1; x <= ROUNDS; x++) {
      const o = el('option'); o.value = x; o.textContent = 'R' + x;
      if (k.r === x) o.selected = true;
      r.append(o);
    }
    r.onchange = () => { k.r = +r.value; saveBattle(b); };

    const rm = el('button','btn'); rm.textContent = 'REMOVE';
    rm.onclick = () => { b.kills.splice(i, 1); saveBattle(b); renderBattles(); };

    row.append(n, r, rm);
    box.append(row);
  }

  const add = el('button','btn');
  add.textContent = '+ UNIT DESTROYED';
  add.style.marginTop = '8px';
  add.onclick = () => { b.kills.push({ n:'', r:b.round }); saveBattle(b); renderBattles(); };
  box.append(add);
  return box;
}

/* Análisis: lo que el registro permite responder al terminar. */
function analysisPanel(b, l){
  const t = trackOf(b);
  const det = document.createElement('details');
  det.className = 'cfg';
  det.innerHTML = '<summary>Battle analysis <span>after the game</span></summary>';
  const body = el('div');

  const rows = l.slots.map((sl, i) => {
    const u = unitOf(l, sl.unitId);
    const st = t[i] || { w:0, dead:null, act:{} };
    const maxW = unitWounds(l, sl);
    const acted = {};
    for (const [k] of PHASES)
      acted[k] = Array.from({length:5}, (_, r) => st.act[(r+1) + ':' + k] ? (r+1) : null).filter(Boolean);
    return { n: u ? u.n : '?', size: sl.size, st, maxW, acted,
             pts: u ? ptsFor(u, sl.size, copyIndex(l)[i]) + gearPoints(u, sl) : 0 };
  });

  const lost = rows.filter((r) => r.st.dead != null);
  const lostPts = lost.reduce((a, r) => a + r.pts, 0);
  const never = rows.filter((r) => !Object.values(r.acted).some((x) => x.length));

  const sum = el('div','reqbar');
  const card = (t2, d) => { const c = el('div','req ok'); c.innerHTML = '<b>' + t2 + '</b><i>' + d + '</i>'; return c; };
  sum.append(
    card(lost.length + ' units lost', lostPts + ' pts destroyed'),
    card(never.length + ' never acted', never.map((r) => r.n).slice(0,3).join(', ') || '—'),
    card('Damage taken', rows.reduce((a, r) => a + r.st.w, 0) + ' wounds'),
  );
  body.append(sum);

  const tab = el('table','score');
  tab.innerHTML = '<tr><th class="who">Unit</th><th>Pts</th><th>Wounds</th><th>Lost</th>' +
    PHASES.map(([, n]) => '<th>' + n + '</th>').join('') + '</tr>' +
    rows.map((r) => '<tr><th class="who">' + esc(r.n) + '</th>' +
      '<td>' + r.pts + '</td>' +
      '<td>' + r.st.w + (r.maxW ? '/' + r.maxW : '') + '</td>' +
      '<td>' + (r.st.dead != null ? 'R' + r.st.dead : '\u2014') + '</td>' +
      PHASES.map(([k]) => '<td>' + (r.acted[k].length ? r.acted[k].map((x) => 'R' + x).join(' ') : '\u2014') + '</td>').join('') +
      '</tr>').join('');
  body.append(tab);
  body.append(hint('Rounds in which each unit acted. Useful afterwards: a unit that ' +
                   'never charged, or one that died before shooting, is a list problem, ' +
                   'not bad luck.'));
  det.append(body);
  return det;
}

/* ============================================================
   REGLAS — referencia rápida
   
   La app NO trae el texto de las reglas: son de GW. Lo que trae es el
   contenedor — secciones, buscador, import/export — para que cargues las
   chuletas que usás y las compartas con tu club en un archivo.
   
   Mismo criterio que la biblioteca de secundarias: uno la carga, todos
   la importan.
   ============================================================ */
let rules = [];          // [{ id, sec, n, d }]
let ruleQuery = '';

const RULE_SECTIONS = ['Core','Command','Movement','Shooting','Charge','Fight',
                       'Weapon keywords','Terrain','Other'];

function saveRules(){ store.put('misc', { id: 'rules', qty: JSON.stringify(rules) }); }

async function loadRules(){
  const rows = await store.getAll('misc');
  const row = rows.find((r) => r.id === 'rules');
  try { rules = row ? JSON.parse(row.qty) : []; } catch { rules = []; }
  rules = rules.filter((r) => r && String(r.n || '').trim());
}

/* ------------------------------------------------------------------
 * REGLAMENTO ADJUNTO
 *
 * GW publica las Core Rules gratis, pero gratis-de-descargar no es
 * libre-de-redistribuir: el PDF no va en el repo. Lo que sí puede hacer la
 * app es guardar TU copia en TU dispositivo, para tenerla sin señal.
 *
 * Se guarda como blob en el almacén `misc`. En localStorage no entra (son
 * varios MB), así que si el navegador no da IndexedDB se avisa.
 * ---------------------------------------------------------------- */
let rulesPdf = null;      // { name, size, blob }

async function loadPdf(){
  try {
    const rows = await store.getAll('misc');
    const row = rows.find((r) => r.id === 'rulesPdf');
    rulesPdf = row && row.qty && row.qty.blob ? row.qty : null;
  } catch { rulesPdf = null; }
}

function pdfPanel(){
  const box = el('div');
  box.style.cssText = 'margin-bottom:14px';

  if (rulesPdf) {
    const row = el('div','slot');
    const url = URL.createObjectURL(rulesPdf.blob);
    row.innerHTML = '<div class="id"><div class="nm">' + esc(rulesPdf.name) + '</div>' +
      '<div class="meta">' + Math.round(rulesPdf.size / 1024) + ' KB \u00b7 stored on this device</div></div>';
    const open = el('button','btn pri'); open.textContent = 'OPEN';
    open.onclick = () => window.open(url, '_blank');
    const rm = el('button','btn'); rm.textContent = 'REMOVE';
    rm.onclick = () => {
      if (!confirm('Remove the attached rulebook from this device?')) return;
      store.del('misc', 'rulesPdf'); rulesPdf = null; renderRules();
    };
    row.append(open, rm);
    box.append(row);
    return box;
  }

  const d = document.createElement('details');
  d.className = 'cfg';
  d.innerHTML = '<summary>Attach your rulebook <span>PDF, stays on this device</span></summary>';
  const body = el('div');
  const p = el('p');
  p.style.cssText = 'font-size:13px;line-height:1.6;color:var(--ink2);margin-bottom:10px';
  p.innerHTML = 'The app does not ship the rulebook \u2014 it is Games Workshop\u2019s. ' +
    'Download the free Core Rules yourself, then attach the file here: it is stored ' +
    'in this browser only, so you can read it at the table with no signal. ' +
    'Nothing is uploaded anywhere.<br><br>' +
    '<a href="https://www.warhammer-community.com/en-gb/downloads/warhammer-40000/" ' +
    'target="_blank" rel="noopener" style="color:var(--ochre)">Official free download \u2197</a>';

  const inp = el('input'); inp.type = 'file'; inp.accept = 'application/pdf';
  inp.onchange = async () => {
    const f = inp.files[0];
    if (!f) return;
    if (store.mode !== 'idb') {
      alert('Attaching a PDF needs the full database, which this browser blocks ' +
            'for files opened from disk. Publish the app to a URL, or open it there.');
      return;
    }
    try {
      store.put('misc', { id: 'rulesPdf', qty: { name: f.name, size: f.size, blob: f } });
      rulesPdf = { name: f.name, size: f.size, blob: f };
      renderRules();
    } catch (e) { alert('Could not store that file: ' + (e.message || e)); }
  };

  body.append(p, inp);
  d.append(body);
  box.append(d);
  return box;
}

function renderRules(){
  const v = document.getElementById('viewRules');
  v.innerHTML = '';
  v.append(pdfPanel());

  const bar = el('div','bar');
  const q = el('input'); q.type = 'search'; q.placeholder = 'Search rules\u2026';
  q.style.cssText = 'flex:1 1 220px';
  q.value = ruleQuery;
  q.oninput = () => { ruleQuery = q.value; drawList(); };
  bar.append(q);

  const add = el('button','btn'); add.textContent = '+ ENTRY';
  add.onclick = () => {
    rules.push({ id: 'r' + Date.now(), sec: 'Core', n: 'New entry', d: '' });
    saveRules(); renderRules();
  };
  const imp = el('button','btn'); imp.textContent = 'IMPORT';
  imp.onclick = importRules;
  const exp = el('button','btn'); exp.textContent = 'EXPORT';
  exp.onclick = () => {
    const url = URL.createObjectURL(new Blob([JSON.stringify(rules, null, 2)], { type:'application/json' }));
    const a = document.createElement('a'); a.href = url;
    a.download = 'armoury-rules.json'; a.click(); URL.revokeObjectURL(url);
  };
  bar.append(add, imp, exp);
  v.append(bar);

  const list = el('div');
  v.append(list);

  function drawList(){
    list.innerHTML = '';
    const term = ruleQuery.trim().toLowerCase();

    if (!rules.length) {
      const n = el('div','note');
      n.innerHTML =
        'No rules loaded. This app does not ship the rules text \u2014 it belongs to ' +
        'Games Workshop, who publish the Core Rules as a free download.<br><br>' +
        '<a href="https://www.warhammer-community.com/en-gb/downloads/warhammer-40000/" ' +
        'target="_blank" rel="noopener" style="color:var(--ochre)">Official free rules \u2197</a>' +
        '<br><br>Here you write the reminders you actually look up mid-game. ' +
        'Then EXPORT and share the file: one person types them, the whole club imports.';
      list.append(n);

      // Esqueleto: 34 palabras clave de arma y las estratagemas básicas, con
      // su coste y fase, y el texto en blanco. Evita tipear los nombres.
      if ((DATA.quickRef || []).length) {
        const b = el('button','btn pri');
        b.textContent = 'START FROM A SKELETON (' + DATA.quickRef.length + ' entries)';
        b.style.cssText = 'margin-top:12px;padding:11px 14px';
        b.onclick = () => {
          rules = DATA.quickRef.map((q, i) => ({
            id: 'q' + i,
            sec: RULE_SECTIONS.includes(q.sec) ? q.sec : 'Other',
            n: q.n,
            d: q.meta ? '[' + q.meta + ']\n' : '',
          }));
          saveRules(); renderRules();
        };
        list.append(b);
        list.append(hint('Names, CP cost and phase come from the community dataset ' +
          '40kdc-data, which deliberately ships no rules text. You fill in one line each.'));
      }
      return;
    }

    const hits = rules.filter((r) => !term ||
      (r.n + ' ' + (r.d || '') + ' ' + r.sec).toLowerCase().includes(term));

    if (!hits.length) { list.append(note('Nothing matches.')); return; }

    for (const sec of RULE_SECTIONS) {
      const inSec = hits.filter((r) => (r.sec || 'Other') === sec);
      if (!inSec.length) continue;

      const h = el('div','rrole');
      h.innerHTML = '<span>' + sec.toUpperCase() + '</span><span>' + inSec.length + '</span>';
      list.append(h);

      for (const r of inSec) list.append(ruleRow(r, drawList));
    }
  }

  drawList();
}

function ruleRow(r, redraw){
  const det = document.createElement('details');
  det.className = 'rule';

  const sum = document.createElement('summary');
  sum.textContent = r.n || '(untitled)';
  det.append(sum);

  const body = el('div');

  const n = el('input'); n.type = 'text'; n.value = r.n; n.placeholder = 'Rule name';
  n.style.cssText = 'width:100%;font-family:var(--disp);font-weight:600;font-size:16px;' +
    'background:transparent;border:none;border-bottom:1px solid var(--rule2);' +
    'padding:4px 0;color:var(--ink);margin-bottom:8px';
  n.oninput = () => { r.n = n.value; sum.textContent = n.value || '(untitled)'; saveRules(); };

  const ta = el('textarea');
  ta.value = r.d || '';
  ta.placeholder = 'What you need to remember mid-game';
  ta.style.cssText = 'width:100%;min-height:90px;padding:9px;background:var(--field);' +
    'border:1px solid var(--rule2);border-radius:2px;color:var(--ink);font:inherit;resize:vertical';
  ta.oninput = () => { r.d = ta.value; saveRules(); };

  const foot = el('div','bar');
  const sec = el('select');
  for (const s of RULE_SECTIONS) {
    const o = el('option'); o.value = s; o.textContent = s;
    if ((r.sec || 'Other') === s) o.selected = true;
    sec.append(o);
  }
  sec.onchange = () => { r.sec = sec.value; saveRules(); redraw(); };
  const rm = el('button','btn'); rm.textContent = 'REMOVE';
  rm.onclick = () => { rules = rules.filter((x) => x.id !== r.id); saveRules(); redraw(); };
  foot.append(labelled('Section', sec), rm);

  body.append(n, ta, foot);
  det.append(body);
  return det;
}

function importRules(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json';
  inp.onchange = async () => {
    try {
      const d = JSON.parse(await inp.files[0].text());
      if (!Array.isArray(d)) throw new Error('Not a rules file.');
      rules = d.filter((r) => r && r.n).map((r, i) => ({
        id: r.id || 'r' + (Date.now() + i),
        sec: RULE_SECTIONS.includes(r.sec) ? r.sec : 'Other',
        n: String(r.n), d: String(r.d ?? r.text ?? ''),
      }));
      saveRules(); renderRules();
    } catch (e) { alert(e.message || 'Could not read that file.'); }
  };
  inp.click();
}

/* ============================================================
   ESTADÍSTICAS
   
   Sale de las batallas ya registradas: marcador, disposiciones, misiones,
   y el tablero de unidades. No pide cargar nada nuevo.
   
   Lo que responde: cómo te va con cada facción, con qué emparejamiento de
   disposiciones ganás y con cuál no, y qué unidades mueren siempre o nunca
   llegan a actuar.
   
   El paquete compartible lleva sólo resúmenes: facción, disposiciones,
   marcador y unidades. Ni nombres de rivales ni notas.
   ============================================================ */
let pool = [];        // batallas importadas de otras personas

function savePool(){ store.put('misc', { id: 'statsPool', qty: JSON.stringify(pool) }); }
async function loadPool(){
  const rows = await store.getAll('misc');
  const row = rows.find((r) => r.id === 'statsPool');
  try { pool = row ? JSON.parse(row.qty) : []; } catch { pool = []; }
}

/* Resumen de una batalla: la forma que se comparte y sobre la que se suma. */
function summarise(b, mine){
  const t = battleTotals(b);
  const l = mine || lists.find((x) => x.id === b.mine);
  const f = l ? factionOf(l.faction) : null;
  const units = [];

  if (l) {
    const tr = b.track || {};
    for (const [i, sl] of l.slots.entries()) {
      const u = unitOf(l, sl.unitId);
      if (!u) continue;
      const st = tr[i] || {};
      const acted = ['m','s','c','f'].some((k) =>
        Array.from({length:5}, (_, r) => st.act && st.act[(r+1)+':'+k]).some(Boolean));
      units.push({ n: u.n, size: sl.size, dead: st.dead ?? null, acted });
    }
  }

  // Bajas del rival, si se registraron.
  const oppL = lists.find((x) => x.id === b.oppList);
  const theirUnits = oppL
    ? oppL.slots.map((sl, i) => {
        const u = unitOf(oppL, sl.unitId);
        const st = (b.trackThem || {})[i] || {};
        return u ? { n: u.n, size: sl.size, dead: st.dead ?? null } : null;
      }).filter(Boolean)
    : (b.kills || []).filter((k) => k.n).map((k) => ({ n: k.n, dead: k.r }));

  return {
    id: b.id,
    date: b.date,
    rounds: { me: b.me, them: b.them },
    cp: b.cp || null,
    painted: b.painted || null,
    theirUnits,
    faction: f ? f.name : null,
    disp: b.disp?.me ?? null,
    vsDisp: b.disp?.them ?? null,
    mission: b.mission ?? null,
    limit: b.limit ?? 2000,
    me: t.me, them: t.them,
    result: t.me > t.them ? 'W' : (t.me < t.them ? 'L' : 'D'),
    done: !!b.done,
    units,
  };
}

function allSummaries(){
  const mine = battles.filter((b) => b.done).map((b) => summarise(b));
  return { mine, pool, all: [...mine, ...pool] };
}

function tally(rows, keyFn){
  const m = new Map();
  for (const r of rows) {
    const k = keyFn(r);
    if (!k) continue;
    const e = m.get(k) || { k, W:0, L:0, D:0, vp:0, avp:0, n:0 };
    e[r.result]++; e.vp += r.me; e.avp += r.them; e.n++;
    m.set(k, e);
  }
  return [...m.values()].sort((a, b) => b.n - a.n);
}

function pct(e){ return e.n ? Math.round(e.W * 100 / e.n) : 0; }

/* ------------------------------------------------------------------
 * COMUNIDAD
 *
 * Sin servidor: la app se suscribe a un archivo JSON publicado en cualquier
 * URL —el repo del club, por ejemplo— y lo trae al abrir. El que consulta no
 * hace nada; el que aporta le manda su archivo a quien mantiene el repo.
 *
 * No es tiempo real. Es lo más cerca que se llega sin backend, cuentas ni
 * hacerse responsable de datos ajenos.
 * ---------------------------------------------------------------- */
let feedUrl = '';
let feedState = '';

async function loadFeed(){
  const rows = await store.getAll('misc');
  const row = rows.find((r) => r.id === 'feedUrl');
  feedUrl = row ? String(row.qty || '') : '';
  if (feedUrl) await pullFeed(true);
}

async function pullFeed(quiet){
  if (!feedUrl) return;
  feedState = 'loading';
  try {
    const res = await fetch(feedUrl, { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();

    // Dos formatos: un JSON publicado (repo, Drive) o una hoja de cálculo
    // publicada como CSV. La segunda permite que un Formulario recoja los
    // archivos y la app los lea sola, sin que nadie fusione nada a mano.
    const list = /^\s*[[{]/.test(text) ? fromJson(text) : fromSheet(text);
    if (!list.length) throw new Error('no results in that file');

    // Se reemplaza el lote de la comunidad, no se acumula: si alguien
    // corrige una partida, la corrección tiene que ganar.
    const localIds = new Set(battles.map((b) => b.id));
    pool = list.filter((x) => x && x.id != null && !localIds.has(x.id));
    savePool();
    feedState = 'ok:' + pool.length;
  } catch (e) {
    feedState = 'error:' + (e.message || e);
  }
  if (!quiet) renderStats();
  else if (document.getElementById('tabStats').getAttribute('aria-selected') === 'true') renderStats();
}

function fromJson(text){
  const d = JSON.parse(text);
  return Array.isArray(d) ? d : (d.battles || []);
}

/* CSV de una hoja publicada. Se busca, en cualquier columna, un valor que
 * sea el JSON exportado por la app; el resto de las columnas —marca de
 * tiempo, nombre— se ignoran. */
function fromSheet(text){
  const out = [];
  for (const cell of csvCells(text)) {
    const t = cell.trim();
    if (!t.startsWith('{') && !t.startsWith('[')) continue;
    try {
      const d = JSON.parse(t);
      const rows = Array.isArray(d) ? d : (d.battles || (d.id != null ? [d] : []));
      for (const r of rows) if (r && r.id != null) out.push(r);
    } catch {}
  }
  // Duplicados: la misma partida puede enviarse dos veces.
  const seen = new Set();
  return out.filter((r) => !seen.has(r.id) && seen.add(r.id));
}

/* Lector de CSV con comillas: los JSON traen comas y saltos de línea. */
function csvCells(text){
  const cells = [];
  let cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; }
      else if (ch === '"') q = false;
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',' || ch === '\n' || ch === '\r') { if (cur) cells.push(cur); cur = ''; }
    else cur += ch;
  }
  if (cur) cells.push(cur);
  return cells;
}

function feedPanel(){

           : feedState.startsWith('error') ? 'could not load'

  d.innerHTML = '<summary>Community feed <span>' + esc(st) + '</span></summary>';

  const body = el('div');
  const p = el('p');
  p.style.cssText = 'font-size:13px;line-height:1.6;color:var(--ink2);margin-bottom:10px';
  p.innerHTML = 'Point this at a results file published anywhere. Two formats work:' +
    '<br><br><b>A JSON file</b> \u2014 in a GitHub repo or a shared Drive link. Somebody ' +
    'merges the results and publishes it.' +
    '<br><br><b>A Google Sheet published as CSV</b> \u2014 pair it with a Google Form ' +
    'where players paste their exported results. The sheet collects them and the app ' +
    'reads it: nobody merges anything by hand.' +
    '<br><br>The app pulls it on every open, so everyone sees the same combined numbers.';

  const i = el('input'); i.type = 'url';
  i.placeholder = 'JSON file, or a Google Sheet published as CSV';

  i.style.cssText = 'width:100%;margin-bottom:8px';

  const bar = el('div','bar');
  const save = el('button','btn pri'); save.textContent = 'CONNECT';
  save.onclick = async () => {
    feedUrl = i.value.trim();
    store.put('misc', { id: 'feedUrl', qty: feedUrl });
    if (!feedUrl) { pool = []; savePool(); renderStats(); return; }

  };

function renderStats(){
  const v = document.getElementById('viewStats');
  v.innerHTML = '';
  v.append(feedPanel());

  const { mine, all } = allSummaries();

  const bar = el('div','bar');
  const exp = el('button','btn'); exp.textContent = 'SHARE MY RESULTS';
  exp.onclick = () => {
    if (!mine.length) { alert('No finished battles yet. Tick "Finished" on a battle first.'); return; }
    const url = URL.createObjectURL(new Blob([JSON.stringify({
      kind: 'armoury-stats', v: 1, exportedAt: new Date().toISOString(), battles: mine,
    }, null, 2)], { type:'application/json' }));
    const a = document.createElement('a'); a.href = url;
    a.download = 'armoury-results.json'; a.click(); URL.revokeObjectURL(url);
  };
  const imp = el('button','btn'); imp.textContent = 'ADD SOMEONE ELSE\u2019S';
  imp.onclick = importPool;
  bar.append(exp, imp);
  if (pool.length && !feedUrl) {
    const clr = el('button','btn'); clr.textContent = 'CLEAR POOL (' + pool.length + ')';
    clr.onclick = () => { pool = []; savePool(); renderStats(); };
    bar.append(clr);
  }
  v.append(bar);

  if (!all.length) {
    v.append(note('No finished battles yet. Play one, tick "Finished" in the Battles tab, ' +
                  'and the numbers appear here. Share the file with your club and everyone ' +
                  'sees the combined picture.'));
    return;
  }

  // ---- resumen propio
  const rec = tally(mine, () => 'me')[0];
  if (rec) {
    const sum = el('div','reqbar');
    const card = (t, d) => { const c = el('div','req ok'); c.innerHTML = '<b>' + t + '</b><i>' + d + '</i>'; return c; };
    sum.append(
      card(rec.W + '–' + rec.L + '–' + rec.D, pct(rec) + '% win rate over ' + rec.n + ' games'),
      card(Math.round(rec.vp / rec.n) + ' VP', 'average scored'),
      card(Math.round(rec.avp / rec.n) + ' VP', 'average conceded'),
      card((rec.vp - rec.avp >= 0 ? '+' : '') + Math.round((rec.vp - rec.avp) / rec.n), 'average margin'),
    );
    v.append(sum);
  }

  v.append(splitTable('By faction played', tally(all, (r) => r.faction)));
  v.append(splitTable('By Force Disposition', tally(all, (r) => r.disp)));
  v.append(splitTable('By matchup', tally(all, (r) => r.disp && r.vsDisp ? r.disp + ' vs ' + r.vsDisp : null)));
  v.append(splitTable('By primary mission', tally(all, (r) => r.mission)));
  v.append(unitTable(all));

  const foot = el('div','hint');
  foot.textContent = mine.length + ' of your battles' +
    (pool.length ? ' · ' + pool.length + ' shared by others' : '') +
    ' · shared files carry no opponent names or notes';
  v.append(foot);
}

function splitTable(title, rows){
  const box = el('div');
  box.style.cssText = 'margin:18px 0';
  const h = el('div','rrole');
  h.innerHTML = '<span>' + esc(title.toUpperCase()) + '</span><span>' + rows.length + '</span>';
  box.append(h);

  if (!rows.length) { box.append(hint('Not enough data yet.')); return box; }

  const t = el('table','score');
  t.innerHTML = '<tr><th class="who">&nbsp;</th><th>Games</th><th>W</th><th>L</th><th>D</th>' +
    '<th>Win %</th><th>VP for</th><th>VP against</th></tr>' +
    rows.map((e) => '<tr><th class="who">' + esc(e.k) + '</th>' +
      '<td>' + e.n + '</td><td>' + e.W + '</td><td>' + e.L + '</td><td>' + e.D + '</td>' +
      '<td class="tot">' + pct(e) + '</td>' +
      '<td>' + Math.round(e.vp / e.n) + '</td><td>' + Math.round(e.avp / e.n) + '</td></tr>').join('');
  box.append(t);
  return box;
}

/* Unidades: cuántas veces se llevaron, cuántas murieron, cuántas no actuaron.
   Es el dato que dice si una unidad está pagando su lugar en la lista. */
function unitTable(rows){
  const box = el('div');
  box.style.cssText = 'margin:18px 0';
  const m = new Map();
  for (const r of rows) for (const u of (r.units || [])) {
    const e = m.get(u.n) || { n: u.n, taken: 0, died: 0, idle: 0, rounds: [] };
    e.taken++;
    if (u.dead != null) { e.died++; e.rounds.push(u.dead); }
    if (!u.acted) e.idle++;
    m.set(u.n, e);
  }
  const list = [...m.values()].sort((a, b) => b.taken - a.taken).slice(0, 25);

  const h = el('div','rrole');
  h.innerHTML = '<span>UNITS</span><span>' + m.size + '</span>';
  box.append(h);
  if (!list.length) { box.append(hint('No unit tracking recorded yet.')); return box; }

  const t = el('table','score');
  t.innerHTML = '<tr><th class="who">Unit</th><th>Taken</th><th>Died</th><th>Survival</th>' +
    '<th>Avg round lost</th><th>Never acted</th></tr>' +
    list.map((e) => {
      const surv = Math.round((e.taken - e.died) * 100 / e.taken);
      const avg = e.rounds.length
        ? (e.rounds.reduce((a, x) => a + x, 0) / e.rounds.length).toFixed(1) : '\u2014';
      return '<tr><th class="who">' + esc(e.n) + '</th><td>' + e.taken + '</td>' +
        '<td>' + e.died + '</td><td class="tot">' + surv + '</td>' +
        '<td>' + avg + '</td><td>' + e.idle + '</td></tr>';
    }).join('');
  box.append(t);
  box.append(hint('A unit with high "never acted" is paying points for nothing. ' +
                  'One that always dies in round 2 is either bait or misplaced.'));
  return box;
}

function importPool(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json';
  inp.multiple = true;
  inp.onchange = async () => {
    let added = 0;
    for (const f of inp.files) {
      try {
        const d = JSON.parse(await f.text());
        if (d.kind !== 'armoury-stats' || !Array.isArray(d.battles)) continue;
        const seen = new Set(pool.map((x) => x.id));
        for (const b of d.battles) if (!seen.has(b.id)) { pool.push(b); added++; }
      } catch {}
    }
    if (!added) { alert('No new results found in those files.'); return; }
    savePool(); renderStats();
  };
  inp.click();
}
