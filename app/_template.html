<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1720">
<title>Armoury — collection manifest</title>
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Cogitador: modo oscuro real. En la mesa, con luz baja o de noche, una
     pantalla clara a página completa encandila; ésta no. El acento cian
     mantiene contraste alto sin gritar. */
  --field:#0F1720; --panel:#16212C; --ink:#DDE7EF; --ink2:#7C93A6;
  --rule:#26384A; --rule2:#33495F;
  --ochre:#39C6C0; --ochre-bg:#123236;
  --oxide:#FF6B5E; --oxide-bg:#331A1B;
  --slate:#9DB4C6; --slate-bg:#1B2A38;
  --plate:#1E2E3D; --plate-ink:#39C6C0; --plate-line:#26384A;
  --chrome:#0A1219;
  --tap:44px;   /* objetivo táctil mínimo */
  --disp:"Archivo Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
/* Los controles no heredan color: sin esto, en modo oscuro el navegador
   los pinta con su color propio (negro) y quedan ilegibles. */
button,input,select,textarea{color:var(--ink)}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--field); color:var(--ink); font-family:var(--body);
  font-size:15px; line-height:1.5; padding-bottom:96px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.wide{max-width:1180px}

/* ---------- maestro-detalle ---------- */
.mx{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media (min-width:940px){ .mx{grid-template-columns:minmax(0,1fr) 400px} }

.pane{min-width:0}
.side{position:sticky;top:74px;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--panel);color:var(--ink);border:1px solid var(--rule2);border-radius:3px}
.side .hd{position:sticky;top:0;background:var(--chrome);color:var(--ink);
  padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.side .hd h3{font-family:var(--disp);font-weight:600;font-size:16px;letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .hd button{background:transparent;border:1px solid var(--rule2);color:var(--ink);
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:4px 7px;border-radius:2px;cursor:pointer}
.side .bd{padding:12px}
.side .empty{padding:26px 14px;font-family:var(--mono);font-size:11.5px;
  color:var(--ink2);line-height:1.7;text-align:center}

/* ---------- filas del roster ---------- */
.rrole{display:flex;align-items:baseline;justify-content:space-between;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink2);
  border-bottom:1px solid var(--rule);padding:12px 0 4px;margin-bottom:1px}
.runit{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:transparent;border:none;border-bottom:1px solid var(--rule);
  padding:9px 8px 9px 0;cursor:pointer;font:inherit;color:inherit}
.runit:hover{background:var(--panel)}
.runit[aria-current=true]{background:var(--ochre-bg);color:var(--ink);
  box-shadow:inset 3px 0 0 var(--ochre);padding-left:9px}
.runit .rn{flex:1;min-width:0}
.runit .rn b{display:block;font-family:var(--disp);font-weight:600;font-size:16.5px;
  line-height:1.2;overflow-wrap:anywhere}
.runit .rn i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--ink2)}
.runit .rp{font-family:var(--mono);font-size:13px;white-space:nowrap}
.runit .rx{font-family:var(--mono);font-size:14px;color:var(--ink2);padding:2px 6px;border-radius:2px}
.runit .rx:hover{background:var(--oxide-bg);color:var(--oxide)}

/* ---------- buscador de unidades ---------- */
.warn ul{list-style:none}
.warn li{padding:1px 0}
.warn li::before{content:'\2022';margin-right:6px;opacity:.5}

details.cfg,details.scope{border:1px solid var(--rule2);border-radius:3px;
  background:var(--panel);color:var(--ink);margin:14px 0}
details.cfg>summary,details.scope>summary{cursor:pointer;padding:9px 12px;
  font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.02em;
  display:flex;justify-content:space-between;gap:10px;align-items:baseline}
details.cfg>summary span{font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--ink2)}
details.cfg>div{padding:0 12px 10px;border-top:1px solid var(--rule)}
details.scope{background:transparent;border-color:var(--rule)}
details.scope>summary{font-family:var(--mono);font-size:10.5px;font-weight:400;
  letter-spacing:.1em;color:var(--ink2);text-transform:uppercase}
details.scope p{padding:0 12px 10px;font-size:12px;line-height:1.6;color:var(--ink2)}
details.scope b{color:var(--ink)}

/* Alineado al borde DERECHO del botón: el botón vive al final de la barra,
   así que abrir hacia la derecha se salía de la pantalla. */
.shmenu{position:absolute;top:calc(100% + 5px);right:0;z-index:20;width:270px;max-width:78vw;
  background:var(--panel);border:1px solid var(--rule2);border-radius:3px;
  box-shadow:0 6px 20px rgba(0,0,0,.45);overflow:hidden}
.shmenu button{display:block;width:100%;text-align:left;background:transparent;
  border:none;border-bottom:1px solid var(--rule);padding:9px 12px;cursor:pointer;
  color:var(--ink);font:inherit}
.shmenu button:last-child{border-bottom:none}
.shmenu button:hover{background:var(--ochre-bg);color:var(--ink)}
.shmenu b{display:block;font-family:var(--disp);font-weight:600;font-size:14.5px}
.shmenu i{display:block;font-style:normal;font-family:var(--mono);font-size:10px;
  color:var(--ink2);margin-top:1px}

/* ---------- batallas ---------- */
.clock{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.clock .clkf{grid-column:1/-1;display:flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:11px;color:var(--ink2)}
.clks{background:var(--panel);border:1px solid var(--rule2);border-radius:3px;
  padding:12px;text-align:center}
.clks.on{border-color:var(--ochre);box-shadow:inset 0 0 0 1px var(--ochre)}
.clkl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink2);
  text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clkt{font-family:var(--disp);font-weight:600;font-size:40px;line-height:1.05;
  font-variant-numeric:tabular-nums}
/* Nombres propios: `warn` ya era la clase de los avisos y el reloj heredaba
   su fondo rojo. */
.clkt.over{color:var(--ochre)}
.clkt.late{color:var(--oxide)}
.clkp{font-family:var(--mono);font-size:10.5px;color:var(--ink2);margin-bottom:9px}
.clks .btn{width:100%}

.crules,.misres u{display:block}
.crules u,.misres u{font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink2);text-decoration:none;margin-top:6px}
.crules em,.misres em{display:block;font-style:normal;font-size:12px;line-height:1.45;
  color:var(--ink);padding-left:14px;text-indent:-14px}
.crules em b,.misres em b{font-family:var(--mono);color:var(--ochre);margin-right:5px}
.misres em{font-size:11.5px}

.wsteps{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 10px}
.wstep{display:flex;align-items:center;gap:7px;font-family:var(--disp);font-weight:600;
  font-size:14px;background:var(--panel);border:1px solid var(--rule2);color:var(--ink2);
  border-radius:3px;padding:7px 12px;cursor:pointer}
.wstep span{font-family:var(--mono);font-size:10px;border:1px solid var(--rule2);
  border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;
  justify-content:center}
.wstep.on{border-color:var(--ochre);color:var(--ochre)}
.wstep.on span{border-color:var(--ochre)}
.wstep.done{color:var(--ink)}
.wstep.done span{background:var(--ochre);border-color:var(--ochre);color:#06181A}

.reqbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:7px;margin:16px 0}
.req{background:var(--panel);border:1px solid var(--rule2);border-left:3px solid var(--oxide);
  border-radius:3px;padding:7px 10px}
.req.ok{border-left-color:var(--ochre)}
.req b{display:block;font-family:var(--disp);font-weight:600;font-size:13.5px}
.req i{display:block;font-style:normal;font-family:var(--mono);font-size:10px;
  color:var(--ink2);margin-top:1px}

.trow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding:8px 0;border-bottom:1px solid var(--rule)}
.trow.dead{opacity:.45}
.tname{flex:1;min-width:150px}
.tname b{display:block;font-family:var(--disp);font-weight:600;font-size:16px}
.tname i{display:block;font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ink2)}
.tacts{display:flex;gap:4px}
.ph{font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:6px 8px;
  background:transparent;border:1px solid var(--rule2);border-radius:2px;
  color:var(--ink2);cursor:pointer;min-width:52px}
.ph.on{background:var(--ochre-bg);border-color:var(--ochre);color:var(--ochre)}
.ph:disabled{opacity:.35;cursor:not-allowed}

details.rule{border:1px solid var(--rule2);border-radius:3px;background:var(--panel);
  margin-bottom:6px}
details.rule>summary{cursor:pointer;padding:10px 12px;font-family:var(--disp);
  font-weight:600;font-size:16px;color:var(--ink)}
details.rule[open]>summary{border-bottom:1px solid var(--rule)}
details.rule>div{padding:10px 12px 12px}

.flow{margin:10px 0 26px}
.flow svg{width:100%;height:auto;color:var(--ink2)}
.flow text{font-family:var(--disp);font-weight:600;font-size:19px;fill:var(--ink)}
.flow text.cap{font-family:var(--mono);font-size:10px;letter-spacing:.16em;fill:var(--ink2);font-weight:400}
.flow text.sub{font-family:var(--mono);font-size:11px;fill:var(--ink2);font-weight:400}
.flow text.n{font-family:var(--disp);font-size:20px;font-weight:600;fill:var(--ochre)}
.flow text.edge{font-family:var(--mono);font-size:10px;fill:var(--ink2);font-weight:400}
.flow text.rot{text-anchor:middle}
.flow .src rect{fill:var(--panel);stroke:var(--rule2);stroke-width:1}
.flow .src text{text-anchor:middle;font-size:16px}
.flow .build rect{fill:var(--slate-bg);stroke:var(--rule2)}
.flow .build text{text-anchor:middle;font-family:var(--mono);font-size:12px;font-weight:400;fill:var(--ink)}
.flow .step rect{fill:var(--panel);stroke:var(--rule2);transition:none}
.flow .step:hover rect{stroke:var(--ochre)}
.flow .ln{stroke:var(--rule2);stroke-width:1.4;fill:none}
.flow .ln.dash{stroke-dasharray:4 4}

.hero{border-left:3px solid var(--ochre);padding:2px 0 2px 14px;margin:18px 0 22px}
.hero h2{font-family:var(--disp);font-weight:600;font-size:23px;line-height:1.25;margin-bottom:6px}
.hero p{font-size:14px;line-height:1.6;color:var(--ink2);max-width:62ch}

#viewHome .step{display:flex;gap:14px;align-items:flex-start;
  border-bottom:1px solid var(--rule);padding:16px 0}
#viewHome .sn{font-family:var(--disp);font-weight:600;font-size:20px;color:var(--ochre);
  border:1px solid var(--ochre);border-radius:50%;width:34px;height:34px;flex:0 0 34px;
  display:flex;align-items:center;justify-content:center}
#viewHome .sb{flex:1;min-width:0}
#viewHome .sb h3{font-family:var(--disp);font-weight:600;font-size:18px;margin-bottom:3px}
#viewHome .sb p{font-size:13.5px;line-height:1.6;color:var(--ink2);max-width:70ch;margin-bottom:5px}
#viewHome .sb p.tip{font-family:var(--mono);font-size:11px;color:var(--ink2);opacity:.85}
#viewHome .sb .btn{margin-top:6px;white-space:nowrap}

.limits{background:var(--panel);border:1px solid var(--rule2);border-radius:3px;
  padding:14px 16px;margin:18px 0}
.limits h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
.limits p{font-size:13px;line-height:1.6;color:var(--ink2);margin-bottom:7px;max-width:74ch}
.limits p:last-child{margin-bottom:0}
.limits b{color:var(--ink)}
.limits p.ok{color:var(--ochre)}
.limits p.warnt{color:var(--oxide)}

.sswitch{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.sswitch .chip{display:flex;flex-direction:column;align-items:flex-start;
  line-height:1.2;padding:7px 13px}
.sswitch .chip i{font-style:normal;font-family:var(--mono);font-size:9.5px;
  color:var(--ink2);margin-top:2px}
.sswitch .chip.on i{color:var(--ochre)}

.chip{font-family:var(--disp);font-weight:600;font-size:13.5px;padding:6px 11px;
  background:var(--panel);border:1px solid var(--rule2);border-radius:14px;
  color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--ochre)}
.chip.on{background:var(--ochre-bg);border-color:var(--ochre);color:var(--ochre)}

.misres{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.misres>div{background:var(--panel);border:1px solid var(--rule2);border-left:3px solid var(--ochre);
  border-radius:3px;padding:9px 12px}
.misres b{display:block;font-family:var(--disp);font-weight:600;font-size:17px}
.misres i{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-top:1px}
.misres .empty{grid-column:1/-1;border-left-color:var(--rule2)}

.score{width:100%;border-collapse:collapse;margin-bottom:6px}
.score th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink2);
  padding:4px 3px;border-bottom:1px solid var(--rule)}
.score th.who{text-align:left;font-family:var(--disp);font-size:14px;font-weight:600;
  color:var(--ink);letter-spacing:0;white-space:nowrap;padding-right:8px}
.score td{padding:3px 2px;border-bottom:1px solid var(--rule);text-align:center}
.score td input{width:100%;max-width:42px;text-align:center;font-family:var(--mono);
  font-size:13px;padding:4px 2px;background:var(--field);border:1px solid var(--rule);
  border-radius:2px;color:var(--ink);display:block;margin:0 auto 2px}
.score td.tot{font-family:var(--disp);font-weight:600;font-size:19px}
.score tr.sec-p th.who{color:var(--ink)}
.score tr.sec-s th.who{color:var(--ink2);font-weight:400;font-size:12.5px}
.score tr.sec-s td{border-bottom:2px solid var(--rule2)}
.score tr.sub th.who{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  color:var(--ink2);font-weight:400}
.score tr.sub td{border-bottom:none;padding-bottom:10px}
/* Casilla que llenan las cartas: se distingue de lo escrito a mano. */
.score td input.auto{border-style:dashed;border-color:var(--ochre);color:var(--ochre)}

.finder input{width:100%;margin-bottom:8px}
.fres{max-height:340px;overflow:auto;border:1px solid var(--rule);border-radius:2px}
.fres button{display:flex;width:100%;gap:8px;align-items:baseline;text-align:left;
  background:var(--panel);color:var(--ink);border:none;border-bottom:1px solid var(--rule);
  padding:8px 10px;cursor:pointer;font:inherit}
.fres button:hover{background:var(--ochre-bg);color:var(--ink)}
.fres b{flex:1;font-family:var(--disp);font-weight:600;font-size:15px}
.fres i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--ink2)}
.fres .fh{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink2);
  background:var(--field);padding:5px 10px;border-bottom:1px solid var(--rule)}

/* ---- manifest header: el bloque de control documental ---- */
header{border-bottom:2px solid var(--rule2);margin-bottom:20px}
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px 0 12px;flex-wrap:wrap}
h1{font-family:var(--disp);font-weight:600;font-size:32px;letter-spacing:.01em;line-height:.95}
h1 small{display:block;font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.14em;color:var(--ink2);margin-top:6px}
.stamp{font-family:var(--mono);font-size:11px;line-height:1.7;color:var(--ink2);text-align:right;white-space:nowrap}
.stamp b{font-weight:500;color:var(--ink)}

/* ---- controles ---- */
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
select,input[type=search],input[type=text]{
  font:inherit;background:var(--panel);color:var(--ink);
  border:1px solid var(--rule2);border-radius:2px;padding:9px 11px;
}
select{font-family:var(--disp);font-weight:600;font-size:16px;flex:1 1 220px}
input[type=search]{flex:2 1 200px}
input[type=search]::placeholder{color:var(--ink2)}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

.filters{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-bottom:18px}
.filters label{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.filters input{accent-color:var(--ochre);width:15px;height:15px}

/* ---- líneas del manifiesto ---- */
.group{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--ink2);
  border-bottom:2px solid var(--rule2);padding-bottom:5px;margin:26px 0 2px}
.group:first-of-type{margin-top:0}
.role{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink);
  border-bottom:1px solid var(--rule);padding:14px 0 4px;margin-bottom:2px}
.role span{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--ink2);letter-spacing:.04em}

.line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule)}
.line.owned{background:linear-gradient(90deg,rgba(57,198,192,.10),transparent 60%)}
.id{flex:1;min-width:0}
.nm{font-family:var(--disp);font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.meta{font-family:var(--mono);font-size:11px;color:var(--ink2);margin-top:2px}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  padding:1px 5px;border-radius:2px;margin-right:6px;vertical-align:1px}
.t-leg{background:var(--oxide-bg);color:var(--oxide)}
.t-cru{background:var(--slate-bg);color:var(--slate)}

/* ---- stepper ---- */
.step{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.step button{
  font-family:var(--mono);font-size:17px;line-height:1;width:34px;height:34px;
  background:var(--panel);border:1px solid var(--rule2);color:var(--ink);
  cursor:pointer;border-radius:2px;
}
.step button:hover{background:var(--rule);border-color:var(--ochre)}
.step button:active{background:var(--ochre-bg)}
.step input{
  font-family:var(--mono);font-size:15px;font-weight:500;text-align:center;
  width:52px;height:34px;background:transparent;border:none;color:var(--ink);
}
.step input.zero{color:var(--rule2)}

/* ---- barra inferior ---- */
.totals{
  position:fixed;left:0;right:0;bottom:0;background:var(--panel);color:var(--ink);
  border-top:2px solid var(--rule2);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.totals .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0;flex-wrap:wrap}
.count{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.count b{font-family:var(--disp);font-weight:600;font-size:22px;color:var(--ink);margin-right:3px}
.acts{display:flex;gap:6px}
.acts button{
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:8px 12px;
  background:transparent;border:1px solid var(--rule2);border-radius:2px;
  color:var(--ink);cursor:pointer
}
.acts button:hover:not(:disabled){border-color:var(--ochre);background:var(--rule)}
.acts button:disabled{opacity:.4;cursor:not-allowed}

.note{font-family:var(--mono);font-size:12px;color:var(--ink2);padding:28px 0;line-height:1.8}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--rule2);margin-bottom:18px}
.tabs button{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.08em;

<body>

<div class="wrap" id="shell">
  <header>
    <div class="masthead">
      <h1>Armoury<small>COLLECTION MANIFEST</small></h1>
      <div class="stamp" id="stamp">LOADING…</div>
    </div>
  </header>

  <div id="printArea"></div>
  <div id="fatal" hidden></div>

  <div class="tabs" role="tablist">
    <button id="tabHome" role="tab" aria-selected="false">Start</button>
    <button id="tabCol" role="tab" aria-selected="true">Collection</button>
    <button id="tabList" role="tab" aria-selected="false">Lists</button>
    <button id="tabBattle" role="tab" aria-selected="false">Battles</button>
    <button id="tabStats" role="tab" aria-selected="false">Stats</button>
  </div>

  <div id="viewStats" hidden></div>

  <div id="viewBattles" hidden></div>

  <div id="viewHome" hidden></div>
  <div id="viewLists" hidden></div>

  <div id="viewCol">
  <div class="controls">
    <input type="text" id="cname" placeholder="Name this collection…" aria-label="Collection name"
           style="flex:1 1 100%;font-family:var(--disp);font-weight:600;font-size:18px;
                  background:transparent;border:none;border-bottom:1px solid var(--rule2);
                  padding:4px 0;color:var(--ink);border-radius:0">
    <select id="faction" aria-label="Faction"></select>
    <input type="search" id="q" placeholder="Search unit…" aria-label="Search unit">
  </div>

  <div class="filters">
    <label><input type="checkbox" id="fOwned"> Owned only</label>
    <label><input type="checkbox" id="fLegends" checked> Show Legends</label>
    <label><input type="checkbox" id="fCrucible" checked> Show Crucible</label>
    <label style="margin-left:auto">Group by
      <select id="groupBy" style="flex:none;font-size:13px;padding:4px 6px">
        <option value="role">Role</option>
        <option value="mode">Legality</option>
        <option value="name">Name only</option>
      </select>
    </label>
  </div>

  <div id="list"></div>
  </div>
</div>

<div class="totals">
  <div class="wrap">
    <div class="count">
      <b id="tModels">0</b>models
      <b id="tUnits" style="margin-left:12px">0</b>entries
      <b id="tPts" style="margin-left:12px">0</b><span title="Estimate: models packed into the largest units. Actual cost depends on how you split them in a list.">pts approx.</span>
    </div>
    <div class="acts">
      <button id="bExport">EXPORT</button>
      <button id="bImport">IMPORT</button>
    </div>
  </div>
</div>

<script>
/*__DATA__*/
/* ============================================================
   ALMACENAMIENTO — IndexedDB
   Guardamos SOLO { id, qty }. Nada de puntos ni nombres: eso
   vive en collection-data.json y se actualiza solo. Si guardáramos
   el nombre, quedaría desactualizado cuando GW renombre la unidad.
   ============================================================ */
const DB_NAME = 'armoury';

/* ------------------------------------------------------------------
 * Tres niveles, en orden de preferencia:
 *
 *   idb → IndexedDB. Lo normal cuando la app se sirve por http/https.
 *   ls  → localStorage. Chrome BLOQUEA IndexedDB en file://, y sin este
 *         respaldo la app queda inservible al abrirla con doble clic.
 *   mem → sólo memoria. Último recurso: se pierde al cerrar, así que la
 *         app lo dice en pantalla en vez de fingir que guardó.
 *
 * Los datos son chicos (colección + listas), así que localStorage sobra.
 * ---------------------------------------------------------------- */
const NS = { col: 'collection', lists: 'lists', battles: 'battles', misc: 'misc' };
let db = null;

const store = {
  mode: 'mem',
  mem: { collection: new Map(), lists: new Map() },

  async init(){
    if (await this._tryIdb())  { this.mode = 'idb'; return; }
    if (this._tryLocal())      { this.mode = 'ls';  return; }
    this.mode = 'mem';
  },

  _tryIdb(){
    return new Promise((ok) => {
      let done = false;
      const finish = (v) => { if (!done) { done = true; ok(v); } };
      try {
        if (!self.indexedDB) return finish(false);
        const r = indexedDB.open(DB_NAME, 4);
        r.onupgradeneeded = () => {
          const d = r.result;
          for (const name of Object.values(NS))
            if (!d.objectStoreNames.contains(name)) d.createObjectStore(name, { keyPath:'id' });
        };
        r.onsuccess = () => { db = r.result; db.onversionchange = () => db.close(); finish(true); };
        r.onerror   = () => finish(false);
        r.onblocked = () => finish(false);
        setTimeout(() => finish(false), 2500);   // file:// nunca contesta
      } catch { finish(false); }
    });
  },

  _tryLocal(){
    try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }
    catch { return false; }
  },

  _lsKey(ns){ return 'armoury:' + NS[ns]; },
  _lsRead(ns){ try { return JSON.parse(localStorage.getItem(this._lsKey(ns)) || '[]'); } catch { return []; } },
  _lsWrite(ns, arr){ localStorage.setItem(this._lsKey(ns), JSON.stringify(arr)); },

  getAll(ns){
    if (this.mode === 'idb') {
      return new Promise((ok) => {
        try { db.transaction(NS[ns],'readonly').objectStore(NS[ns]).getAll().onsuccess = e => ok(e.target.result); }
        catch { ok([]); }
      });
    }
    if (this.mode === 'ls') return Promise.resolve(this._lsRead(ns));
    return Promise.resolve([...this.mem[NS[ns]].values()]);
  },

  put(ns, obj){
    if (this.mode === 'idb') {
      try { db.transaction(NS[ns],'readwrite').objectStore(NS[ns]).put(obj); } catch {}
      return;
    }
    if (this.mode === 'ls') {
      const arr = this._lsRead(ns).filter(x => x.id !== obj.id);
      arr.push(obj); this._lsWrite(ns, arr); return;
    }
    this.mem[NS[ns]].set(obj.id, obj);
  },

  del(ns, id){
    if (this.mode === 'idb') {
      try { db.transaction(NS[ns],'readwrite').objectStore(NS[ns]).delete(id); } catch {}
      return;
    }
    if (this.mode === 'ls') { this._lsWrite(ns, this._lsRead(ns).filter(x => x.id !== id)); return; }
    this.mem[NS[ns]].delete(id);
  },

  wipe(){
    try { localStorage.removeItem(this._lsKey('col')); localStorage.removeItem(this._lsKey('lists')); } catch {}
    this.mem.collection.clear(); this.mem.lists.clear();
    try { db && db.close(); } catch {}
    try {
      const d = indexedDB.deleteDatabase(DB_NAME);
      d.onsuccess = d.onerror = d.onblocked = () => location.reload();
      setTimeout(() => location.reload(), 1200);
    } catch { location.reload(); }
  },
};

function saveQty(id, qty){ qty > 0 ? store.put('col', { id, qty }) : store.del('col', id); }
function loadAll(){ return store.getAll('col'); }

/* ============================================================
   ESTADO
   ============================================================ */
let DATA = null;             // collection-data.json
const owned = new Map();     // id -> cantidad de miniaturas

/* ============================================================
   ARRANQUE
   ============================================================ */
function fatal(e){
  const msg  = (e && e.message) ? e.message : String(e);
  const line = (e && e.stack) ? e.stack.split('\n').slice(0,3).join('\n') : '';

  document.getElementById('stamp').textContent = 'ERROR';

  // La banda vive FUERA de las pestañas: un error que se esconde al cambiar
  // de pestaña es un error invisible.
  const box = document.getElementById('fatal');
  box.hidden = false;
  box.innerHTML =
    '<h2>Something went wrong</h2>' +
    '<p>' + escSafe(msg) + '</p>' +
    '<pre>' + escSafe(line) + '</pre>' +
    '<p>If closing other tabs did not help, wiping local storage usually does. ' +
    'Your collection is only stored in this browser, so export it first if you can.</p>';

  const b = document.createElement('button');
  b.className = 'btn';
  b.textContent = 'WIPE LOCAL STORAGE AND RELOAD';
  b.onclick = () => {
    if (!confirm('This deletes your collection and all lists from this browser. ' +
                 'There is no undo. Continue?')) return;
    store.wipe();
  };
  box.appendChild(b);
}

// Versión a prueba de todo: fatal() puede correr antes de que esc() exista.
function escSafe(v){
  return String(v).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

async function boot(){
  try { await start(); }
  catch (e) { fatal(e); }
}

async function start(){
  await store.init();
  for (const row of await loadAll()) {
    if (row.id === '__name__') { document.getElementById('cname').value = row.qty; continue; }
    // Claves internas: la versión anterior guardó la biblioteca acá y
    // aparecía como una miniatura con una cantidad absurda.
    if (String(row.id).startsWith('__')) { store.del('col', row.id); continue; }
    if (typeof row.qty !== 'number') continue;
    owned.set(row.id, row.qty);
  }
  document.getElementById('cname').addEventListener('input', e => {
    store.put('col', { id: '__name__', qty: e.target.value });
  });

  // 1) Datos incrustados (armoury.html, doble clic). 2) Si no, fetch (Pages).
  if (window.__ARMOURY_DATA__) {
    DATA = window.__ARMOURY_DATA__;
  } else {
    try {
      const res = await fetch('./collection-data.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      DATA = await res.json();
    } catch (e) {
      document.getElementById('list').innerHTML =
        '<p class="note"><b>No catalogue in this file.</b><br><br>' +
        'Run <code>node prepare-data.mjs</code> to rebuild index.html with the ' +
        'catalogue embedded.</p>';
      document.getElementById('stamp').textContent = 'NO CATALOGUE';
      document.getElementById('bExport').disabled = true;
      document.getElementById('bImport').disabled = true;
      return;
    }
  }

  const stamp = document.getElementById('stamp');
  stamp.innerHTML =
    'BUILD <b>' + (DATA.build ?? '—') + '</b><br>' +
    'CATALOGUE <b>' + (DATA.revision?.sha ?? '—') + '</b>' +
      (DATA.mfmVersion ? ' \u00b7 MFM <b>' + DATA.mfmVersion + '</b>' : '') + '<br>' +
    'FACTIONS <b>' + DATA.factions.length + '</b> \u00b7 UNITS <b>' +
      DATA.factions.reduce((a, f) => a + f.units.length, 0) + '</b>';

  const sel = document.getElementById('faction');
  for (const group of ['Imperium','Chaos','Xenos','Otros']) {
    const fs = DATA.factions.filter(f => f.group === group);
    if (!fs.length) continue;
    const og = document.createElement('optgroup');
    og.label = group;
    for (const f of fs) {
      const o = document.createElement('option');
      o.value = f.slug; o.textContent = f.name;
      og.appendChild(o);
    }
    sel.appendChild(og);
  }

  ['faction','q','fOwned','fLegends','fCrucible','groupBy'].forEach(id =>
    document.getElementById(id).addEventListener('input', render));

  lists = await loadLists();
  battles = await loadBattles();
  await loadLib();

  await loadPool();
  await loadFeed();

  // Limpieza: la versión anterior guardaba el borrador del formulario antes
  // de apretar CREATE, así que pudieron quedar listas vacías sin nombre.
  const ghosts = lists.filter(l => !l.name && (!l.slots || !l.slots.length));
  for (const g of ghosts) store.del('lists', g.id);
  if (ghosts.length) lists = lists.filter(l => !ghosts.includes(l));

  // Migración: antes se guardaba UN destacamento como texto. En 11e se
  // llevan varios, hasta gastar el presupuesto de DP.
  for (const l of lists) {
    if (!Array.isArray(l.dets)) {
      l.dets = l.detachment ? [l.detachment] : [];
      delete l.detachment;
      saveList(l);
    }
  }

  pruneGear();

  // Si el navegador negó el almacenamiento normal, hay que decirlo. Guardar
  // en silencio en un sitio que se borra al cerrar es peor que no guardar.
  if (store.mode !== 'idb') {
    const w = document.getElementById('fatal');
    w.hidden = false;
    w.style.borderColor = 'var(--ochre)';
    w.style.background  = 'var(--ochre-bg)';
    w.innerHTML = store.mode === 'ls'
      ? '<h2>Limited storage</h2><p>This browser blocks the normal database for ' +
        'files opened from disk, so Armoury is using a simpler store. It works, ' +
        'but it is easier to lose \u2014 export a backup regularly, or publish the ' +
        'app to a URL.</p>'
      : '<h2>Nothing will be saved</h2><p>This browser is blocking all storage for ' +
        'local files. You can browse and compose, but everything disappears when you ' +
        'close the tab. Use EXPORT before leaving, or publish the app to a URL.</p>';
  }

  render();
  updateTotals();

  // Primera visita: sin colección ni listas, la guía es más útil que una
  // pantalla vacía de 1485 unidades.
  if (!owned.size && !lists.length) showTab('home');
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const slug   = document.getElementById('faction').value;
  const q      = document.getElementById('q').value.trim().toLowerCase();
  const onlyOw = document.getElementById('fOwned').checked;
  const showL  = document.getElementById('fLegends').checked;
  const showC  = document.getElementById('fCrucible').checked;

  const list = document.getElementById('list');
  list.innerHTML = '';

  // El select puede estar vacío en el primer render o traer un slug viejo
  // guardado de una versión anterior de los datos. Sin esta guarda, la app
  // revienta con "Cannot read properties of undefined".
  const faction = DATA.factions.find(f => f.slug === slug) ?? DATA.factions[0];
  if (!faction) { list.innerHTML = '<p class="note">No factions in the catalogue.</p>'; return; }

  let units = faction.units.filter(u => {
    if (u.m === 'legends'  && !showL) return false;
    if (u.m === 'crucible' && !showC) return false;
    if (onlyOw && !(owned.get(u.id) > 0)) return false;
    if (q && !u.n.toLowerCase().includes(q)) return false;
    return true;
  });

  if (!units.length) {
    list.innerHTML = '<p class="note">No entries match. Clear the search or turn a filter back on.</p>';
    return;
  }

  const modeOrder  = { standard:0, legends:1, crucible:2 };
  const modeLabels = { standard:'MATCHED PLAY', legends:'LEGENDS', crucible:'CRUCIBLE' };
  const roleOrder  = new Map(DATA.roles.map((r,i) => [r.id, i]));
  const roleLabels = new Map(DATA.roles.map(r => [r.id, r.label]));

  const groupBy = document.getElementById('groupBy').value;

  if (groupBy === 'name') {
    units.sort((a,b) => a.n.localeCompare(b.n));
    for (const u of units) list.appendChild(lineFor(u));
    return;
  }

  // Siempre se corta primero por legalidad: mezclar Legends con matched play
  // en la misma lista de roles hace que el jugador arme listas ilegales sin verlo.
  units.sort((a,b) =>
    modeOrder[a.m] - modeOrder[b.m] ||
    (groupBy === 'role' ? roleOrder.get(a.r) - roleOrder.get(b.r) : 0) ||
    a.n.localeCompare(b.n)
  );

  let curMode = null, curRole = null;
  for (const u of units) {
    if (u.m !== curMode) {
      curMode = u.m; curRole = null;
      const h = document.createElement('div');
      h.className = 'group';
      h.textContent = modeLabels[u.m];
      list.appendChild(h);
    }
    if (groupBy === 'role' && u.r !== curRole) {
      curRole = u.r;
      const n = units.filter(x => x.m === curMode && x.r === curRole).length;
      const owns = units
        .filter(x => x.m === curMode && x.r === curRole)
        .reduce((s,x) => s + (owned.get(x.id) ?? 0), 0);
      const h = document.createElement('div');
      h.className = 'role';
      h.innerHTML = '<div>' + roleLabels.get(u.r) + '</div>' +
                    '<span>' + (owns ? owns + ' models · ' : '') + n + ' entries</span>';
      list.appendChild(h);
    }
    list.appendChild(lineFor(u));
  }
}

function lineFor(u){
  const qty = owned.get(u.id) ?? 0;

  const row = document.createElement('div');
  row.className = 'line' + (qty ? ' owned' : '');

  const tag = u.m === 'legends'  ? '<span class="tag t-leg">LEGENDS</span>'
            : u.m === 'crucible' ? '<span class="tag t-cru">CRUCIBLE</span>' : '';

  const info = document.createElement('div');
  info.className = 'id';
  // Escalera de precios: 170 pts @10 · 330 @20. El coste base miente en el
  // 18 % de las entradas — Khorne Berzerkers valen 170 o 330 según el tamaño.
  let price;
  if (u.L) {
    price = u.L.map(([from, pts]) => pts + ' @' + from + '+').join(' · ');
  } else if (u.p != null) {
    price = u.p + ' pts';
  } else {
    price = 'no pts';
  }

  info.innerHTML =
    '<div class="nm">' + esc(u.n) + '</div>' +
    '<div class="meta">' + tag + price +
      (u.max > 1 ? ' · max ' + u.max : '') +
    '</div>';

  const step = document.createElement('div');
  step.className = 'step';

  const minus = mkBtn('−', 'Remove one ' + u.n);
  const input = document.createElement('input');
  input.type = 'text'; input.inputMode = 'numeric';
  input.value = qty; input.setAttribute('aria-label', 'Models owned: ' + u.n);
  if (!qty) input.classList.add('zero');
  const plus = mkBtn('+', 'Add one ' + u.n);

  const set = v => {
    const n = Math.max(0, Math.min(999, v|0));
    owned.set(u.id, n);
    saveQty(u.id, n);
    input.value = n;
    input.classList.toggle('zero', n === 0);
    row.classList.toggle('owned', n > 0);
    updateTotals();
  };

  minus.onclick = () => set((owned.get(u.id) ?? 0) - 1);
  plus.onclick  = () => set((owned.get(u.id) ?? 0) + 1);
  input.onchange = () => set(parseInt(input.value, 10) || 0);

  step.append(minus, input, plus);
  row.append(info, step);

  // Ficha desplegable. Va aparte de la fila para no romper la alineación.
  if (hasSheet(u)) {
    const wrap = document.createElement('div');
    const tog = mkBtn('', 'Datasheet for ' + u.n);
    tog.className = 'tog'; tog.textContent = 'DATASHEET';
    tog.style.cssText = 'width:auto;height:auto;margin:0 0 0 8px';
    let open = false, sheet = null;
    tog.onclick = () => {
      open = !open;
      if (open) { sheet = datasheetFor(u); wrap.append(sheet); }
      else if (sheet) { sheet.remove(); sheet = null; }
    };
    step.append(tog);
    wrap.append(row);
    return wrap;
  }
  return row;
}

function mkBtn(txt, label){
  const b = document.createElement('button');
  b.textContent = txt; b.setAttribute('aria-label', label);
  return b;
}
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ------------------------------------------------------------------
 * VALOR ESTIMADO
 *
 * Una colección no tiene un total de puntos exacto. 20 Berzerkers valen
 * 330 como una unidad de 20, o 340 como dos de 10. El número depende de
 * cómo los repartas, y eso se decide al armar la lista.
 *
 * Acá se calcula el escenario más barato: empaquetar en las unidades más
 * grandes posibles. Por eso dice "approx.".
 *
 * Los tamaños salen del umbral de la escalera: si el precio sube a partir
 * de 11 modelos, las unidades son de 10 y 20. Verificado contra el
 * catálogo (Berzerkers 11→10/20, Terminators 6→5/10, Eightbound 4→3/6).
 * ---------------------------------------------------------------- */
function unitOptions(u){
  if (u.L && u.L.length >= 2) {
    const small = u.L[0], big = u.L[1];
    return [
      { size: big[0] - 1 + (big[0] - 1), pts: big[1] },   // 2×(umbral−1)
      { size: small[0] + (big[0] - 1) - 1, pts: small[1] } // umbral−1
    ].map((o, i) => i === 0
        ? { size: (big[0] - 1) * 2, pts: big[1] }
        : { size: big[0] - 1,       pts: small[1] });
  }
  if (u.p == null) return [];
  return [{ size: (u.max && u.max > 1) ? u.max : 1, pts: u.p }];
}

function valueOf(u, models){
  const opts = unitOptions(u).sort((a, b) => b.size - a.size);
  if (!opts.length) return 0;
  let left = models, total = 0;
  for (const o of opts) {
    while (left >= o.size) { total += o.pts; left -= o.size; }
  }
  if (left > 0) total += opts[opts.length - 1].pts;   // resto: una unidad chica
  return total;
}

let UNIT_BY_ID = null;
function unitById(id){
  if (!UNIT_BY_ID) {
    UNIT_BY_ID = new Map();
    for (const f of DATA.factions) for (const u of f.units) if (!UNIT_BY_ID.has(u.id)) UNIT_BY_ID.set(u.id, u);
  }
  return UNIT_BY_ID.get(id);
}

function updateTotals(){
  let models = 0, entries = 0, pts = 0;
  for (const [id, n] of owned) {
    if (n <= 0) continue;
    models += n; entries++;
    const u = unitById(id);
    if (u) pts += valueOf(u, n);
  }
  document.getElementById('tModels').textContent = models;
  document.getElementById('tUnits').textContent  = entries;
  document.getElementById('tPts').textContent    = pts.toLocaleString();
}

/* ============================================================
   EXPORTAR / IMPORTAR — el respaldo del usuario en la v0.
   schemaVersion existe para que un archivo viejo siga siendo
   legible cuando el formato cambie.
   ============================================================ */
document.getElementById('bExport').onclick = () => {
  const payload = {
    schemaVersion: 1,
    name: document.getElementById('cname').value || null,
    exportedAt: new Date().toISOString(),
    dataRevision: DATA?.revision?.sha ?? null,
    items: [...owned].filter(([,q]) => q > 0).map(([id,qty]) => ({ id, qty })),
  };
  const url = URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)], {type:'application/json'}));
  const a = document.createElement('a');
  a.href = url;
  const slug = (payload.name || 'armoury').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  a.download = slug + '-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('bImport').onclick = () => {
  const f = document.createElement('input');
  f.type = 'file'; f.accept = 'application/json';
  f.onchange = async () => {
    try {
      const data = JSON.parse(await f.files[0].text());
      if (!Array.isArray(data.items)) throw new Error('no items');
      if (data.name) {
        document.getElementById('cname').value = data.name;
        store.put('col', { id: '__name__', qty: data.name });
      }
      for (const it of data.items) {
        owned.set(it.id, it.qty);
        saveQty(it.id, it.qty);
      }
      render(); updateTotals();
    } catch {
      alert('That is not an Armoury backup.\n\nIMPORT only restores a file you ' +
            'previously saved with EXPORT. It is not for collection-data.json — ' +
            'the catalogue loads on its own.');
    }
  };
  f.click();
};

/* ============================================================
   LISTAS — compositor, no validador.
   
   Lo que SÍ verifica: total contra el tope de puntos, tope de
   repetición por unidad, legalidad de Legends y Crucible según el
   formato, y si tenés las miniaturas en la colección.
   
   Lo que NO: mejoras, mínimos de línea, enganche de personajes,
   restricciones propias del destacamento, armamento. Por eso la app
   nunca dice "válida" — dice qué revisó y qué no.
   ============================================================ */
let lists = [];        // [{ id, name, faction, detachment, limit, legends, crucible, slots:[{unitId,size}] }]
let editing = null;    // id de la lista abierta, o null
let selected = null;   // índice del slot abierto en el panel derecho
let picking = false;   // buscador de unidades abierto
let wizard  = false;   // asistente paso a paso

function saveList(l){ store.put('lists', l); }
function loadLists(){ return store.getAll('lists'); }

/* Tamaños de unidad posibles. Con escalera: umbral−1 y su doble
   (Berzerkers 11 → 10 y 20). Sin escalera: una sola opción. */
/* Tamaños posibles. Con MFM (u.B) son los oficiales; si no, se deducen del
 * salto de precio de BSData, que es una aproximación. */
function sizesFor(u){
  if (u.B && u.B.length) return u.B[0].s.map(([n, pts]) => ({ n, pts }));
  if (u.L && u.L.length >= 2) {
    const small = u.L[0][1], t = u.L[1][0], big = u.L[1][1];
    return [{ n: t - 1, pts: small }, { n: (t - 1) * 2, pts: big }];
  }
  return [{ n: (u.max && u.max > 1) ? u.max : 1, pts: u.p ?? 0 }];
}

/* UMBRALES DE REQUISICIÓN: repetir una unidad la encarece.
 * Chaos Terminators cuesta 165 las dos primeras veces y 175 de la tercera
 * en adelante. `copy` es el número de copia (1 = la primera). */
function ptsFor(u, size, copy = 1){
  if (u.B && u.B.length) {
    const band = u.B.find(b => copy >= b.f && (b.t == null || copy <= b.t)) ?? u.B[u.B.length - 1];
    const hit = band.s.filter(([n]) => n <= size).pop() ?? band.s[0];
    return hit ? hit[1] : 0;
  }
  const s = sizesFor(u).filter(x => x.n <= size).pop();
  return s ? s.pts : (sizesFor(u)[0]?.pts ?? 0);
}

/* Número de copia de cada slot: cuántas veces apareció ya esa unidad. */
function copyIndex(l){
  const seen = new Map(), out = [];
  for (const sl of l.slots) {
    const n = (seen.get(sl.unitId) ?? 0) + 1;
    seen.set(sl.unitId, n);
    out.push(n);
  }
  return out;
}

function factionOf(slug){ return DATA.factions.find(f => f.slug === slug); }

/* Destacamentos y mejoras HEREDANDO de los catálogos enlazados.
 * Ultramarines no declara ninguno propio: los toma de Space Marines, igual
 * que las unidades. Sin esto el selector quedaba vacío y caía al campo libre. */
function detsOf(f){
  if (!f) return [];
  if (f.det && f.det.length) return f.det;
  for (const slug of (f.al || [])) {
    const alt = factionOf(slug);
    if (alt && alt.det && alt.det.length) return alt.det;
  }
  return [];
}

function enhByOf(f){
  if (!f) return null;
  if (f.enhBy) return f.enhBy;
  for (const slug of (f.al || [])) {
    const alt = factionOf(slug);
    if (alt && alt.enhBy) return alt.enhBy;
  }
  return null;
}

/* Repertorio de una lista: las unidades propias MÁS las de los catálogos
 * enlazados. Un ejército Ultramarines lleva 11 unidades propias y las 136
 * genéricas de Space Marines; ofrecerle sólo las 11 era el bug.
 *
 * La COLECCIÓN no usa esto: ahí cada miniatura se carga una sola vez, en su
 * facción, o los Intercessors aparecerían en trece capítulos. */
function poolOf(l){
  const own = factionOf(l.faction);
  if (!own) return [];
  const out = own.units.map((u) => ({ u, from: null }));
  for (const slug of (own.al || [])) {
    const alt = factionOf(slug);
    if (!alt) continue;
    for (const u of alt.units) out.push({ u, from: alt.name });
  }
  return out;
}

/* Busca una unidad en todo el repertorio, no sólo en la facción propia. */
function unitOf(l, id){
  const own = factionOf(l.faction);
  const mine = own && own.units.find((x) => x.id === id);
  if (mine) return mine;
  for (const slug of (own?.al || [])) {
    const alt = factionOf(slug);
    const hit = alt && alt.units.find((x) => x.id === id);
    if (hit) return hit;
  }
  return null;
}

/* ---------- revisión: devuelve avisos, nunca un booleano "válida" ---------- */
function review(l){
  const f = factionOf(l.faction);
  if (!f) return { total: 0, issues: [{ hard:true, t:'Faction missing', d:'Not in the current catalogue.' }] };
  const out = [];
  let total = 0;

  const byUnit = new Map();
  const needed = new Map();

  const copies = copyIndex(l);
  for (const [si, s] of l.slots.entries()) {
    const u = unitOf(l, s.unitId);
    if (!u) { out.push({ hard:true, t:'Entry removed from the catalogue', d:'This unit no longer exists in the current data.' }); continue; }
    const copy = copies[si];
    total += ptsFor(u, s.size, copy) + gearPoints(u, s);
    if (u.B && u.B.length > 1 && copy >= u.B[1].f)
      out.push({ hard:false, t:u.n + ': copy #' + copy + ' costs more',
                 d:'Requisition threshold \u2014 ' + ptsFor(u, s.size, copy) + ' instead of ' + ptsFor(u, s.size, 1) + '.' });
    byUnit.set(u.id, (byUnit.get(u.id) ?? 0) + 1);
    needed.set(u.id, (needed.get(u.id) ?? 0) + s.size);

    if (u.m === 'legends'  && !l.legends)  out.push({ hard:true, t:u.n + ' is Legends', d:'Not allowed under this list\u2019s format.' });
    if (u.m === 'crucible' && !l.crucible) out.push({ hard:true, t:u.n + ' is Crucible', d:'Not allowed under this list\u2019s format.' });
  }

  // Puntos de destacamento. El presupuesto por tamaño de partida NO está en
  // el dato (las entradas de Battle Size no traen costLimits), así que se usa
  // el valor de las reglas: 3 en Strike Force. Es lo único acá que no sale
  // del catálogo, y por eso es aviso suave.
  const dets = l.dets || [];
  if (dets.length && detsOf(f).length) {
    const info = new Map(detsOf(f).map((d) => [d[0], d]));
    const spent = dets.reduce((a, n) => a + (info.get(n)?.[1] ?? 0), 0);
    const budget = dpBudget(l);
    if (spent > budget)
      out.push({ hard:true, t:'Over the DP budget', d:spent + ' DP spent, ' + budget + ' available.' });

    // Etiqueta Unique: dos destacamentos con la misma no se combinan.
    const tags = new Map();
    for (const n of dets) {
      const u = info.get(n)?.[3];
      if (!u) continue;
      if (tags.has(u))
        out.push({ hard:true, t:'Two "' + u + '" detachments', d:tags.get(u) + ' and ' + n + ' share a unique tag.' });
      else tags.set(u, n);
    }
  }

  // TOPE DE PUNTOS ALIADOS.
  //
  // Algunos ejércitos admiten unidades de otra facción hasta cierto gasto:
  // World Eaters lleva BLOOD LEGIONS por 500 pts en Incursion, 1000 en Strike
  // Force y 1500 en Onslaught. Sale del catálogo, no de una regla escrita acá.
  if ((f.ally || []).length) {
    const spentBy = new Map();
    for (const [si, sl] of l.slots.entries()) {
      const u = unitOf(l, sl.unitId);
      if (!u || !u.fc) continue;
      const pts = ptsFor(u, sl.size, copies[si]) + gearPoints(u, sl);
      spentBy.set(u.fc, (spentBy.get(u.fc) ?? 0) + pts);
    }
    for (const [name, by] of f.ally) {
      const cap = by[l.limit];
      const spent = spentBy.get(name) ?? 0;
      if (!spent) continue;
      if (cap == null) {
        out.push({ hard:false, t:name + ': ' + spent + ' pts',
                   d:'No cap declared for a ' + l.limit + ' pt game.' });
      } else if (spent > cap) {
        out.push({ hard:true, t:name + ' over its allowance',
                   d:spent + ' / ' + cap + ' pts allowed at ' + l.limit + '.' });
      }
    }
  }

  // La misión tiene que venir de alguno de los destacamentos elegidos.
  const missions = missionsFor(l, f);
  if (missions.size) {
    if (!l.mission)
      out.push({ hard:false, t:'No mission chosen',
                 d:'Your detachments offer: ' + [...missions.keys()].join(', ') + '.' });
    else if (!missions.has(l.mission))
      out.push({ hard:true, t:'Mission does not match your detachments',
                 d:l.mission + ' is not offered by ' + (l.dets || []).join(' or ') + '.' });
  }

  // Las mejoras cargadas a mano suman al total.
  for (const e of (l.enh || [])) total += +e.pts || 0;

  if (total > l.limit)
    out.push({ hard:true, t:'Over the points limit', d:(total - l.limit) + ' pts above ' + l.limit + '.' });

  for (const [id, times] of byUnit) {
    const u = unitOf(l, id);
    if (!u?.c) continue;
    const cap = (l.limit <= 1000 && u.c.at1000 != null) ? u.c.at1000 : u.c.max;
    if (times > cap)
      out.push({ hard:true, t:u.n + ' \u00d7' + times, d:'Maximum ' + cap + ' in a ' + l.limit + ' pt army.' });
  }

  // Enganche de líderes. Los destinos salen de leer la regla `Leader`, que es
  // prosa, no dato estructurado. Por eso es aviso suave: si la redacción cambia
  // en BSData, prefiero equivocarme avisando de más que bloquear una lista legal.
  for (const [i, sl] of l.slots.entries()) {
    const u = unitOf(l, sl.unitId);
    if (!u || !u.ld) continue;
    // Ir suelto es legal: muchos personajes operan solos. No se avisa.
    if (!sl.attach) continue;
    const host = l.slots[sl.attach - 1];
    const hu = host && unitOf(l, host.unitId);
    if (!hu || !u.ld.includes(hu.id))
      out.push({ hard:false, i, t:u.n + ' cannot lead that unit', d:'Its Leader rule lists other targets.' });
  }

  // Variantes de arma que superan el tamaño de la unidad.
  //
  // Se cuenta POR GRUPO, no sumando todo: la pistola del campeón y las
  // variantes de la tropa son grupos distintos y sumarlos no significa nada.
  //
  // Y se ignoran las claves cuyo grupo ya no existe en el catálogo. Sin esto,
  // valores guardados por una versión vieja de la app siguen contando aunque
  // la interfaz ya no los muestre — invisibles e imposibles de corregir.
  for (const sl of l.slots) {
    if (!sl.gear) continue;
    const u = unitOf(l, sl.unitId);
    if (!u || !u.o || !u.o.length) continue;

    const perGroup = new Map();
    for (const [k, v] of Object.entries(sl.gear)) {
      if (typeof v !== 'number') continue;
      const [gi, oi] = k.split(':').map(Number);
      const g = u.o[gi];
      if (!g || g.k !== 'many' || !g.opts[oi]) continue;   // clave huérfana
      perGroup.set(gi, (perGroup.get(gi) ?? 0) + v);

      // Tope propio de la opción, ya escalado al tamaño de la unidad.
      const cap = capFor(g.opts[oi], sl.size, u, g, sl);
      if (cap != null && v > cap)
        out.push({ hard:false, t:u.n + ' \u2014 ' + g.opts[oi][0] + ': ' + v,
                   d:'Maximum ' + cap + ' in a unit of ' + sl.size + '.' });
    }

    // Suma del grupo contra el tamaño de la unidad.
    for (const [gi, g] of (u.o || []).entries()) {
      if (!g.opts.some((o) => o[4])) continue;
      const used = g.opts.reduce((a, o, j) => {
        const q = sl.gear[gi + ':' + j];
        return a + (Number.isFinite(q) ? q : (o[1] === 1 && !o[3] ? 1 : 0));
      }, 0);
      if (used > sl.size)
        out.push({ hard:true, t:u.n + ': ' + used + ' models assigned',
                   d:'The unit has ' + sl.size + '.' });
    }

    for (const [gi, picked] of perGroup) {
      if (picked <= sl.size) continue;
      out.push({
        hard: false,
        t: u.n + ' \u2014 ' + esc(u.o[gi].n) + ': ' + picked + ' models',
        d: 'The unit only has ' + sl.size + '.',
      });
    }
  }

  // En una lista del rival, avisar "te faltan miniaturas" no tiene sentido.
  for (const [id, models] of (l.foreign ? [] : needed)) {
    const have = owned.get(id) ?? 0;
    if (have < models) {
      const u = unitOf(l, id);
      out.push({ hard:false, t:'Short ' + (models - have) + ' \u00d7 ' + u.n, d:'You own ' + have + ', this list uses ' + models + '.' });
    }
  }

  return { total, issues: out };
}

/* ---------- render ---------- */
function renderLists(){
  try { renderListsInner(); }
  catch (e) {
    // Un fallo acá antes dejaba la pantalla a medias sin decir nada.
    const v = document.getElementById('viewLists');
    v.innerHTML = '';
    const w = el('div','warn');
    w.innerHTML = '<b>LIST VIEW FAILED</b>' + escSafe(e.message);
    const back = el('button','btn'); back.textContent = '\u2190 ALL LISTS';
    back.onclick = () => { editing = null; creating = false; renderLists(); };
    v.append(w, back);
  }
}

function renderListsInner(){
  const v = document.getElementById('viewLists');
  v.innerHTML = '';
  document.getElementById('shell').className = 'wrap' + (editing != null ? ' wide' : '');

  if (creating) { renderNew(v); return; }

  if (editing == null) {
    const bar = el('div','bar');
    const nw = el('button','btn pri'); nw.textContent = 'NEW LIST';
    nw.onclick = newList;
    const imp = el('button','btn'); imp.textContent = 'LOAD A LIST';
    imp.onclick = importList;
    bar.append(nw, imp); v.append(bar);

    if (!lists.length) { v.append(note('No lists yet. Create one to start composing.')); return; }

    for (const l of [...lists].sort((a,b) => b.id - a.id)) {
      const f = factionOf(l.faction);
      const { total } = f ? review(l) : { total: 0 };
      const c = el('div','card');
      c.innerHTML = '<div><div class="nm">' + esc(l.name || 'Untitled') +
        (l.foreign ? ' <span class="tag t-cru">OPPONENT</span>' : '') + '</div>' +
        '<div class="meta">' + esc(f ? f.name : '?') + ' \u00b7 ' + l.slots.length + ' units</div></div>' +
        '<div class="pts">' + total + ' / ' + l.limit + '</div>';
      c.onclick = () => { editing = l.id; selected = null; picking = false; renderLists(); };
      v.append(c);
    }
    return;
  }

  const l = lists.find(x => x.id === editing);
  if (!l) { editing = null; return renderLists(); }

  // Una lista guardada puede apuntar a una facción que ya no está en los datos.
  const f = factionOf(l.faction);
  if (!f) {
    v.append(note('This list points at a faction that is no longer in the catalogue.'));
    const back = el('button','btn'); back.textContent = '\u2190 ALL LISTS';
    back.onclick = () => { editing = null; selected = null; picking = false; renderLists(); };
    v.append(back);
    return;
  }
  const { total, issues } = review(l);

  // --- barra de cabecera
  const bar = el('div','bar');
  const back = el('button','btn'); back.textContent = '\u2190 ALL LISTS';
  back.onclick = () => { editing = null; selected = null; picking = false; renderLists(); };
  const name = el('input'); name.type='text'; name.value = l.name; name.placeholder='List name';
  name.style.cssText = 'flex:1 1 180px;font-family:var(--disp);font-weight:600;font-size:18px';
  name.oninput = () => { l.name = name.value; saveList(l); };
  const shr = shareMenu(l);
  const del = el('button','btn'); del.textContent = 'DELETE';
  del.onclick = () => { if (confirm('Delete this list?')) { store.del('lists', l.id); lists = lists.filter(x=>x.id!==l.id); editing=null; renderLists(); } };
  const wz = el('button','btn'); wz.textContent = 'GUIDE';
  wz.title = 'Step-by-step: army, detachment, enhancements, units';
  wz.onclick = () => { wizard = true; wizStep = 0; renderLists(); };
  bar.append(back, name, wz, shr, del); v.append(bar);

  // --- formato
  const bar2 = el('div','bar');
  // El tope no se edita: se fijó al crear la lista. Mostrarlo como campo
  // editable invitaba a cambiarlo y dejar una lista inconsistente.
  const lim = el('span'); lim.style.cssText = 'font-family:var(--mono);font-size:13px';
  lim.textContent = l.limit + ' pts';
  bar2.append(labelled('Limit', lim));

  bar2.append(labelled('Mission', missionInput(l, f)));
  bar2.append(check('Legends', l.legends, v2 => { l.legends = v2; saveList(l); renderLists(); }));
  bar2.append(check('Crucible', l.crucible, v2 => { l.crucible = v2; saveList(l); renderLists(); }));
  v.append(bar2);

  // --- total
  const head = el('div','ledger');
  const dinfo = new Map(detsOf(f).map((d) => [d[0], d]));
  const dpSpent = (l.dets || []).reduce((a, n) => a + (dinfo.get(n)?.[1] ?? 0), 0);
  const over = total > l.limit;
  head.innerHTML =
    '<div class="lf">' + esc(f.name) + '</div>' +
    '<div class="lm"><b class="' + (over ? 'bad' : '') + '">' + total + '</b>/' + l.limit + '<i>pts</i></div>' +
    ((l.dets || []).length
      ? '<div class="lm"><b>' + dpSpent + '</b>/' + dpBudget(l) + '<i>dp</i></div>' : '');
  v.append(head);

  // --- avisos
  // Avisos compactos. Antes cada uno era un bloque suelto y cuatro faltantes
  // de colección empujaban la lista fuera de pantalla.
  const hard = issues.filter((x) => x.hard);
  const soft = issues.filter((x) => !x.hard);

  for (const [list, cls, title] of [[hard, '', 'BLOCKS PLAY'], [soft, ' soft', 'COLLECTION']]) {
    if (!list.length) continue;
    const w = el('div', 'warn' + cls);
    w.innerHTML = '<b>' + title + ' \u00b7 ' + list.length + '</b>' +
      '<ul style="margin:2px 0 0 15px;padding:0">' +
      list.map((x) => '<li>' + esc(x.t) + ' \u2014 ' + esc(x.d) + '</li>').join('') + '</ul>';
    v.append(w);
  }

  const sc = document.createElement('details');
  sc.className = 'scope';
  sc.innerHTML = '<summary>What this checks</summary>' +
    '<p><b>Checked:</b> points including requisition thresholds and paid wargear, ' +
    'repeat limits, DP budget, unique tags, Legends/Crucible, leader attachment, ' +
    'wargear caps, your collection.<br>' +
    '<b>Not checked:</b> battleline minimums, detachment rules, and ratio limits ' +
    'beyond those declared in the data.</p>';
  v.append(sc);

  if (wizard) { renderWizard(v, l); return; }

  // ============ MAESTRO-DETALLE ============
  // Antes todo era una columna: abrir el armamento de una unidad empujaba el
  // resto de la lista fuera de pantalla. Ahora el roster queda a la izquierda
  // y lo que estás editando a la derecha, fijo.
  const mx = el('div','mx');
  const pane = el('div','pane');
  const side = el('div','side');
  mx.append(pane, side);
  v.append(mx);

  // ---- izquierda: configuración + roster
  pane.append(reqBar(l));

  // Configuración plegada: se toca una vez al empezar y después estorba.
  const cfg = document.createElement('details');
  cfg.className = 'cfg';
  const dpSum = (l.dets || []).reduce((a, n) =>
    a + ((detsOf(f).find(([x]) => x === n) || [])[1] ?? 0), 0);
  const enhSum = (l.enh || []).reduce((a, e) => a + (+e.pts || 0), 0);
  const sum = document.createElement('summary');
  sum.innerHTML = 'Detachments &amp; enhancements <span>' +
    (l.dets || []).length + ' det \u00b7 ' + dpSum + '/' + dpBudget(l) + ' DP \u00b7 ' +
    (l.enh || []).length + ' enh \u00b7 ' + enhSum + ' pts</span>';
  cfg.append(sum);
  cfg.open = !(l.dets || []).length;
  const cfgBody = el('div');
  cfgBody.append(detachmentsFor(l, f), enhancementsFor(l, f));
  cfg.append(cfgBody);
  pane.append(cfg);

  const addBtn = el('button','btn pri');
  addBtn.textContent = '+ ADD UNIT';
  addBtn.style.cssText = 'width:100%;margin:16px 0 4px;padding:11px';
  addBtn.onclick = () => { picking = true; selected = null; renderLists(); scrollToPanel(); };
  pane.append(addBtn);

  // Roster agrupado por rol, como la ficha oficial y New Recruit.
  const roleLabel = new Map(DATA.roles.map((r) => [r.id, r.label]));
  const roleOrder = new Map(DATA.roles.map((r, i) => [r.id, i]));
  const copies = copyIndex(l);

  const rows = l.slots.map((sl, i) => ({ sl, i, u: unitOf(l, sl.unitId) }));
  rows.sort((a, b) =>
    (roleOrder.get(a.u?.r) ?? 99) - (roleOrder.get(b.u?.r) ?? 99) ||
    (a.u?.n || '').localeCompare(b.u?.n || ''));

  if (!rows.length) {
    pane.append(note('No units yet. Add one to start.'));
  } else {
    let curRole;
    for (const { sl, i, u } of rows) {
      if (u?.r !== curRole) {
        curRole = u?.r;
        const rh = el('div','rrole');
        const sub = rows.filter((x) => x.u?.r === curRole)
          .reduce((a, x) => a + (x.u ? ptsFor(x.u, x.sl.size, copies[x.i]) + gearPoints(x.u, x.sl) : 0), 0);
        rh.innerHTML = '<span>' + (roleLabel.get(curRole) || 'OTHER').toUpperCase() +
                       '</span><span>' + sub + ' pts</span>';
        pane.append(rh);
      }

      const att = sl.attach && l.slots[sl.attach - 1];
      const attU = att && unitOf(l, att.unitId);
      const pts = u ? ptsFor(u, sl.size, copies[i]) + gearPoints(u, sl) : 0;

      const row = el('button','runit');
      row.setAttribute('aria-current', selected === i ? 'true' : 'false');
      row.innerHTML =
        '<span class="rn"><b>' + esc(u ? u.n : 'Unknown entry') +
        (sl.size > 1 ? ' \u00d7' + sl.size : '') + '</b>' +
        '<i>' + (attU ? 'leading ' + esc(attU.n) : (u && u.m !== 'standard' ? u.m.toUpperCase() : '&nbsp;')) +
        '</i></span><span class="rp">' + pts + '</span>';
      row.onclick = () => {
        selected = i; picking = false; renderLists();
        // En una columna el detalle queda debajo del roster: sin esto
        // tocabas una unidad y no pasaba nada visible.
        scrollToPanel();
      };

      // Duplicar: copia tamaño y armamento. Configurar dos veces la misma
      // unidad con el mismo equipo era trabajo repetido puro.
      const dup = el('span','rx');
      dup.textContent = '\u29c9';
      dup.title = 'Duplicate with the same wargear';
      dup.onclick = (ev) => {
        ev.stopPropagation();
        const copy = JSON.parse(JSON.stringify(sl));
        delete copy.attach;          // el enganche es de esta copia, no de la nueva
        l.slots.splice(i + 1, 0, copy);
        // Los enganches apuntan por índice: los posteriores se corren.
        for (const s2 of l.slots)
          if (s2 !== copy && s2.attach != null && s2.attach - 1 > i) s2.attach += 1;
        selected = i + 1;
        saveList(l); renderLists();
      };
      row.append(dup);

      const x = el('span','rx');
      x.textContent = '\u2715';
      x.title = 'Remove';
      x.onclick = (ev) => {
        ev.stopPropagation();
        l.slots.splice(i, 1);
        // Los enganches apuntan por índice: hay que correrlos.
        for (const s2 of l.slots) {
          if (s2.attach == null) continue;
          if (s2.attach - 1 === i) s2.attach = null;
          else if (s2.attach - 1 > i) s2.attach -= 1;
        }
        selected = null;
        saveList(l); renderLists();
      };
      row.append(x);
      pane.append(row);
    }
  }

  // ---- derecha: buscador o detalle de la unidad elegida
  if (picking) side.append(unitFinder(l, f));
  else if (selected != null && l.slots[selected]) side.append(unitDetail(l, selected));
  else {
    const hd = el('div','hd'); hd.innerHTML = '<h3>Details</h3>';
    const em = el('div','empty');
    em.textContent = 'Pick a unit from the roster to set its wargear, ' +
                     'attach a leader, or read its datasheet.';
    side.append(hd, em);
  }
}

/* Buscador de unidades. Reemplaza al desplegable gigante: con 190 entradas y
 * varios tamaños cada una, el select llegaba a 400 líneas. */
/* En pantallas angostas el panel de detalle queda debajo del roster. */
function scrollToPanel(){
  if (!window.matchMedia || !window.matchMedia('(max-width:939px)').matches) return;
  const p = document.querySelector('#viewLists .side');
  if (p && p.scrollIntoView) p.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function unitFinder(l, f){
  const box = el('div');
  const hd = el('div','hd');
  hd.innerHTML = '<h3>Add a unit</h3>';
  const close = el('button'); close.textContent = 'CLOSE';
  close.onclick = () => { picking = false; renderLists(); };
  hd.append(close);

  const bd = el('div','bd finder');
  const q = el('input'); q.type = 'search'; q.placeholder = 'Search\u2026';
  const res = el('div','fres');
  bd.append(q, res);

  const roleLabel = new Map(DATA.roles.map((r) => [r.id, r.label]));
  const roleOrder = new Map(DATA.roles.map((r, i) => [r.id, i]));

  const draw = () => {
    const term = q.value.trim().toLowerCase();
    res.innerHTML = '';

    const items = poolOf(l)
      .filter(({ u }) => {
        if (u.m === 'legends'  && !l.legends)  return false;
        if (u.m === 'crucible' && !l.crucible) return false;
        return !term || u.n.toLowerCase().includes(term);
      })
      .sort((a, b) =>
        (roleOrder.get(a.u.r) ?? 99) - (roleOrder.get(b.u.r) ?? 99) ||
        a.u.n.localeCompare(b.u.n));

    if (!items.length) { res.append(note('Nothing matches.')); return; }

    let curRole;
    for (const { u, from } of items.slice(0, 200)) {
      if (u.r !== curRole) {
        curRole = u.r;
        const h = el('div','fh');
        h.textContent = (roleLabel.get(u.r) || 'OTHER').toUpperCase();
        res.append(h);
      }
      for (const sz of sizesFor(u)) {
        const b = el('button');
        // Si la unidad pertenece a un grupo con tope de puntos, se avisa acá:
        // enterarse después de armar media lista es tarde.
        const capped = (f.ally || []).find(([n]) => n === u.fc);
        b.innerHTML = '<b>' + esc(u.n) + (sz.n > 1 ? ' \u00d7' + sz.n : '') + '</b>' +
          '<i>' + sz.pts + ' pts' + (from ? ' \u00b7 ' + esc(from) : '') +
          (capped ? ' \u00b7 ' + esc(capped[0]) +
            (capped[1][l.limit] != null ? ' (max ' + capped[1][l.limit] + ')' : '') : '') +
          '</i>';
        b.onclick = () => {
          l.slots.push({ unitId: u.id, size: sz.n });
          selected = l.slots.length - 1;
          picking = false;
          saveList(l); renderLists();
        };
        res.append(b);
      }
    }
  };

  q.oninput = draw;
  draw();
  box.append(hd, bd);
  return box;
}

/* Detalle de la unidad seleccionada: enganche, armamento y ficha. */
function unitDetail(l, i){
  const sl = l.slots[i];
  const u = unitOf(l, sl.unitId);
  const box = el('div');

  const hd = el('div','hd');
  hd.innerHTML = '<h3>' + esc(u ? u.n : 'Unknown') + (sl.size > 1 ? ' \u00d7' + sl.size : '') + '</h3>';
  const dup2 = el('button'); dup2.textContent = 'DUPLICATE';
  dup2.onclick = () => {
    const copy = JSON.parse(JSON.stringify(sl));
    delete copy.attach;
    l.slots.splice(i + 1, 0, copy);
    for (const s2 of l.slots)
      if (s2 !== copy && s2.attach != null && s2.attach - 1 > i) s2.attach += 1;
    selected = i + 1; saveList(l); renderLists();
  };
  const close = el('button'); close.textContent = 'CLOSE';
  close.onclick = () => { selected = null; renderLists(); };
  hd.append(dup2, close);

  const bd = el('div','bd');

  if (!u) {
    bd.append(note('This entry is no longer in the catalogue.'));
    box.append(hd, bd);
    return box;
  }

  // tamaño de la unidad
  const sizes = sizesFor(u);
  if (sizes.length > 1) {
    const w = el('div'); w.style.marginBottom = '12px';
    const lab = el('div');
    lab.style.cssText = 'font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink2);margin-bottom:4px';
    lab.textContent = 'UNIT SIZE';
    const sel = el('select'); sel.style.width = '100%';
    for (const sz of sizes) {
      const o = el('option'); o.value = sz.n;
      o.textContent = sz.n + ' models \u00b7 ' + sz.pts + ' pts';
      if (sz.n === sl.size) o.selected = true;
      sel.append(o);
    }
    sel.onchange = () => { sl.size = +sel.value; saveList(l); renderLists(); };
    w.append(lab, sel);
    bd.append(w);
  }

  // enganche
  if (u.ld) {
    const w = el('div'); w.style.marginBottom = '12px';
    const lab = el('div');
    lab.style.cssText = 'font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink2);margin-bottom:4px';
    lab.textContent = 'ATTACHED TO';
    const at = el('select'); at.style.width = '100%';
    const none = el('option'); none.value=''; none.textContent='not attached'; at.append(none);
    // Una unidad sólo admite un líder: si ya está tomada, no se ofrece.
    const taken = new Set();
    for (const [j, s2] of l.slots.entries())
      if (j !== i && s2.attach != null) taken.add(s2.attach - 1);

    let free = 0;
    for (const [j, other] of l.slots.entries()) {
      if (j === i) continue;
      const ou = unitOf(l, other.unitId);
      if (!ou || !u.ld.includes(ou.id)) continue;
      if (taken.has(j) && !sl_eq(sl.attach, j + 1)) continue;
      free++;
      const o = el('option'); o.value = String(j + 1);
      o.textContent = ou.n + (other.size > 1 ? ' \u00d7' + other.size : '');
      if (sl_eq(sl.attach, j + 1)) o.selected = true;
      at.append(o);
    }
    if (!free && sl.attach == null) {
      const h = el('div','hint');
      h.textContent = 'Every unit it can lead is already taken by another leader.';
      w.append(lab, at, h);
      bd.append(w);
    }
    at.onchange = () => { sl.attach = at.value ? +at.value : null; saveList(l); renderLists(); };
    if (!w.children.length) { w.append(lab, at); bd.append(w); }
  }

  if (u.o && u.o.length) {
    const wg = wargearFor(l, sl, u);
    if (wg) bd.append(wg);
  }
  if (hasSheet(u)) bd.append(datasheetFor(u, sl));

  box.append(hd, bd);
  return box;
}

/* ---------- helpers de UI ---------- */
/* ------------------------------------------------------------------
 * ARMAMENTO
 *
 * En 11e el armamento no cuesta puntos (72 excepciones en 4426 opciones de
 * todo el repo), así que esto NO mueve el total: registra el detalle de la
 * lista para que puedas reproducirla en la mesa.
 *
 * Dos formas: "one" = elegir una opción del grupo; "many" = cuántos modelos
 * llevan cada variante, con su tope.
 *
 * Los topes que dependen del tamaño ("1 cada 5 modelos") viven en modifiers
 * y no se resuelven. Por eso el tope mostrado es el máximo absoluto.
 * ---------------------------------------------------------------- */
/* Cuántos modelos hay de una fila de composición, dado el tamaño elegido.
 * Las filas fijas (sargento) valen su número; la de tropa se queda con el
 * resto. Hace falta para saber si una elección es de UN modelo o de varios. */
/* Modelos disponibles para cambiar de arma: el tamaño menos las filas fijas
 * de la composición, salvo que el propio grupo incluya esa fila. */
function troopCount(u, sl, g){
  const inGroup = new Set((g.opts || []).map((o) => o[0]));
  let fixed = 0;
  for (const [n, min, max] of (u.cp || []))
    if (min != null && min === max && !inGroup.has(n)) fixed += min;
  return Math.max(0, sl.size - fixed);
}

function modelCount(u, sl, name){
  if (!name) return 1;

  // Variantes que viven en un grupo de opciones, no en la composición:
  // "Terminator w/ Heavy Weapon" son 2 en una unidad de 10, y cada uno
  // elige su arma por separado.
  for (const [gi, g] of (u.o || []).entries()) {
    if (g.k !== 'many') continue;
    for (const [oi, opt] of g.opts.entries()) {
      if (!opt[4] || opt[0] !== name) continue;
      const chosen = (sl.gear || {})[gi + ':' + oi];
      if (Number.isFinite(chosen)) return chosen;
      return opt[1] === 1 && !opt[3] ? 1 : 0;
    }
  }

  if (!u.cp) return 1;
  const row = u.cp.find(([n]) => n === name);
  if (!row) return 1;
  const [, min, max] = row;
  if (min != null && min === max) return min;
  let left = sl.size;
  for (const [n2, mn, mx] of u.cp) if (n2 !== name && mn != null && mn === mx) left -= mn;
  return Math.max(0, left);
}

function wargearFor(l, sl, u){
  sl.gear = sl.gear || {};
  const box = el('div');
  box.style.cssText = 'padding:2px 0 12px 14px;border-left:2px solid var(--rule);margin-bottom:6px';

  // Las opciones se agrupan por MODELO. En una escuadra, "Weapon 1" es del
  // sargento y la tropa lleva equipo fijo; mostrarlas planas hace creer que
  // la elección aplica a los diez.
  const isFixedOpt = (o) => o[6] != null && o[1] != null && o[6] === o[1] && !o[4];

  let lastOwner, shown = 0;
  for (const [gi, g] of u.o.entries()) {
    // Si al ocultar el equipo fijo no queda nada elegible, el grupo entero
    // sobra: mostrar una cabecera sin controles hace creer que falta algo.
    if (!g.opts.some((o) => !isFixedOpt(o))) continue;
    shown++;
    if (g.ow !== lastOwner) {
      lastOwner = g.ow;
      const oh = el('div');
      oh.style.cssText = 'font-family:var(--disp);font-weight:600;font-size:13.5px;' +
        'margin:12px 0 2px;padding-bottom:2px;border-bottom:1px solid var(--rule)';
      oh.textContent = g.ow || 'Whole unit';
      box.append(oh);
    }

    const head = el('div');
    head.style.cssText = 'font-family:var(--mono);font-size:10px;letter-spacing:.1em;' +
      'color:var(--ink2);margin:8px 0 3px';
    head.textContent = g.n.toUpperCase();
    box.append(head);

    // "Cada modelo de esta unidad puede cambiar X por Y": si el grupo pertenece
    // a una fila con varios modelos, no es UNA elección sino un reparto. Con
    // 5 Reivers podés tener 3 con cuchillo y 2 con carabina.
    const owned = modelCount(u, sl, g.ow);
    const perModel = g.k === 'one' && g.ow && owned > 1;

    if (perModel) {
      const tot = g.opts.reduce((a, _, oi) => a + (sl.gear[gi + ':' + oi] ?? 0), 0);
      const restKey = gi + ':base';
      const note = el('div');
      note.style.cssText = 'font-family:var(--mono);font-size:9.5px;color:var(--ink2);margin:-1px 0 3px';
      note.textContent = 'each of the ' + owned + ' \u00b7 ' + (owned - tot) + ' unchanged';
      box.append(note);

      for (const [oi, opt] of g.opts.entries()) {
        const key = gi + ':' + oi;
        const row = el('div');
        row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:3px 0';
        const lab = el('div');
        lab.style.cssText = 'flex:1;min-width:0;font-size:13px';
        const cost = gearCost(u, opt[0]);
        lab.textContent = opt[0] + (cost ? '  +' + cost + ' pts' : '');

        const step = el('div','step');
        const minus = el('button'); minus.textContent = '\u2212';
        const val = el('input'); val.type='text'; val.inputMode='numeric';
        val.value = sl.gear[key] ?? 0;
        const plus = el('button'); plus.textContent = '+';
        const set = (n) => {
          const others = g.opts.reduce((a, _, j) =>
            a + (j === oi ? 0 : (sl.gear[gi + ':' + j] ?? 0)), 0);
          n = Math.max(0, Math.min(owned - others, n | 0));
          if (n) sl.gear[key] = n; else delete sl.gear[key];
          saveList(l); renderLists();
        };
        minus.onclick = () => set((sl.gear[key] ?? 0) - 1);
        plus.onclick  = () => set((sl.gear[key] ?? 0) + 1);
        val.onchange  = () => set(parseInt(val.value,10) || 0);
        step.append(minus, val, plus);
        row.append(lab, step);
        box.append(row);
      }
      continue;
    }

    if (g.k === 'one') {
      const sel = el('select');
      sel.style.cssText = 'font-size:13px;padding:5px 8px;max-width:100%';
      const none = el('option'); none.value=''; none.textContent='\u2014'; sel.append(none);
      for (const [name] of g.opts) {
        const cost = gearCost(u, name);
        const o = el('option'); o.value = name;
        o.textContent = name + (cost ? '  \u00b7 +' + cost + ' pts' : '');
        if (sl.gear[gi] === name) o.selected = true;
        sel.append(o);
      }
      sel.onchange = () => { sl.gear[gi] = sel.value || undefined; saveList(l); renderLists(); };
      box.append(sel);
      continue;
    }

    // Un grupo cuyas opciones son MODELOS está acotado por el tamaño de la
    // unidad: sin esto se podían poner 9 con puño y 9 con garra en una
    // escuadra de 10. El tope de cada opción es el menor entre el suyo y
    // lo que queda libre.
    const modelGroup = g.opts.some((o) => o[4]);
    // Las variantes salen de la TROPA, no del total: en una unidad de 10 con
    // campeón fijo, sólo 9 pueden cambiar de arma.
    const pool = modelGroup ? troopCount(u, sl, g) : sl.size;
    const usedInGroup = g.opts.reduce((a, o, j) => {
      const q = sl.gear[gi + ':' + j];
      return a + (Number.isFinite(q) ? q : 0);
    }, 0);
    const freeInUnit = modelGroup ? Math.max(0, pool - usedInGroup) : Infinity;

    if (modelGroup) {
      const note = el('div');
      note.style.cssText = 'font-family:var(--mono);font-size:9.5px;color:var(--ink2);margin:-1px 0 3px';
      note.textContent = usedInGroup + ' of ' + pool + ' models assigned';
      box.append(note);
    }

    for (const [oi, opt] of g.opts.entries()) {
      // Equipo FIJO colado en un grupo de elección: el Lord on Juggernaut
      // trae bladed horn y exalted chainblade con min = max = 1, o sea que
      // no se eligen, vienen puestos. Mostrarlos como contador hacía creer
      // que eran opcionales.
      if (isFixedOpt(opt)) continue;

      const name = opt[0];
      const own = capFor(opt, sl.size, u, g, sl);
      const cur = sl.gear[gi + ':' + oi] ?? 0;
      const max = modelGroup
        ? Math.min(own ?? Infinity, cur + freeInUnit)
        : (own ?? 1);
      const key = gi + ':' + oi;
      const row = el('div');
      row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:3px 0';

      const cost = gearCost(u, name);
      const scaled = opt[3] && opt[3].length;
      const lab = el('div');
      lab.style.cssText = 'flex:1;min-width:0;font-size:13px';
      lab.textContent = name + (cost ? '  +' + cost + ' pts' : '') +
                        (max ? '  (max ' + max + (scaled ? ' at ' + sl.size : '') + ')' : '');

      const step = el('div','step');
      const minus = el('button'); minus.textContent = '\u2212';
      const val   = el('input'); val.type='text'; val.inputMode='numeric';
      val.value = sl.gear[key] ?? 0;
      const plus  = el('button'); plus.textContent = '+';

      // El tope se recalcula AL PULSAR, no al dibujar: si dependiera del
      // render, varios clics seguidos sobre el mismo botón se pasarían del
      // tamaño de la unidad antes de que la pantalla se actualice.
      const set = (n) => {
        let cap = capFor(opt, sl.size, u, g, sl) ?? 1;
        if (modelGroup) {
          const others = g.opts.reduce((a, o, j) => {
            if (j === oi) return a;
