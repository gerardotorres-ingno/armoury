            const q = sl.gear[gi + ':' + j];
            return a + (Number.isFinite(q) ? q : 0);
          }, 0);
          cap = Math.min(cap, Math.max(0, troopCount(u, sl, g) - others));
        }
        n = Math.max(0, Math.min(cap, n | 0));
        if (n) sl.gear[key] = n; else delete sl.gear[key];
        val.value = n;
        saveList(l); renderLists();
      };
      minus.onclick = () => set((sl.gear[key] ?? 0) - 1);
      plus.onclick  = () => set((sl.gear[key] ?? 0) + 1);
      val.onchange  = () => set(parseInt(val.value,10) || 0);

      step.append(minus, val, plus);
      row.append(lab, step);
      box.append(row);
    }
  }
  return box;
}

/* Ficha de datos: stats de la unidad y tabla de armas. Sale del mismo
 * catálogo, así que se actualiza sola con los datos. */
/* Normaliza para cruzar el nombre de una OPCIÓN con el de un PERFIL de arma.
 * No coinciden literalmente: la opción dice "Two magma cutters" y el perfil
 * "Magma cutter"; "Heavy missile launcher" se parte en "- frag" y "- krak".
 * Se recorta el sufijo tras el guion, se quitan los numerales y el plural. */
function wkey(name){
  return String(name)
    .split(' - ')[0]
    .replace(/^[\u27a4\s]+/, '')
    .toLowerCase()
    .replace(/^(two|three|four|2|3|4)\s+/, '')
    .replace(/[^a-z0-9 ]/g, '')
    .trim()
    .replace(/s$/, '');
}

/* Armas que quedan tras aplicar el equipamiento elegido.
 *
 * Cada grupo de tipo "one" es un reemplazo: sus opciones son excluyentes, así
 * que sólo sobrevive la elegida (o la primera, que es el equipo de fábrica).
 * Las armas que no pertenecen a ningún grupo son fijas y se muestran siempre. */
function weaponsAfterGear(u, sl){
  if (!u.w || !u.o || !u.o.length) return u.w || [];

  // Un arma puede figurar en VARIOS grupos: el Hades lascannon es opción tanto
  // del baleflamer como del lanzamisiles. Por eso no alcanza con marcar para
  // borrar grupo por grupo — hay que juntar primero todo lo elegido y recién
  // después descartar. Si no, elegir un arma en un grupo la borra desde otro.
  const inGroups = new Set();
  const chosen = new Set();

  // Armas que la composición trae de fábrica: la elección del campeón no
  // puede borrarlas. Si el campeón cambia su bolt pistol por una de plasma,
  // los otros nueve siguen llevando bolt pistol.
  const fromComposition = new Set(
    (u.cp || []).flatMap(([, , , arms]) => (arms || []).map(wkey))
  );

  for (const [gi, g] of u.o.entries()) {
    if (g.k !== 'one') continue;
    const names = g.opts.map(([n]) => n);

    // Reparto entre varios modelos: todas las opciones con cantidad puesta
    // conviven en la unidad, así que ninguna se descarta.
    const spread = g.opts.some((_, oi) => (sl?.gear || {})[gi + ':' + oi] > 0);
    if (spread) {
      for (const [oi, o] of g.opts.entries()) {
        if ((sl.gear[gi + ':' + oi] ?? 0) <= 0) continue;
        for (const a of (o[5] && o[5].length ? o[5] : [o[0]])) chosen.add(wkey(a));
      }
      continue;
    }

    for (const n of names) inGroups.add(wkey(n));
    const pick = (sl?.gear && typeof sl.gear[gi] === 'string') ? sl.gear[gi] : names[0];
    chosen.add(wkey(pick));
  }
  if (!inGroups.size) return u.w;

  // Se conserva lo elegido y todo lo que no participa de ningún reemplazo
  // (el equipo fijo, como las garras del Defiler).
  return u.w.filter((w) => {
    const k = wkey(w[0]);
    if (fromComposition.has(k)) return true;
    return chosen.has(k) || !inGroups.has(k);
  });
}

/* ------------------------------------------------------------------
 * CUÁNTAS MINIATURAS LLEVAN CADA ARMA
 *
 * Se reparte el tamaño de la unidad entre sus filas de composición y las
 * variantes de modelo elegidas, y se suma el armamento de cada una:
 *   Terminator Squad x5 → Storm bolter x5, Power fist x1
 *
 * Las filas fijas (sargento, min = max) toman su número; las variantes toman
 * lo que hayas puesto en el armamento; el resto va a la fila de tropa.
 * ---------------------------------------------------------------- */
function weaponCounts(u, sl){
  if (!sl || !sl.size) return null;
  const counts = new Map();
  const bump = (name, n) => {
    if (!name || n <= 0) return;
    const k = wkey(name);
    counts.set(k, (counts.get(k) ?? 0) + n);
  };

  let left = sl.size;
  const flexible = [];

  // 1. filas de composición con número fijo
  for (const [n, min, max, arms] of (u.cp || [])) {
    if (min != null && min === max) {
      left -= min;
      for (const a of (arms || [])) bump(a, min);
    } else {
      flexible.push({ n, arms: arms || [] });
    }
  }

  // 2. variantes de modelo y repartos de arma elegidos en el armamento
  const gear = sl.gear || {};
  for (const [gi, g] of (u.o || []).entries()) {
    let taken = 0;
    for (const [oi, opt] of g.opts.entries()) {
      const qty = gear[gi + ':' + oi];
      if (!Number.isFinite(qty) || qty <= 0) continue;
      taken += qty;
      if (opt[4]) {                             // variante de modelo
        left -= qty;
        for (const a of (opt[5] || [])) bump(a, qty);
      } else {
        // Cambio de arma repartido entre modelos: "3 con cuchillo".
        // Una opción puede agrupar varias armas ("Bolt Carbine and Close
        // Combat Weapon"), así que se usan las suyas y el nombre de respaldo.
        const arms = opt[5] && opt[5].length ? opt[5] : [opt[0]];
        for (const a of arms) bump(a, qty);
      }
    }

    // Reparto sobre una fila de varios modelos: los que no cambiaron siguen
    // con la primera opción, que es el equipo de fábrica.
    if (g.k === 'one' && g.ow) {
      const owned = modelCount(u, sl, g.ow);
      const rest = owned - taken;
      if (rest > 0 && owned > 1) {
        const base = g.opts[0];
        for (const a of (base[5] && base[5].length ? base[5] : [base[0]])) bump(a, rest);
      }
    }
  }

  // 3. el resto son modelos de tropa con su equipo de fábrica
  if (left > 0) {
    const base = flexible[0] ||
      ((u.o || []).flatMap((g) => g.opts).find((o) => o[4] && (o[5] || []).length)
        ? { arms: ((u.o || []).flatMap((g) => g.opts).find((o) => o[4] && (o[5] || []).length))[5] }
        : null);
    if (base) for (const a of base.arms) bump(a, left);
  }

  // 4. armas elegidas en grupos de una sola opción: las lleva su modelo
  for (const [gi, g] of (u.o || []).entries()) {
    if (g.k !== 'one') continue;
    const chosen = typeof gear[gi] === 'string' ? gear[gi] : null;
    if (!chosen) continue;
    const row = (u.cp || []).find(([n]) => n === g.ow);
    const n = row ? (row[1] === row[2] ? row[1] : 1) : 1;
    bump(chosen, n);
  }

  return counts.size ? counts : null;
}

function datasheetFor(u, sl){
  const box = el('div','sheet');
  const weapons = weaponsAfterGear(u, sl);
  const counts = weaponCounts(u, sl);

  if (u.st) {
    const row = el('div','stats');
    const labels = ['M','T','SV','W','LD','OC'];
    u.st.forEach((v, i) => {
      if (v == null || v === '') return;
      const c = el('div','stat');
      c.innerHTML = '<b>' + labels[i] + '</b><span>' + esc(String(v)) + '</span>';
      row.append(c);
    });
    box.append(row);

    // La invulnerable va aparte, no como una caja más: en la ficha oficial
    // cuelga de la salvación porque es una alternativa a ella, no otro stat.
    if (u.inv) {
      const iv = el('div','inv');
      iv.innerHTML = '<span>' + esc(u.inv) + '</span> INVULNERABLE SAVE';
      box.append(iv);
    }
  }

  // Habilidades antes de las armas: es el orden de la ficha oficial.
  if (u.ab && u.ab.length) {
    const b = el('div','band'); b.textContent = 'ABILITIES'; box.append(b);
    const w = el('div','abil');
    w.innerHTML = u.ab.map(([n, d]) => '<h4>' + esc(n) + '</h4><p>' + esc(d) + '</p>').join('');
    box.append(w);
  }

  for (const melee of [0, 1]) {
    const ws = weapons.filter(w => w[1] === melee);
    if (!ws.length) continue;
    const b = el('div','band');
    b.textContent = melee ? 'MELEE WEAPONS' : 'RANGED WEAPONS';
    box.append(b);
    const t = el('table','wp');
    t.innerHTML =
      '<tr><th>Weapon</th><th>Range</th><th>A</th><th>' + (melee ? 'WS' : 'BS') +
      '</th><th>S</th><th>AP</th><th>D</th></tr>' +
      ws.map(w => {
        // "Storm bolter x5": cuántas miniaturas de la unidad llevan esa arma.
        const c = counts && counts.get(wkey(w[0]));
        return '<tr><td>' + esc(w[0]) +
        (c > 1 ? ' <b class="wct">\u00d7' + c + '</b>' : '') +
        (w[8] ? '<span class="wkw">' + esc(w[8]) + '</span>' : '') + '</td>' +
        '<td>' + esc(w[2]) + '</td><td>' + esc(w[3]) + '</td><td>' + esc(w[4]) +
        '</td><td>' + esc(w[5]) + '</td><td>' + esc(w[6]) + '</td><td>' + esc(w[7]) +
        '</td></tr>';
      }).join('');
    box.append(t);
  }

  // Composición. NO viene como texto en el catálogo: se reconstruye a partir
  // de los modelos y sus topes, así que puede diferir de la ficha oficial en
  // casos raros. Por eso la cabecera lo dice.
  if (u.cp && u.cp.length) {
    const b = el('div','band'); b.textContent = 'UNIT COMPOSITION'; box.append(b);
    const w = el('div','abil');
    w.innerHTML = '<ul style="margin:0 0 6px 16px;font-size:13px;line-height:1.6">' +
      u.cp.map(([n, min, max]) => {
        const qty = (min != null && max != null && min !== max) ? min + '\u2013' + max
                  : (max ?? min ?? 1);
        return '<li>' + qty + ' \u00d7 ' + esc(n) + '</li>';
      }).join('') + '</ul>' +
      (u.cp.some(([,,,g]) => g && g.length)
        ? '<p style="font-size:12.5px">Equipped with: ' +
          esc([...new Set(u.cp.flatMap(([,,,g]) => g || []))].join('; ')) + '</p>'
        : '');
    box.append(w);
  }

  if (u.kw && u.kw.length) {
    const k = el('div','kwbar');
    k.innerHTML = u.kw.map(x => '<span>' + esc(x) + '</span>').join('');
    box.append(k);
  }

  return box;
}

function hasSheet(u){ return !!(u.st || (u.w && u.w.length) || (u.ab && u.ab.length) || (u.kw && u.kw.length) || (u.cp && u.cp.length)); }
/* Precio de un arma opcional. La mayoría vale 0, pero 71 unidades cobran:
 * el Defiler suma 15 por Hades lascannon y 15 por heavy reaper autocannon.
 * Los precios los trae el MFM; BSData no los tiene. */
/* Precio de un arma opcional. Dos fuentes: el MFM (u.wg) y el propio catálogo,
 * que trae precio en 72 opciones. Gana el MFM por ser la fuente oficial. */
/* Tope efectivo de una opción para un tamaño de unidad dado.
 *
 * "1 cada 5 modelos" viene como un máximo base más una escalera: el
 * Terminator w/ Heavy Weapon es max 1, y max 2 cuando la unidad tiene 10.
 * Sin esto, la app permitía uno solo aunque llevaras diez. */
/* Tope efectivo de una opción para un tamaño de unidad.
 *
 * Dos casos:
 *  - Con escalera declarada (Terminator w/ Heavy Weapon: 1, y 2 a los 10),
 *    manda la escalera: es un dato explícito.
 *  - Sin escalera, el catálogo declara el tope de la unidad MÁS GRANDE.
 *    Khorne Berzerkers dice max 4 sobre una unidad de 20 — o sea, uno cada
 *    cinco. A 10 modelos son 2, no 4. Se deduce por proporción.
 *
 * La proporción es una inferencia, no un dato: si el catálogo declarara la
 * escalera, ganaría ella.
 */
function capFor(opt, size, u, g, sl){
  const [, max, , scale] = opt;
  if (scale && scale.length) {
    let eff = max;
    for (const [at, v] of scale) if (size >= at) eff = v;
    return eff;
  }
  if (max != null && u && u.mx && u.mx > 1 && size < u.mx) {
    return Math.floor(size * max / u.mx) || (max > 0 ? 1 : 0);
  }

  // Sin tope declarado (el 64 % de las opciones), el límite físico es la
  // cantidad de miniaturas que pueden llevarla: un arma por modelo. El Lord
  // on Juggernaut es un solo modelo, así que su pistola de plasma es 1 — no
  // 99, que era el valor de emergencia y en la práctica significaba infinito.
  if (max == null && g && sl) {
    return g.ow ? modelCount(u, sl, g.ow) : (sl.size || 1);
  }
  return max;
}

function gearCost(u, name){
  if (!name) return 0;
  const k = String(name).toLowerCase().replace(/[^a-z0-9]/g, '');
  if (u.wg && u.wg[k] != null) return u.wg[k];
  for (const g of (u.o || []))
    for (const [n, , p] of g.opts)
      if (p && String(n).toLowerCase().replace(/[^a-z0-9]/g, '') === k) return p;
  return 0;
}

/* Puntos de armamento de un slot: opciones únicas más variantes por cantidad. */
function gearPoints(u, sl){
  if (!u.wg || !sl.gear) return 0;
  let t = 0;
  for (const [k, v] of Object.entries(sl.gear)) {
    if (typeof v === 'string') { t += gearCost(u, v); continue; }
    const [gi, oi] = k.split(':').map(Number);
    const name = u.o?.[gi]?.opts?.[oi]?.[0];
    if (name) t += gearCost(u, name) * v;
  }
  return t;
}

function sl_eq(a,b){ return a != null && +a === b; }
function el(tag, cls){ const e = document.createElement(tag); if (cls) e.className = cls; return e; }
function note(t){ const p = el('p','note'); p.textContent = t; return p; }
function hint(t){ const p = el('div','hint'); p.textContent = t; return p; }
function labelled(text, node){
  const w = el('label'); w.style.cssText='display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)';
  w.append(text, node); return w;
}
/* Tamaños de batalla oficiales, tal como los declara el game system de
 * BSData. Son los mismos nombres de los que salen los topes de repetición
 * ("2 en Incursion, 3 normalmente"), así que conviene usar los suyos. */
const BATTLE_SIZES = [
  [1000, 'Incursion'],
  [2000, 'Strike Force'],
  [3000, 'Onslaught'],
  [500,  'Combat Patrol'],
  [1500, 'Custom'],
  [2500, 'Custom'],
];

function numSelect(values, current, cb){
  const s = el('select');
  const names = new Map(BATTLE_SIZES);
  for (const n of values){
    const o = el('option'); o.value = n;
    o.textContent = n + ' pts' + (names.has(n) && names.get(n) !== 'Custom' ? '  \u00b7 ' + names.get(n) : '');
    if (n === current) o.selected = true;
    s.append(o);
  }
  s.onchange = () => cb(+s.value); return s;
}
/* `onPick` permite al formulario de creación reaccionar sin pasar por
 * renderLists(): redibujar ahí reconstruye el borrador desde cero y le
 * resetea la facción. Ese era el bug de "elijo destacamento y cambia de
 * facción". */
/* ------------------------------------------------------------------
 * MISIÓN (Force Disposition)
 *
 * Cada destacamento trae la suya declarada en el MFM: Awakened Dynasty juega
 * TAKE AND HOLD, Hypercrypt Legion juega RECONNAISSANCE. Hay cinco en total.
 *
 * Con varios destacamentos hay varias misiones posibles, y elegís una: por eso
 * es un selector con las de tus destacamentos, no un campo libre.
 * ---------------------------------------------------------------- */
function missionsFor(l, f){
  const info = new Map(detsOf(f).map((d) => [d[0], d]));
  const out = new Map();                       // misión -> destacamentos que la traen
  for (const n of (l.dets || [])) {
    const obj = info.get(n)?.[2];
    if (!obj) continue;
    if (!out.has(obj)) out.set(obj, []);
    out.get(obj).push(n);
  }
  return out;
}

function missionInput(l, f){
  const opts = missionsFor(l, f);

  // Sin destacamentos con misión declarada, queda el campo libre.
  if (!opts.size) {
    const i = el('input'); i.type = 'text'; i.placeholder = 'mission';
    i.style.cssText = 'width:150px;font-size:13px';
    i.value = l.mission || '';
    i.oninput = () => { l.mission = i.value; saveList(l); };
    return i;
  }

  // Una sola posible: se aplica sola, no tiene sentido preguntarlo.
  if (opts.size === 1 && !l.mission) {
    l.mission = [...opts.keys()][0];
    saveList(l);
  }

  const sel = el('select');
  sel.style.cssText = 'font-size:13px;max-width:230px';
  const o0 = el('option'); o0.value = ''; o0.textContent = '\u2014'; sel.append(o0);
  for (const [m, from] of opts) {
    const o = el('option'); o.value = m;
    o.textContent = m + (opts.size > 1 ? '  \u00b7 ' + from[0] : '');
    if (m === l.mission) o.selected = true;
    sel.append(o);
  }
  sel.onchange = () => { l.mission = sel.value; saveList(l); renderLists(); };
  return sel;
}

function detachInput(f, l, onPick){
  const done = onPick || (() => { saveList(l); renderLists(); });
  const dl = detsOf(f);
  if (dl.length){
    const s = el('select');
    const o0 = el('option'); o0.value=''; o0.textContent='\u2014'; s.append(o0);
    for (const [name, dp, obj] of dl){
      const o = el('option'); o.value = name;
      o.textContent = name + '  \u00b7 ' + dp + ' DP' + (obj ? '  \u00b7 ' + obj : '');
      if (name === l.detachment) o.selected = true;
      s.append(o);
    }
    s.onchange = () => { l.detachment = s.value; done(); };
    return s;
  }
  const i = el('input'); i.type='text'; i.placeholder='type it'; i.value = l.detachment || '';
  i.oninput = () => { l.detachment = i.value; onPick ? onPick() : saveList(l); };
  return i;
}
function check(text, val, cb){
  const w = el('label'); w.style.cssText='display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)';
  const c = el('input'); c.type='checkbox'; c.checked = !!val; c.style.accentColor='var(--ochre)';
  c.onchange = () => cb(c.checked);
  w.append(c, text); return w;
}
/* Formulario de creación. Antes era un prompt() del navegador que sólo
 * preguntaba la facción — lo mínimo para probar la lógica, inservible como
 * pantalla. Acá se definen de una vez las cosas que no se pueden cambiar
 * después sin rehacer la lista: facción y tope de puntos. */
let creating = false;

let draftList = null;

function renderNew(v){
  // El borrador persiste entre redibujos: si se recreara acá, cualquier
  // re-render perdería lo que el usuario ya eligió.
  const draft = draftList ||= {
    id: Date.now(), name: '', faction: DATA.factions[0].slug,
    dets: [], limit: 2000, legends: false, crucible: false, slots: [], enh: [],
  };

  const head = el('div','group'); head.textContent = 'NEW LIST';
  v.append(head);

  // nombre
  const name = el('input'); name.type = 'text'; name.placeholder = 'List name';
  name.style.cssText = 'width:100%;font-family:var(--disp);font-weight:600;font-size:20px;' +
    'background:transparent;border:none;border-bottom:1px solid var(--rule2);padding:6px 0;margin-bottom:16px';
  name.value = draft.name || '';
  name.oninput = () => draft.name = name.value;
  v.append(name);

  // facción
  const fsel = el('select'); fsel.style.cssText = 'width:100%;font-family:var(--disp);font-weight:600;font-size:16px';
  for (const group of ['Imperium','Chaos','Xenos','Otros']) {
    const fs = DATA.factions.filter(f => f.group === group);
    if (!fs.length) continue;
    const og = document.createElement('optgroup'); og.label = group;
    for (const f of fs) {
      const o = el('option'); o.value = f.slug; o.textContent = f.name;
      if (f.slug === draft.faction) o.selected = true;
      og.append(o);
    }
    fsel.append(og);
  }
  fsel.onchange = () => { draft.faction = fsel.value; refreshDet(); };
  v.append(labelledBlock('Faction', fsel));

  // tope de puntos — inmutable una vez creada
  const psel = numSelect([500,1000,1500,2000,2500,3000], draft.limit, n => draft.limit = n);
  psel.style.width = '100%';
  v.append(labelledBlock('Points limit', psel));
  v.append(hint('The points limit is fixed when the list is created. Changing it later would silently invalidate what you built.'));

  // destacamento
  // Los destacamentos se eligen dentro de la lista, no acá: son varios y
  // dependen del presupuesto de DP.
  function refreshDet(){}

  // formato
  const fmt = el('div','bar');
  fmt.append(check('Allow Legends',  draft.legends,  x => draft.legends  = x));
  fmt.append(check('Allow Crucible', draft.crucible, x => draft.crucible = x));
  v.append(fmt);

  // acciones
  const acts = el('div','bar');
  const ok = el('button','btn pri'); ok.textContent = 'CREATE';
  ok.onclick = () => {
    lists.push(draft); saveList(draft);
    draftList = null; creating = false; editing = draft.id;
    wizard = true; wizStep = 1;      // facción y puntos ya se eligieron acá
    renderLists();
  };
  const no = el('button','btn'); no.textContent = 'CANCEL';
  no.onclick = () => { draftList = null; creating = false; renderLists(); };
  acts.append(ok, no);
  v.append(acts);
}

function labelledBlock(text, node){
  const w = el('div'); w.style.marginBottom = '14px';
  const l = el('div'); l.style.cssText =
    'font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink2);margin-bottom:4px';
  l.textContent = text.toUpperCase();
  w.append(l, node); return w;
}

/* Barre las listas guardadas y borra opciones de armamento que ya no existen
 * en el catálogo. Pasa cuando el dato cambia o cuando una versión anterior de
 * la app ofrecía como elegible algo que en realidad era equipo fijo. */
function pruneGear(){
  let touched = 0;
  for (const l of lists) {
    const f = factionOf(l.faction);
    if (!f) continue;
    for (const sl of l.slots) {
      if (!sl.gear) continue;
      const u = f.units.find(x => x.id === sl.unitId);
      for (const k of Object.keys(sl.gear)) {
        const [gi, oi] = k.split(':').map(Number);
        const g = u && u.o && u.o[gi];
        const stale = !g || (Number.isFinite(oi) ? !g.opts[oi] : false);
        if (stale) { delete sl.gear[k]; touched++; }
      }
      if (!Object.keys(sl.gear).length) delete sl.gear;
    }
    if (touched) saveList(l);
  }
  return touched;
}

/* ------------------------------------------------------------------
 * MEJORAS (Enhancements)
 *
 * NO están en BSData 11e. Se buscó en grupos, categorías, reglas, perfiles
 * y tipos de perfil de los 46 archivos: no existen. Los destacamentos sólo
 * traen nombre, coste y reglas, sin hijos.
 *
 * Así que se cargan a mano: nombre + puntos, y opcionalmente a qué personaje
 * de la lista van. Suman al total, que es lo que rompe una lista de 2000.
 * La app NO sabe cuáles permite cada destacamento ni cuántas se pueden
 * llevar, y lo dice en pantalla en vez de fingir que valida.
 * ---------------------------------------------------------------- */
/* Presupuesto de DP por tamaño de partida. NO está en ninguna de las dos
 * fuentes: las entradas de Battle Size no traen costLimits y el MFM remite
 * a la app oficial. Es lo único del compositor que sale de las reglas y no
 * del dato, así que se deja editable. */
function dpBudget(l){
  if (l.dpBudget != null) return l.dpBudget;
  return l.limit >= 3000 ? 4 : l.limit >= 2000 ? 3 : 2;
}

function detachmentsFor(l, f){
  l.dets = l.dets || [];
  const box = el('div');
  box.style.cssText = 'margin:14px 0';

  const info = new Map(detsOf(f).map((d) => [d[0], d]));
  const spent = l.dets.reduce((a, n) => a + (info.get(n)?.[1] ?? 0), 0);
  const budget = dpBudget(l);

  const head = el('div','rrole');
  head.innerHTML = '<span>DETACHMENTS</span><span>' + spent + ' / ' + budget + ' DP</span>';
  box.append(head);

  for (const [i, name] of l.dets.entries()) {
    const d = info.get(name);
    const row = el('div','slot');
    row.innerHTML = '<div class="id"><div class="nm">' + esc(name) + '</div>' +
      '<div class="meta">' + (d ? d[1] + ' DP' : '?') +
      (d?.[2] ? ' \u00b7 ' + esc(d[2]) + (l.mission === d[2] ? ' \u2713' : '') : '') +
      (d?.[3] ? ' \u00b7 unique: ' + esc(d[3]) : '') + '</div></div>';
    const rm = el('button','btn'); rm.textContent = 'REMOVE';
    rm.onclick = () => {
      l.dets.splice(i,1);
      // Si la misión venía sólo de ese destacamento, se limpia.
      if (l.mission && !missionsFor(l, f).has(l.mission)) l.mission = '';
      saveList(l); renderLists();
    };
    row.append(rm);
    box.append(row);
  }

  const dlist = detsOf(f);
  if (dlist.length) {
    const sel = el('select');
    sel.style.cssText = 'width:100%;margin-top:8px;font-size:14px';
    const o0 = el('option'); o0.value=''; o0.textContent='Add a detachment\u2026'; sel.append(o0);
    for (const [name, dp, obj, uniq] of dlist) {
      if (l.dets.includes(name)) continue;
      const o = el('option'); o.value = name;
      o.textContent = name + '  \u00b7 ' + dp + ' DP' + (obj ? '  \u00b7 ' + obj : '');
      sel.append(o);
    }
    sel.onchange = () => {
      if (!sel.value) return;
      l.dets.push(sel.value); saveList(l); renderLists();
    };
    box.append(sel);
  } else {
    const i = el('input'); i.type='text'; i.placeholder='type a detachment name';
    i.style.cssText = 'width:100%;margin-top:8px';
    i.onchange = () => { if (i.value) { l.dets.push(i.value); saveList(l); renderLists(); } };
    box.append(i);
  }

  // presupuesto editable
  const bwrap = el('div');
  bwrap.style.cssText = 'display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:var(--ink2)';
  const bin = el('input'); bin.type='text'; bin.inputMode='numeric'; bin.value = budget;
  bin.style.cssText = 'width:52px;text-align:center;font-family:var(--mono);padding:4px 6px;' +
    'background:var(--panel);border:1px solid var(--rule2);border-radius:2px';
  bin.onchange = () => { l.dpBudget = parseInt(bin.value,10) || budget; saveList(l); renderLists(); };
  bwrap.append('DP available', bin);
  box.append(bwrap);

  box.append(hint('The DP budget for each battle size is not in the data \u2014 it lives in the official app. ' +
                  'Adjust it here if your event uses a different number.'));
  return box;
}

function enhancementsFor(l, f){
  l.enh = l.enh || [];
  const box = el('div');
  box.style.cssText = 'margin:14px 0';

  const head = el('div','rrole');
  const sum = l.enh.reduce((a, e) => a + (+e.pts || 0), 0);
  head.innerHTML = '<span>ENHANCEMENTS</span><span>' + sum + ' pts</span>';
  box.append(head);

  for (const [i, e] of l.enh.entries()) {
    const row = el('div','slot');

    // Si la facción trae mejoras en el catálogo, se eligen de una lista y los
    // puntos se completan solos. Si no, queda el campo libre de siempre.
    let name;
    // Con MFM, sólo se ofrecen las mejoras del destacamento elegido.
    // El repertorio es la UNIÓN de las mejoras de los destacamentos elegidos.
    const eb = enhByOf(f);
    const pool = eb
      ? (l.dets || []).flatMap((n) => eb[n] || [])
      : f.enh;

    if (pool && pool.length) {
      name = el('select');
      name.style.cssText = 'flex:1;min-width:0;font-family:var(--disp);font-weight:600;font-size:15px;max-width:100%';
      const o0 = el('option'); o0.value = ''; o0.textContent = 'choose an enhancement\u2026'; name.append(o0);
      for (const [n, pts] of pool) {
        const o = el('option'); o.value = n; o.textContent = n + '  \u00b7 ' + pts + ' pts';
        if (n === e.n) o.selected = true;
        name.append(o);
      }
      name.onchange = () => {
        e.n = name.value;
        const hit = pool.find(([n]) => n === name.value);
        e.pts = hit ? hit[1] : 0;
        saveList(l); renderLists();
      };
    } else {
      name = el('input'); name.type = 'text'; name.value = e.n || '';
      name.placeholder = 'Enhancement name';
      name.style.cssText = 'flex:1;min-width:0;font-family:var(--disp);font-weight:600;font-size:15px;' +
        'background:transparent;border:none;border-bottom:1px solid var(--rule2);padding:3px 0';
      name.oninput = () => { e.n = name.value; saveList(l); };
    }

    const pts = el('input'); pts.type = 'text'; pts.inputMode = 'numeric';
    pts.value = e.pts ?? 0;
    pts.style.cssText = 'width:64px;text-align:right;font-family:var(--mono);font-size:14px;' +
      'background:var(--panel);border:1px solid var(--rule2);border-radius:2px;padding:5px 7px';
    pts.onchange = () => { e.pts = parseInt(pts.value, 10) || 0; saveList(l); renderLists(); };

    // a qué personaje va
    const on = el('select'); on.style.cssText = 'font-size:12px;padding:5px 7px;max-width:190px';
    const none = el('option'); none.value = ''; none.textContent = 'unassigned'; on.append(none);
    for (const [j, sl] of l.slots.entries()) {
      const u = unitOf(l, sl.unitId);
      if (!u || !(u.kw || []).includes('Character')) continue;
      const o = el('option'); o.value = String(j);
      o.textContent = u.n;
      if (String(e.on) === String(j)) o.selected = true;
      on.append(o);
    }
    on.onchange = () => { e.on = on.value === '' ? null : +on.value; saveList(l); };

    const rm = el('button','btn'); rm.textContent = 'REMOVE';
    rm.onclick = () => { l.enh.splice(i, 1); saveList(l); renderLists(); };

    row.append(name, on, pts, rm);
    box.append(row);
  }

  const add = el('button','btn');
  add.textContent = '+ ENHANCEMENT';
  add.style.marginTop = '8px';
  add.onclick = () => { l.enh.push({ n:'', pts:0, on:null }); saveList(l); renderLists(); };
  box.append(add);

  const eb2 = enhByOf(f);
  box.append(hint(eb2 && !(l.dets || []).length
    ? 'Pick a detachment first \u2014 enhancements belong to detachments.'
    : eb2
    ? 'Enhancements and points come from the Munitorum Field Manual, filtered to your detachment. How many you may take is not checked.'
    : f.enh && f.enh.length
    ? 'Enhancement points come from the catalogue. Which ones your detachment allows, and how many you may take, are not checked.'
    : 'This faction has no enhancements in the catalogue yet, so type them in yourself. Their points still count towards the total.'));
  return box;
}

function newList(){ draftList = null; creating = true; renderLists(); }

/* ------------------------------------------------------------------
 * COMPARTIR
 *
 * El archivo guarda los NOMBRES además de los ids, y la revisión de datos
 * con la que se armó. Si el rival tiene un catálogo más nuevo y un id
 * cambió, la lista sigue siendo legible: se ve qué unidad era aunque no
 * se pueda recalcular.
 * ---------------------------------------------------------------- */
function exportList(l){
  const f = factionOf(l.faction);
  const payload = {
    schemaVersion: 1,
    kind: 'armoury-list',
    dataRevision: DATA?.revision?.sha ?? null,
    exportedAt: new Date().toISOString(),
    name: l.name || 'Untitled',
    faction: l.faction,
    factionName: f ? f.name : null,
    detachments: l.dets || [],
    dpBudget: dpBudget(l),
    mission: l.mission || null,
    enhancements: (l.enh || []).filter(e => e.n || e.pts),
    limit: l.limit,
    legends: !!l.legends,
    crucible: !!l.crucible,
    slots: l.slots.map((sl) => {
      const u = unitOf(l, sl.unitId);
      return {
        unitId: sl.unitId,
        unitName: u ? u.n : null,     // respaldo legible si el id ya no existe
        size: sl.size,
        attach: sl.attach ?? null,
        gear: sl.gear ?? null,
      };
    }),
  };

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (l.name || 'list').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

/* ------------------------------------------------------------------
 * COMPARTIR
 *
 * Tres formas, cada una para un destinatario distinto:
 *   .json  → otro usuario de Armoury, que la importa entera
 *   PDF    → papel o celular. La app NO genera el PDF: abre el diálogo de
 *            impresión, donde el navegador ofrece "Guardar como PDF".
 *            Generarlo en el archivo costaría sumar una librería de 300 KB.
 *   texto  → WhatsApp o Discord, que es como se comparte en la práctica.
 * ---------------------------------------------------------------- */
function shareMenu(l){
  const wrap = el('div');
  wrap.style.cssText = 'position:relative';

  const btn = el('button','btn');
  btn.textContent = 'SHARE \u25be';

  const menu = el('div','shmenu');
  menu.hidden = true;

  const item = (title, sub, fn) => {
    const b = el('button');
    b.innerHTML = '<b>' + title + '</b><i>' + sub + '</i>';
    b.onclick = () => { menu.hidden = true; fn(); };
    return b;
  };

  menu.append(
    item('Armoury file', 'A .json another Armoury user can import', () => exportList(l)),
    item('PDF or print', 'Opens the print dialog \u2014 choose Save as PDF', () => printList(l)),
    item('Copy as text', 'Plain text for chat', () => copyListText(l)),
  );

  btn.onclick = () => { menu.hidden = !menu.hidden; };
  document.addEventListener('click', (ev) => {
    if (!wrap.contains || menu.hidden) return;
    if (!wrap.contains(ev.target)) menu.hidden = true;
  });

  wrap.append(btn, menu);
  return wrap;
}

/* Texto plano, con el formato que se usa para pegar una lista en un chat. */
function listAsText(l){
  const f = factionOf(l.faction);
  const { total } = review(l);
  const copies = copyIndex(l);
  const lines = [];

  lines.push((l.name || 'Untitled') + '  (' + total + '/' + l.limit + ' pts)');
  lines.push(f ? f.name : '?');
  if ((l.dets || []).length) lines.push('Detachment: ' + l.dets.join(' + '));
  if (l.mission) lines.push('Mission: ' + l.mission);
  lines.push('');

  for (const [i, sl] of l.slots.entries()) {
    const u = unitOf(l, sl.unitId);
    if (!u) { lines.push('- ' + (sl.unitName || 'Unknown')); continue; }
    const pts = ptsFor(u, sl.size, copies[i]) + gearPoints(u, sl);
    lines.push('- ' + u.n + (sl.size > 1 ? ' x' + sl.size : '') + '  [' + pts + ']');

    const gear = [];
    for (const [k, v] of Object.entries(sl.gear || {})) {
      if (typeof v === 'string') { gear.push(v); continue; }
      const [gi, oi] = k.split(':').map(Number);
      const nm = u.o?.[gi]?.opts?.[oi]?.[0];
      if (nm && v > 0) gear.push(nm + ' x' + v);
    }
    if (gear.length) lines.push('    ' + gear.join(', '));

    const att = sl.attach && l.slots[sl.attach - 1];
    const au = att && unitOf(l, att.unitId);
    if (au) lines.push('    leading ' + au.n);
  }

  for (const e of (l.enh || [])) {
    if (!e.n && !e.pts) continue;
    const host = e.on != null && l.slots[e.on];
    const hu = host && unitOf(l, host.unitId);
    lines.push('- ' + (e.n || 'Enhancement') + '  [' + (+e.pts || 0) + ']' +
               (hu ? '  on ' + hu.n : ''));
  }

  lines.push('');
  lines.push('Total: ' + total + ' / ' + l.limit + ' pts');
  return lines.join('\n');
}

function copyListText(l){
  const txt = listAsText(l);
  const done = () => alert('List copied. Paste it wherever you like.');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done, () => fallback());
  } else fallback();

  function fallback(){
    // Sin portapapeles (pasa en file://): se descarga como .txt.
    const url = URL.createObjectURL(new Blob([txt], { type:'text/plain' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = (l.name || 'list').toLowerCase().replace(/[^a-z0-9]+/g,'-') + '.txt';
    a.click();
    URL.revokeObjectURL(url);
  }
}

function importList(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json';
  inp.onchange = async () => {
    try {
      const d = JSON.parse(await inp.files[0].text());
      if (d.kind !== 'armoury-list' || !Array.isArray(d.slots))
        throw new Error('Not an Armoury list file.');

      const l = {
        id: Date.now(),
        name: d.name || 'Imported list',
        faction: d.faction,
        dets: Array.isArray(d.detachments) ? d.detachments : (d.detachment ? [d.detachment] : []),
        dpBudget: d.dpBudget ?? null,
        mission: d.mission || '',
        enh: Array.isArray(d.enhancements) ? d.enhancements : [],
        limit: d.limit || 2000,
        legends: !!d.legends,
        crucible: !!d.crucible,
        // Marca de lista ajena: sin esto, la app avisaría que "te faltan
        // miniaturas" para una lista que no es tuya.
        foreign: true,
        importedRevision: d.dataRevision ?? null,
        slots: d.slots.map((sl) => ({
          unitId: sl.unitId, size: sl.size,
          attach: sl.attach ?? null, gear: sl.gear ?? null,
          unitName: sl.unitName ?? null,
        })),
      };
      lists.push(l); saveList(l); editing = l.id; renderLists();
    } catch (e) {
      alert(e.message || 'Could not read that file.');
    }
  };
  inp.click();
}

/* ------------------------------------------------------------------
 * IMPRESIÓN — hoja de consulta rápida.
 * Primero el resumen de la lista, después una ficha por unidad, cada una
 * sin cortarse entre páginas.
 * ---------------------------------------------------------------- */
/* Longitud máxima del texto de una habilidad impresa. Es la perilla que
 * regula cuántas páginas ocupa la lista. */
const PRINT_AB_LEN = 190;

function printList(l){
  const f = factionOf(l.faction);
  const { total } = review(l);
  const area = document.getElementById('printArea');
  area.innerHTML = '';

  const head = el('div','pr-head');
  head.innerHTML = '<h1>' + esc(l.name || 'Untitled') + '</h1>' +
    '<div class="m">' + esc(f ? f.name : '?') +
    ((l.dets || []).length ? ' \u00b7 ' + esc(l.dets.join(' + ')) : '') +
    (l.mission ? ' \u00b7 ' + esc(l.mission) : '') +
    ' \u00b7 ' + total + ' / ' + l.limit + ' pts' +
    (l.foreign ? ' \u00b7 OPPONENT LIST' : '') +
    ' \u00b7 data ' + esc(String(l.importedRevision || DATA?.revision?.sha || '?')) + '</div>';
  area.append(head);

  // resumen
  const t = el('table','pr-roster');
  const prCopies = copyIndex(l);
  // Orden de impresión: cada líder inmediatamente después de la unidad que
  // lidera, sangrado. En la mesa se consultan juntos.
  const order = [];
  const placed = new Set();
  l.slots.forEach((sl, i) => {
    if (sl.attach != null) return;                 // los líderes van con su unidad
    order.push(i); placed.add(i);
    l.slots.forEach((s2, j) => {
      if (s2.attach - 1 === i && !placed.has(j)) { order.push(j); placed.add(j); }
    });
  });
  l.slots.forEach((_, i) => { if (!placed.has(i)) order.push(i); });

  t.innerHTML = order.map((pi) => {
    const sl = l.slots[pi];
    const u = unitOf(l, sl.unitId);
    const att = sl.attach && l.slots[sl.attach - 1];
    const au = att && unitOf(l, att.unitId);
    const gear = sl.gear ? Object.entries(sl.gear).filter(([,v]) => v).map(([k,v]) =>
      typeof v === 'number' ? gearName(u, k) + ' \u00d7' + v : v).filter(Boolean) : [];
    return '<tr><td' + (au ? ' class="lead"' : '') + '>' +
      (au ? '\u21b3 ' : '') + esc(u ? u.n : (sl.unitName || 'Unknown')) +
      (sl.size > 1 ? ' \u00d7' + sl.size : '') +
      (gear.length ? '<br><span style="font-size:11px;color:#555">' + esc(gear.join(', ')) + '</span>' : '') +
      '</td><td>' + (u ? (ptsFor(u, sl.size, prCopies[pi]) + gearPoints(u, sl)) : '\u2014') + '</td></tr>';
  }).join('') +
    (l.enh || []).filter(e => e.n || e.pts).map((e) => {
      const host = e.on != null && l.slots[e.on];
      const hu = host && unitOf(l, host.unitId);
      return '<tr><td>' + esc(e.n || 'Enhancement') +
        (hu ? '<br><span style="font-size:11px;color:#555">on ' + esc(hu.n) + '</span>' : '') +
        '</td><td>' + (+e.pts || 0) + '</td></tr>';
    }).join('') +
    '<tr class="tot"><td>TOTAL</td><td>' + total + '</td></tr>';
  area.append(t);

  // fichas, una por unidad distinta
  // Fichas de referencia, dos por fila. Una ficha por combinación de unidad
  // y equipamiento: dos Defilers con armas distintas son dos fichas.
  const grid = el('div','pr-grid');
  const seen = new Set();

  for (const [si, sl] of l.slots.entries()) {
    const key = sl.unitId + '|' + JSON.stringify(sl.gear || {});
    if (seen.has(key)) continue;
    seen.add(key);
    const u = unitOf(l, sl.unitId);
    if (!u || !hasSheet(u)) continue;

    const card = el('div','pr-card');
    const pts = ptsFor(u, sl.size, copyIndex(l)[si]) + gearPoints(u, sl);
    let inner = '<h3><span>' + esc(u.n) + '</span><em>\u00d7' + sl.size + ' \u00b7 ' + pts + ' pts</em></h3>';

    if (u.st) {
      const labs = ['M','T','SV','W','LD','OC'];
      inner += '<div class="pr-strip">' + u.st
        .map((v, i) => {
          if (!v) return '';
          // En papel la invulnerable va dentro de la caja de salvación con
          // una barra: "2+/4+". Una caja aparte gastaba espacio sin ganar nada.
          const txt = (i === 2 && u.inv) ? v + '/' + u.inv : v;
          const lab = (i === 2 && u.inv) ? 'SV/INV' : labs[i];
          return '<span' + (i === 2 && u.inv ? ' class="wide"' : '') +
                 '><i>' + lab + '</i>' + esc(txt) + '</span>';
        })
        .join('') + '</div>';
    }

    // Sólo las armas que la unidad lleva de verdad, con cuántas la portan.
    const ws = weaponsAfterGear(u, sl);
    const counts = weaponCounts(u, sl);
    if (ws.length) {
      // Ranged primero, melee después: es el orden de la ficha oficial.
      const shown = [...ws].sort((a, b) => a[1] - b[1]).slice(0, 6);
      inner += '<table class="pr-w">' + shown.map((w) => {
        const c = counts && counts.get(wkey(w[0]));
        return '<tr' + (w[1] ? ' class="mel"' : '') + '><td>' + esc(w[0]) +
          (c > 1 ? ' <b>\u00d7' + c + '</b>' : '') + '</td>' +
          '<td>' + esc(w[2]) + '</td><td>' + esc(w[3]) + '</td><td>' + esc(w[4]) +
          '</td><td>' + esc(w[5]) + '</td><td>' + esc(w[6]) + '</td><td>' + esc(w[7]) + '</td></tr>';
      }).join('') + '</table>';
      if (ws.length > shown.length)
        inner += '<div class="pr-more">+' + (ws.length - shown.length) + ' more weapons</div>';
    }

    // Habilidades con su texto. Ocupa bastante, así que va en cuerpo 8,5 y
    // el texto muy largo se recorta: en la mesa alcanza con el enunciado
    // para saber qué hace, y el detalle se consulta en la app.
    if (u.ab && u.ab.length) {
      inner += '<div class="pr-abs">' + u.ab.map(([n, t]) => {
        const cut = t.length > PRINT_AB_LEN ? t.slice(0, PRINT_AB_LEN).replace(/\s+\S*$/, '') + '\u2026' : t;
        return '<p><b>' + esc(n) + '.</b> ' + esc(cut) + '</p>';
      }).join('') + '</div>';
    }

    // Palabras clave: la línea que se consulta para saber si una regla aplica.
    if (u.kw && u.kw.length)
      inner += '<div class="pr-kw">' + esc(u.kw.join(' \u00b7 ')) + '</div>';

    card.innerHTML = inner;
    grid.append(card);
  }
  area.append(grid);

  window.print();
}

// nombre legible de una opción de armamento a partir de su clave "grupo:opción"
function gearName(u, key){
  if (!u || !u.o) return key;
  const [gi, oi] = key.split(':').map(Number);
  return u.o[gi]?.opts?.[oi]?.[0] ?? key;
}

/* ---------- pestañas ---------- */
function showTab(which){
  if (which === 'col') document.getElementById('shell').className = 'wrap';
  for (const [tab, view] of [['tabHome','viewHome'], ['tabCol','viewCol'], ['tabList','viewLists'],
                             ['tabBattle','viewBattles'], ['tabStats','viewStats']]) {
    const on = tab === ({ home:'tabHome', col:'tabCol', lists:'tabList', battles:'tabBattle',
                          stats:'tabStats' })[which];
    document.getElementById(view).hidden = !on;
    document.getElementById(tab).setAttribute('aria-selected', on);
  }
  document.querySelector('.totals').hidden = which !== 'col';
  if (which === 'lists')   renderLists();
  if (which === 'battles') renderBattles();
  if (which === 'stats')   renderStats();
  if (which === 'home')    renderHome();
}
document.getElementById('tabHome').onclick  = () => showTab('home');
document.getElementById('tabCol').onclick    = () => showTab('col');
document.getElementById('tabList').onclick   = () => showTab('lists');
document.getElementById('tabBattle').onclick = () => showTab('battles');
document.getElementById('tabStats').onclick  = () => showTab('stats');

/* ============================================================
   BATALLAS
   
   Registro de una partida: tus listas contra un rival, la misión, el
   marcador ronda por ronda y un reloj por jugador.
   
   El reloj es lo que más pediste y lo que ninguna app resuelve bien:
   marca el ritmo. A 2000 puntos y 5 rondas, cada jugador tiene unos
   80 minutos; si vas 10 minutos por encima del ritmo, lo avisa antes
   de que se acabe el tiempo, no después.
   ============================================================ */
let battles = [];
let openBattle = null;

function saveBattle(b){ store.put('battles', b); }
function loadBattles(){ return store.getAll('battles'); }

const ROUNDS = 5;

/* ------------------------------------------------------------------
 * MISIONES DE EVENTO
 *
 * Tu Force Disposition contra la del rival determina la Misión Primaria de
 * cada uno. Las cinco disposiciones dan 15 combinaciones, y las trae el
 * Warhammer Event Companion (v1.1). Cada combinación tiene además tres
 * disposiciones de terreno recomendadas: A, B y C.
 *
 * Se guarda sólo el mapa de nombres — lo necesario para saber qué jugás.
 * Las condiciones de puntuación de cada carta son de la baraja de GW y no
 * están acá: el marcador sigue siendo manual.
 * ---------------------------------------------------------------- */
const DISPOSITIONS = ['TAKE AND HOLD','PURGE THE FOE','DISRUPTION','RECONNAISSANCE','PRIORITY ASSETS'];

const MISSION_TABLE = {
  'TAKE AND HOLD|TAKE AND HOLD':      ['Battlefield Dominance','Battlefield Dominance'],
  'TAKE AND HOLD|PURGE THE FOE':      ['Immovable Object','Unstoppable Force'],
  'TAKE AND HOLD|DISRUPTION':         ['Determined Acquisition','Death Trap'],
  'TAKE AND HOLD|RECONNAISSANCE':     ['Purge and Secure','Reconnaissance Sweep'],
  'TAKE AND HOLD|PRIORITY ASSETS':    ['Inescapable Dominion','Secure Asset'],
  'PURGE THE FOE|PURGE THE FOE':      ['Meatgrinder','Meatgrinder'],
  'PURGE THE FOE|DISRUPTION':         ['Punishment','Delaying Action'],
  'PURGE THE FOE|RECONNAISSANCE':     ['Consecrate','Triangulation'],
  'PURGE THE FOE|PRIORITY ASSETS':    ["Destroyer's Wrath",'Vital Link'],
  'DISRUPTION|DISRUPTION':            ['Outmanoeuvre','Outmanoeuvre'],
  'DISRUPTION|RECONNAISSANCE':        ['Smoke and Mirrors','Surveil the Foe'],
  'DISRUPTION|PRIORITY ASSETS':       ['Locate and Deny','Extract Relic'],
  'RECONNAISSANCE|RECONNAISSANCE':    ['Gather Intel','Gather Intel'],
  'RECONNAISSANCE|PRIORITY ASSETS':   ['Search and Scour','Vanguard Operation'],
  'PRIORITY ASSETS|PRIORITY ASSETS':  ['Sabotage','Sabotage'],
};

/* Con el dataset comunitario cargado, las disposiciones y la matriz salen
 * de ahí; la tabla de arriba queda como respaldo si no se corrió missions.mjs. */
function dispositionList(){
  return DATA.missions?.dispositions ?? DISPOSITIONS;
}

/** Celda completa de la matriz: nombre de misión y sus tramos de puntuación. */
function primaryCell(mine, theirs){
  const mx = DATA.missions?.matrix;
  if (mx && mx[mine] && mx[mine][theirs]) return mx[mine][theirs];
  const up = (x) => String(x).toUpperCase();
  const t = MISSION_TABLE[up(mine) + '|' + up(theirs)];
  if (t) return { n: t[0], score: [] };
  const f = MISSION_TABLE[up(theirs) + '|' + up(mine)];
  return f ? { n: f[1], score: [] } : null;
}

/** Devuelve [misión propia, misión del rival] a partir de las disposiciones. */
function missionsFrom(mine, theirs){
  if (!mine || !theirs) return null;
  const a = primaryCell(mine, theirs), b = primaryCell(theirs, mine);
  return (a && b) ? [a.n, b.n] : null;
}

/* Topes de puntos de victoria del Event Companion. */
const VP_CAP = { perRound: 15, primary: 45, secondary: 45, painted: 10 };

function newBattle(){
  const b = {
    id: Date.now(),
    date: new Date().toISOString().slice(0, 10),
    mine: lists[0]?.id ?? null,
    opponent: '',
    oppList: null,          // id de una lista importada, si la cargaste
    disp: { me: '', them: '' },   // Force Disposition de cada jugador
    layout: '',                   // A, B o C
    painted: { me: false, them: false },
    limit: 2000,
    // marcador: [{ primary, secondary }] por ronda y jugador
    me: Array.from({ length: ROUNDS }, () => ({ p: 0, s: 0 })),
    them: Array.from({ length: ROUNDS }, () => ({ p: 0, s: 0 })),
    cp: { me: 0, them: 0 },
    clock: { me: 0, them: 0, budget: 80 * 60, running: null, since: null },
    round: 1,
    notes: '',
    done: false,
  };
  battles.push(b); saveBattle(b); openBattle = b.id; renderBattles();
}

/* --- reloj: se guarda el acumulado y el instante de arranque, no un
   intervalo. Así el tiempo sigue corriendo aunque cierres la pestaña. --- */
let clockTimer = null;

function elapsed(b, who){
  const c = b.clock;
  let t = c[who] || 0;
  if (c.running === who && c.since) t += Math.floor((Date.now() - c.since) / 1000);
  return t;
}

function toggleClock(b, who){
  const c = b.clock;
  if (c.running === who) {
    c[who] = elapsed(b, who);
    c.running = null; c.since = null;
  } else {
    if (c.running) { c[c.running] = elapsed(b, c.running); }
    c.running = who; c.since = Date.now(); c.paused = null;
  }
  saveBattle(b); renderBattles();
}

function mmss(s){
  const m = Math.floor(s / 60), r = s % 60;
  return m + ':' + String(r).padStart(2, '0');
}

/* Ritmo esperado: el presupuesto repartido entre las rondas jugadas. */
function pace(b, who){
  const spent = elapsed(b, who);
  const should = Math.round(b.clock.budget * (b.round - 1 + 0.5) / ROUNDS);
  return { spent, should, over: spent - should };
}

/* Total con los topes del Event Companion aplicados: 15 VP por ronda en
 * cada fuente, 45 de primaria, 45 de secundarias y 10 por ejército pintado.
 * Sin esto la app deja sumar cualquier cifra y el marcador no sirve. */
function battleTotals(b){
  const side = (who) => {
    let prim = 0, sec = 0;
    for (const r of b[who]) {
      prim += Math.min(+r.p || 0, VP_CAP.perRound);
      sec  += Math.min(+r.s || 0, VP_CAP.perRound);
    }
    prim = Math.min(prim, VP_CAP.primary);
    sec  = Math.min(sec,  VP_CAP.secondary);
    const paint = (b.painted && b.painted[who]) ? VP_CAP.painted : 0;
    return { prim, sec, paint, total: prim + sec + paint };
  };
  const me = side('me'), them = side('them');
  return { me: me.total, them: them.total, detail: { me, them } };
}

function renderBattles(){
  try { renderBattlesInner(); }
  catch (e) {
    const v = document.getElementById('viewBattles');
    v.innerHTML = '';
    const w = el('div','warn');
    w.innerHTML = '<b>BATTLE VIEW FAILED</b>' + escSafe(e.message);
    v.append(w);
  }
}

function renderBattlesInner(){
  const v = document.getElementById('viewBattles');
  v.innerHTML = '';

  if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }

  if (openBattle == null) {
    const bar = el('div','bar');
    const nw = el('button','btn pri'); nw.textContent = 'NEW BATTLE';
    nw.onclick = newBattle;
    bar.append(nw); v.append(bar);

    if (!battles.length) { v.append(note('No battles yet. Start one to track the score and the clock.')); return; }

    for (const b of [...battles].sort((a, c) => c.id - a.id)) {
      const t = battleTotals(b);
      const mine = lists.find((x) => x.id === b.mine);
      const c = el('div','card');
      c.innerHTML = '<div><div class="nm">' + esc(mine ? mine.name || 'Untitled' : '?') +
        ' vs ' + esc(b.opponent || '?') + '</div>' +
        '<div class="meta">' + esc(b.date) + (b.mission ? ' · ' + esc(b.mission) : '') +
        (b.done ? ' · finished' : ' · round ' + b.round) + '</div></div>' +
        '<div class="pts">' + t.me + ' – ' + t.them + '</div>';
      c.onclick = () => { openBattle = b.id; renderBattles(); };
      v.append(c);
    }
    return;
  }

  const b = battles.find((x) => x.id === openBattle);
  if (!b) { openBattle = null; return renderBattles(); }

  // ---- cabecera
  const bar = el('div','bar');
  const back = el('button','btn'); back.textContent = '\u2190 ALL BATTLES';
  back.onclick = () => { openBattle = null; renderBattles(); };
  const shr = battleShareMenu(b);
  const del = el('button','btn'); del.textContent = 'DELETE';
  del.onclick = () => {
    if (!confirm('Delete this battle?')) return;
    store.del('battles', b.id);
    battles = battles.filter((x) => x.id !== b.id);
    openBattle = null; renderBattles();
  };
  bar.append(back, shr, del); v.append(bar);

  // ---- configuración
  const cfg = el('div','bar');
  const mySel = el('select');
  const none = el('option'); none.value=''; none.textContent='(no list)'; mySel.append(none);
  for (const l of lists) {
    if (l.foreign) continue;
    const o = el('option'); o.value = l.id; o.textContent = l.name || 'Untitled';
    if (l.id === b.mine) o.selected = true;
    mySel.append(o);
  }
  mySel.onchange = () => { b.mine = mySel.value ? +mySel.value : null; saveBattle(b); renderBattles(); };
  cfg.append(labelled('My list', mySel));

  const opp = el('input'); opp.type='text'; opp.placeholder='opponent';
  opp.style.cssText='width:150px;font-size:13px'; opp.value = b.opponent;
  opp.oninput = () => { b.opponent = opp.value; saveBattle(b); };
  cfg.append(labelled('Against', opp));

  // Lista del rival: sólo las importadas, que son las suyas.
  const foreign = lists.filter((x) => x.foreign);
  if (foreign.length) {
    const os = el('select');
    const n0 = el('option'); n0.value=''; n0.textContent='—'; os.append(n0);
    for (const l of foreign) {
      const o = el('option'); o.value = l.id; o.textContent = l.name || 'Untitled';
      if (l.id === b.oppList) o.selected = true;
      os.append(o);
    }
    os.onchange = () => { b.oppList = os.value ? +os.value : null; saveBattle(b); };
    cfg.append(labelled('Their list', os));
  }

  v.append(cfg);
  v.append(missionPanel(b));

  // ---- reloj
  v.append(clockPanel(b));

  // ---- marcador
  const t = battleTotals(b);
  const head = el('div','ledger');
  head.innerHTML = '<div class="lf">Round ' + b.round + '</div>' +
    '<div class="lm"><b>' + t.me + '</b><i>me</i></div>' +
    '<div class="lm"><b>' + t.them + '</b><i>them</i></div>';
  v.append(head);
  v.append(scoreTable(b));
  // Se muestra el lado que está jugando: dos paneles completos de hasta diez
  // cartas cada uno no entran en una pantalla. El reloj decide, y se puede
  // forzar con las pestañas.
  const side = b.secView || b.clock.running || b.clock.paused || 'me';
  v.append(secSwitch(b, side));
  v.append(secondaryPanel(b, side));
  v.append(trackerPanel(b));

  const d = t.detail;
  const brk = el('div','hint');
  brk.textContent =
    'Me: ' + d.me.prim + ' primary + ' + d.me.sec + ' secondary' +
    (d.me.paint ? ' + ' + d.me.paint + ' painted' : '') + '   ·   ' +
    'Them: ' + d.them.prim + ' + ' + d.them.sec +
    (d.them.paint ? ' + ' + d.them.paint : '') +
    '   ·   caps: 15/round, 45 primary, 45 secondary';
  v.append(brk);

  // ---- puntos de mando y notas
  const cpBar = el('div','bar');
  for (const who of ['me','them']) {
    const i = el('input'); i.type='text'; i.inputMode='numeric';
    i.style.cssText='width:56px;text-align:center;font-family:var(--mono)';
    i.value = b.cp[who];
    i.onchange = () => {
      // El Event Companion limita a 1 PM por ronda además del CP básico.
      const max = b.round;
      const n = Math.max(0, Math.min(max, parseInt(i.value,10) || 0));
      b.cp[who] = n; i.value = n; saveBattle(b);
    };
    cpBar.append(labelled(who === 'me' ? 'My CP' : 'Their CP', i));
  }
  // Selector simple: numSelect() rotula en puntos y mostraba "3 pts".
  const rnd = el('select');
  for (let i = 1; i <= ROUNDS; i++) {
    const o = el('option'); o.value = i; o.textContent = 'Round ' + i;
    if (i === b.round) o.selected = true;
    rnd.append(o);
  }
  rnd.onchange = () => {
    b.round = +rnd.value;
    // Al empezar la ronda se roba hasta tener dos activas: es la regla, y
    // esperar a que el usuario apriete un botón era un paso de más.
    drawSecondaries(b, false, 'me');
    drawSecondaries(b, false, 'them');
    saveBattle(b); renderBattles();
  };
  cpBar.append(rnd);

  // Tope de primaria por ronda: 15 por defecto, ajustable si la misión
  // que te tocó puntúa distinto.
  const pc = el('input'); pc.type='text'; pc.inputMode='numeric';
  pc.style.cssText='width:52px;text-align:center;font-family:var(--mono)';
  pc.value = b.primCap ?? VP_CAP.perRound;
  pc.onchange = () => { b.primCap = Math.max(0, parseInt(pc.value,10) || VP_CAP.perRound); saveBattle(b); };
  cpBar.append(labelled('Primary cap/round', pc));
  b.painted = b.painted || { me:false, them:false };
  for (const who of ['me','them'])
    cpBar.append(check(who === 'me' ? 'Mine painted' : 'Theirs painted', b.painted[who],
      (x) => { b.painted[who] = x; saveBattle(b); renderBattles(); }));
  // La casilla suelta se fue al menú FINISH: estaba perdida entre los PM.
  v.append(cpBar);

  const nt = el('textarea');
  nt.placeholder = 'Notes — deployment, what went wrong, what to change';
  nt.style.cssText = 'width:100%;min-height:80px;margin-top:12px;padding:10px;' +
    'background:var(--panel);border:1px solid var(--rule2);border-radius:2px;' +
    'color:var(--ink);font:inherit;resize:vertical';
  nt.value = b.notes;
  nt.oninput = () => { b.notes = nt.value; saveBattle(b); };
  v.append(nt);

  // Redibujar sólo el reloj cada segundo: volver a dibujar todo perdería
  // el foco de los campos mientras escribís.
  if (b.clock.running) {
    clockTimer = setInterval(() => {
      for (const who of ['me','them']) {
        const box = document.getElementById('clk-' + who);
        if (!box) continue;
        const p = pace(b, who);
        box.textContent = mmss(p.spent);
        box.className = 'clkt' + (p.over > 600 ? ' late' : (p.over > 0 ? ' over' : ''));
      }
    }, 1000);
  }
}

/* Panel de misión: cada jugador elige su Force Disposition y la app deriva
 * las dos misiones primarias. La disposición propia sale de la lista si ya
 * la elegiste ahí. */
function missionPanel(b){
  b.disp = b.disp || { me:'', them:'' };
  const box = el('div');
  box.style.cssText = 'margin:14px 0';

  // Sugerencia desde la lista: si la lista ya fijó su Force Disposition,
  // no tiene sentido volver a preguntarla.
  const mine = lists.find((x) => x.id === b.mine);
  if (mine && mine.mission && !b.disp.me) {
    const hit = dispositionList().find((d) => d.toUpperCase() === String(mine.mission).toUpperCase());
    if (hit) { b.disp.me = hit; saveBattle(b); }
  }

  const bar = el('div','bar');
  for (const who of ['me','them']) {
    const sel = el('select');
    sel.style.cssText = 'font-size:13px';
    const o0 = el('option'); o0.value=''; o0.textContent='—'; sel.append(o0);
    for (const d of dispositionList()) {
      const o = el('option'); o.value = d; o.textContent = d;
      if (b.disp[who] === d) o.selected = true;
      sel.append(o);
    }
    sel.onchange = () => { b.disp[who] = sel.value; saveBattle(b); renderBattles(); };
    bar.append(labelled(who === 'me' ? 'My disposition' : 'Their disposition', sel));
  }

  // Sólo las disposiciones de terreno que existen para este emparejamiento.
  const avail = layoutsFor(b.disp.me, b.disp.them);
  const lay = el('select');
  const l0 = el('option'); l0.value=''; l0.textContent='—'; lay.append(l0);
  for (const x of (avail.length ? avail.map((z) => z.letter) : ['A','B','C'])) {
    const o = el('option'); o.value=x; o.textContent='Layout ' + x;
    if (b.layout === x) o.selected = true;
    lay.append(o);
  }
  lay.onchange = () => { b.layout = lay.value; saveBattle(b); };
  bar.append(labelled('Terrain', lay));

  // El documento dice que la disposición se puede sortear entre las tres.
  const roll = el('button','btn'); roll.textContent = 'ROLL';
  roll.onclick = () => {
    const pool = avail.length ? avail.map((z) => z.letter) : ['A','B','C'];
    b.layout = pool[Math.floor(Math.random() * pool.length)];
    saveBattle(b); renderBattles();
  };
  bar.append(roll);
  box.append(bar);

  const m = missionsFrom(b.disp.me, b.disp.them);
  const out = el('div','misres');
  if (m) {
    b.mission = m[0]; saveBattle(b);
    const cellMe = primaryCell(b.disp.me, b.disp.them);
    const cellTh = primaryCell(b.disp.them, b.disp.me);
    const tiers = (c) => (c?.score ?? []).map((t) =>
      '<u>' + esc(t.w) + (t.max ? ' · max ' + esc(t.max) : '') + '</u>' +
      t.i.map(([vp, tx]) => '<em><b>' + esc(vp) + '</b> ' + esc(tx) + '</em>').join('')).join('');
    out.innerHTML =
      '<div><b>' + esc(m[0]) + '</b><i>my primary mission</i>' + tiers(cellMe) + '</div>' +
      '<div><b>' + esc(m[1]) + '</b><i>theirs</i>' + tiers(cellTh) + '</div>';
  } else {
    out.innerHTML = '<div class="empty">Pick both Force Dispositions to see the primary missions.</div>';
  }
  box.append(out);

  // Mapa de despliegue del dataset comunitario. Se carga sólo al desplegarlo:
  // son imágenes de varios cientos de KB y en la mesa no siempre hay señal.
  const map = layoutsFor(b.disp.me, b.disp.them).find((z) => z.letter === b.layout);
  if (map) {
    const det = document.createElement('details');
    det.className = 'cfg';
    det.innerHTML = '<summary>Deployment map <span>layout ' + esc(b.layout) + '</span></summary>';
    const body = el('div');
    const img = el('img');
    img.loading = 'lazy';
    img.alt = 'Deployment layout ' + b.layout + ' \u2014 ' + b.disp.me + ' vs ' + b.disp.them;
    img.style.cssText = 'width:100%;height:auto;border-radius:3px;background:#fff';

    // La imagen vive en un CDN: en el club sin señal no va a cargar. En vez
    // de dejar un hueco mudo, se avisa y se ofrece el enlace para guardarla
    // antes de salir de casa.
    img.onerror = () => {
      img.remove();
      const w = el('div','warn soft');
      w.innerHTML = '<b>MAP NOT AVAILABLE OFFLINE</b>' +
        'The layout image is hosted online. Open it once while you have signal ' +
        'and your browser will keep it cached.' +
        '<div style="margin-top:6px"><a href="' + esc(map.img) + '" target="_blank" ' +
        'rel="noopener" style="color:var(--ochre)">Open the map</a></div>';
      body.insertBefore(w, body.firstChild);
    };
    img.src = map.img;
    const cap = el('div','hint');
    cap.textContent = map.a + ' vs ' + map.d +
      (map.page ? ' \u00b7 Event Companion p.' + map.page : '') +
      ' \u00b7 image from ' + (DATA.missions?.source || 'the community dataset') +
      ' (' + (DATA.missions?.licence || '') + ')';
    body.append(img, cap);
    det.append(body);
    box.append(det);
  }

  return box;
}

/* Despliegues disponibles para un par de disposiciones. El dataset guarda
 * el emparejamiento en un sentido, así que se prueba también invertido. */
function layoutsFor(mine, theirs){
  const all = DATA.missions?.layouts ?? [];
  if (!mine || !theirs) return [];
  const eq = (a, b2) => String(a).toLowerCase() === String(b2).toLowerCase();
  return all.filter((z) =>
    (eq(z.a, mine) && eq(z.d, theirs)) || (eq(z.a, theirs) && eq(z.d, mine)));
}

/* Compartir UNA batalla. El de Stats manda todas juntas, que sirve para el
 * feed del club pero no para pasarle el resultado a quien acabás de jugar. */
function battleShareMenu(b){
  const wrap = el('div');
  wrap.style.cssText = 'position:relative';

  const btn = el('button','btn');
  btn.textContent = 'FINISH \u25be';

  const menu = el('div','shmenu');
  menu.hidden = true;

  const item = (title, sub, fn) => {
    const x = el('button');
    x.innerHTML = '<b>' + title + '</b><i>' + sub + '</i>';
    x.onclick = () => { menu.hidden = true; fn(); };
    return x;
  };

  menu.append(
    item(b.done ? 'Reopen this battle' : 'Mark as finished',
         b.done ? 'It stops counting as played' : 'Only finished battles count in Stats',
         () => { b.done = !b.done; saveBattle(b); renderBattles(); }),

    item('Result file', 'Just this battle, for the club feed', () => {
      if (!b.done) { b.done = true; saveBattle(b); }
      const payload = { kind:'armoury-stats', v:1,
        exportedAt: new Date().toISOString(), battles: [summarise(b)] };
      const url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)],
        { type:'application/json' }));
      const a = document.createElement('a'); a.href = url;
      a.download = 'battle-' + b.date + '.json'; a.click(); URL.revokeObjectURL(url);
      renderBattles();
    }),

    item('Copy as text', 'For chat', () => copyBattleText(b)),
  );

  btn.onclick = () => { menu.hidden = !menu.hidden; };
  document.addEventListener('click', (ev) => {
    if (menu.hidden || !wrap.contains) return;
    if (!wrap.contains(ev.target)) menu.hidden = true;
  });

  wrap.append(btn, menu);
  return wrap;
}

function copyBattleText(b){
  const t = battleTotals(b);
  const l = lists.find((x) => x.id === b.mine);
  const f = l ? factionOf(l.faction) : null;
  const lines = [];

  lines.push((f ? f.name : '?') + '  ' + t.me + ' \u2013 ' + t.them + '  ' + (b.opponent || 'opponent'));
  if (b.disp?.me) lines.push(b.disp.me + ' vs ' + (b.disp.them || '?') +
    (b.mission ? '  \u2014  ' + b.mission : ''));
  lines.push('');

  const d = t.detail;
  const brk = (x) => x.prim + ' primary + ' + x.sec + ' secondary' +
                     (x.paint ? ' + ' + x.paint + ' painted' : '');
  lines.push('Me:   ' + brk(d.me));
  lines.push('Them: ' + brk(d.them));

  // Marcador ronda por ronda: es lo que permite reconstruir la partida.
  lines.push('');
  lines.push('        R1    R2    R3    R4    R5');
  const rowTxt = (arr) => arr.map((r) => String((+r.p||0) + '+' + (+r.s||0)).padEnd(6)).join('');
  lines.push('Me      ' + rowTxt(b.me));
  lines.push('Them    ' + rowTxt(b.them));
  lines.push('CP: ' + (b.cp?.me ?? 0) + ' \u2013 ' + (b.cp?.them ?? 0));

  // Bajas de los dos lados con su ronda.
  const lostOf = (list, tr) => {
    const out = [];
    if (!list) return out;
    for (const [i, sl] of list.slots.entries()) {
      const u = unitOf(list, sl.unitId);
      if (u && tr[i] && tr[i].dead != null) out.push(u.n + ' (R' + tr[i].dead + ')');
    }
    return out;
  };
  const mineLost = lostOf(l, b.track || {});
  const oppList = lists.find((x) => x.id === b.oppList);
  const theirLost = oppList
    ? lostOf(oppList, b.trackThem || {})
    : (b.kills || []).filter((k) => k.n).map((k) => k.n + ' (R' + k.r + ')');

  if (mineLost.length)  { lines.push(''); lines.push('I lost:    ' + mineLost.join(', ')); }
  if (theirLost.length) { if (!mineLost.length) lines.push(''); lines.push('They lost: ' + theirLost.join(', ')); }
  if (b.notes) { lines.push(''); lines.push(b.notes.trim()); }

  const txt = lines.join('\n');
  const done = () => alert('Result copied.');
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(done, fallback);
  else fallback();

  function fallback(){
    const url = URL.createObjectURL(new Blob([txt], { type:'text/plain' }));
    const a = document.createElement('a'); a.href = url;
    a.download = 'battle-' + b.date + '.txt'; a.click(); URL.revokeObjectURL(url);
  }
}

function clockPanel(b){
  const box = el('div','clock');

  for (const who of ['me','them']) {
    const p = pace(b, who);
    const side = el('div','clks' + (b.clock.running === who ? ' on' : ''));

    const lab = el('div','clkl');
    lab.textContent = who === 'me' ? 'Me' : (b.opponent || 'Opponent');

    const t = el('div');
    t.id = 'clk-' + who;
    t.className = 'clkt' + (p.over > 600 ? ' late' : (p.over > 0 ? ' over' : ''));
    t.textContent = mmss(p.spent);

    const sub = el('div','clkp');
    sub.textContent = p.over > 0
      ? '+' + mmss(p.over) + ' over pace'
      : mmss(-p.over) + ' under pace';

    const btn = el('button','btn' + (b.clock.running === who ? ' pri' : ''));
    btn.textContent = b.clock.running === who ? 'PAUSE' : 'START';
    btn.onclick = () => toggleClock(b, who);

    side.append(lab, t, sub, btn);
    box.append(side);
  }

  const foot = el('div','clkf');

  // Pausa global: en la mesa se interrumpe la partida entera (una consulta,
  // un juez, un café) y frenar el reloj del que corre y acordarse de quién
  // era es justo lo que se olvida.
  const running = b.clock.running;
  const pz = el('button', 'btn' + (running ? ' pri' : ''));
  pz.textContent = running ? '\u23f8 PAUSE BOTH' : (b.clock.paused ? '\u25b6 RESUME' : '\u23f8 PAUSED');
  pz.disabled = !running && !b.clock.paused;
  pz.onclick = () => {
    const c = b.clock;
    if (c.running) {
      c[c.running] = elapsed(b, c.running);
      c.paused = c.running;          // se recuerda a quién reanudar
      c.running = null; c.since = null;
    } else if (c.paused) {
      c.running = c.paused; c.since = Date.now(); c.paused = null;
    }
    saveBattle(b); renderBattles();
  };
  foot.append(pz);

  const bud = el('input'); bud.type='text'; bud.inputMode='numeric';
  bud.style.cssText='width:54px;text-align:center;font-family:var(--mono);padding:3px 5px;' +
    'background:var(--panel);border:1px solid var(--rule2);border-radius:2px;color:var(--ink)';
  bud.value = Math.round(b.clock.budget / 60);
  bud.onchange = () => {
    b.clock.budget = Math.max(10, parseInt(bud.value,10) || 80) * 60;
    saveBattle(b); renderBattles();
  };
  foot.append('Minutes per player ', bud);
  const rst = el('button','btn'); rst.textContent='RESET';
  rst.style.marginLeft='10px';
  rst.onclick = () => {
    if (!confirm('Reset both clocks?')) return;
    b.clock.me = 0; b.clock.them = 0; b.clock.running = null; b.clock.since = null;
    saveBattle(b); renderBattles();
  };
  foot.append(rst);
  box.append(foot);
  return box;
}

function scoreTable(b){
  const t = el('table','score');
  const hdr = '<tr><th></th>' +
    Array.from({length:ROUNDS}, (_,i) => '<th>R' + (i+1) + '</th>').join('') +
    '<th>Total</th></tr>';

  // Una fila rotulada por concepto y por jugador. Antes eran dos casillas
  // apiladas sin etiqueta y una leyenda al pie: nadie sabía cuál era cuál.
  const line = (who, label, k, cls) => {
    const cells = b[who].map((r, i) => {
      // Mi secundaria la llenan las cartas. Si la escribís a mano, esa ronda
      // deja de pisarse: la mano gana sobre el automático.
      const manual = who === 'me' ? (b.manualSec || {}) : (b.manualSecThem || {});
      const auto = k === 's' && !manual[i];
      return '<td><input data-w="' + who + '" data-i="' + i + '" data-k="' + k + '"' +
        (auto ? ' class="auto" title="Filled by your secondary cards"' : '') +
        ' value="' + (r[k]||0) + '"></td>';
    }).join('');
    const tot = b[who].reduce((a, r) => a + (+r[k]||0), 0);
    return '<tr class="' + cls + '"><th class="who">' + esc(label) + '</th>' +
           cells + '<td class="tot">' + tot + '</td></tr>';
  };

  const sideTotal = (who) => b[who].reduce((a, r) => a + (+r.p||0) + (+r.s||0), 0);
  const them = b.opponent || 'Them';

  t.innerHTML = hdr +
    line('me', 'Me \u00b7 primary', 'p', 'sec-p') +
    line('me', 'Me \u00b7 secondary', 's', 'sec-s') +
    '<tr class="sub"><th class="who">Subtotal</th><td colspan="' + ROUNDS + '"></td>' +
      '<td class="tot">' + sideTotal('me') + '</td></tr>' +
    line('them', them + ' \u00b7 primary', 'p', 'sec-p') +
    line('them', them + ' \u00b7 secondary', 's', 'sec-s') +
    '<tr class="sub"><th class="who">Subtotal</th><td colspan="' + ROUNDS + '"></td>' +
      '<td class="tot">' + sideTotal('them') + '</td></tr>';

  // Un solo manejador para las 20 celdas.
  t.addEventListener('input', (ev) => {
    const el2 = ev.target;
    if (!el2.dataset || !el2.dataset.w) return;
    const raw = Math.max(0, parseInt(el2.value, 10) || 0);
    // Tope por ronda: 15 por defecto, o el de la primaria si lo ajustaste.
    const cap = el2.dataset.k === 'p' ? (b.primCap || VP_CAP.perRound) : VP_CAP.perRound;
    const n = Math.min(raw, cap);
    if (n !== raw) el2.value = n;
    b[el2.dataset.w][+el2.dataset.i][el2.dataset.k] = n;

    // Editar mi secundaria a mano desactiva el automático de esa ronda.
    if (el2.dataset.k === 's') {
      const key = el2.dataset.w === 'me' ? 'manualSec' : 'manualSecThem';
      b[key] = b[key] || {};
      b[key][+el2.dataset.i] = true;
      el2.classList.remove('auto');
    }

    saveBattle(b);
    const tot = b[el2.dataset.w].reduce((a, r) => a + (+r[el2.dataset.k]||0), 0);
    const cell = el2.closest('tr').querySelector('.tot');
    if (cell) cell.textContent = tot;
  });
  return t;
}

/* ============================================================
   MISIONES SECUNDARIAS
   
   La app NO trae el texto de las cartas: son de la baraja de GW. Lo que
   trae es la MECÁNICA — biblioteca propia, barajado, robo de dos por
   ronda, descarte por 1 PM — y cada quien carga sus cartas con el nombre
   y el máximo de VP.
   
   Se guardan una sola vez y sirven para todas las batallas.
   ============================================================ */
let secLib = [];

/* En su propio almacén: guardarla junto a la colección la hacía aparecer
 * como una miniatura más, con un JSON gigante en el campo de cantidad. */
function saveLib(){ store.put('misc', { id: 'secondaries', qty: JSON.stringify(secLib) }); }

async function loadLib(){
  const rows = await store.getAll('misc');
  const row = rows.find((r) => r.id === 'secondaries');
  try { secLib = row ? JSON.parse(row.qty) : []; } catch { secLib = []; }

  // Las cartas sin nombre no cuentan: quedaban de probar "+ CARD" y hacían
  // que la app creyera que ya tenías biblioteca propia, bloqueando la del
  // dataset. El síntoma era una carta "max 5" sin nombre ni reglas.
  secLib = secLib.filter((c) => c && String(c.n || '').trim());

  if (!secLib.length) secLib = communityCards();
}

/** Copia editable de las cartas del dataset comunitario. */
function communityCards(){
  return (DATA.missions?.cards ?? []).map((c) => ({
    id: c.id, n: c.n, max: c.max, pr: 0,
    type: c.type, drawn: c.drawn, tiers: c.tiers,
  }));
}

/* Barajado Fisher-Yates con semilla guardada: el mazo tiene que sobrevivir
   a un recargue de página en medio de la partida. */
function shuffled(ids, seed){
  const a = [...ids];
  let s = seed >>> 0;
  const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function secOf(id){ return secLib.find((c) => c.id === id); }

/* Estado de secundarias dentro de una batalla. */
function initSec(b, who){
  // Dos mazos independientes: el rival roba sus propias cartas, no comparte
  // las tuyas. `sec` es el tuyo (nombre histórico) y `secThem` el suyo.
  const k = who === 'them' ? 'secThem' : 'sec';
  b[k] = b[k] || { mode: 'tactical', seed: 0, deck: [], active: [], done: [],
                   fixed: [], vp: {}, byRound: {}, scored: {}, drawnFor: {} };
  return b[k];
}

/* Roba DOS cartas nuevas por ronda, que se SUMAN a las que ya tenías.
 *
 * En la ronda 1 tenés dos; en la 2 sacás dos más y quedan cuatro; y así
 * hasta la 5. Antes rellenaba hasta dos, que es otro juego: descartaba las
 * viejas en vez de acumularlas.
 *
 * Se lleva registro de en qué ronda se robó por última vez para no repartir
 * dos veces la misma ronda al redibujar. */
function drawSecondaries(b, force, who){
  const s = initSec(b, who);
  if (s.mode !== 'tactical') return;
  if (secLib.length < 2) return;

  s.drawnFor = s.drawnFor || {};
  if (!force && s.drawnFor[b.round]) return;

  if (!s.deck.length) {
    const used = new Set([...(s.active || []), ...(s.done || [])]);
    const rest = secLib.map((c) => c.id).filter((id) => !used.has(id));
    if (rest.length) {
      s.seed = s.seed || (Date.now() % 2147483647);
      s.deck = shuffled(rest, s.seed + Object.keys(s.drawnFor).length);
    }
  }

  let n = 0;
  while (n < 2 && s.deck.length) { s.active.push(s.deck.shift()); n++; }
  s.drawnFor[b.round] = true;
  saveBattle(b);
}

/* Selector de lado. Sigue al reloj salvo que lo fuerces. */
function secSwitch(b, side){
  const row = el('div','sswitch');
  for (const [who, label] of [['me','Me'], ['them', b.opponent || 'Them']]) {
    const active = side === who;
    const s2 = initSec(b, who);
    const vp = Object.values(s2.vp).reduce((a, n) => a + (+n || 0), 0);
    const btn = el('button', 'chip' + (active ? ' on' : ''));
    btn.innerHTML = esc(label) + '<i>' + s2.active.length + ' in hand \u00b7 ' + vp + ' VP</i>';
    btn.onclick = () => { b.secView = who; saveBattle(b); renderBattles(); };
    row.append(btn);
  }
  if (b.secView) {
    const auto = el('button','chip');
    auto.textContent = 'follow the clock';
    auto.onclick = () => { b.secView = null; saveBattle(b); renderBattles(); };
    row.append(auto);
  }
  return row;
}

function secondaryPanel(b, who){
  who = who || 'me';
  const s = initSec(b, who);
  // Al entrar ya están las dos cartas: no hace falta ningún paso previo.
  if (s.mode === 'tactical' && secLib.length >= 2) drawSecondaries(b, false, who);
  const box = el('div');
  box.style.cssText = 'margin:16px 0';

  const head = el('div','rrole');
  const scored = Object.values(s.vp).reduce((a, n) => a + (+n || 0), 0);
  head.innerHTML = '<span>SECONDARY MISSIONS \u00b7 ' +
    esc((who === 'me' ? 'ME' : (b.opponent || 'THEM')).toUpperCase()) +
    '</span><span>' + scored + ' VP</span>';
  box.append(head);

  if (DATA.missions && who === 'me') {
    const cr = el('div','hint');
    cr.innerHTML = 'Missions and cards from the community dataset ' +
      '<b>' + esc(DATA.missions.source) + '</b> (' + esc(DATA.missions.licence) + '), ' +
      'version ' + esc(DATA.missions.version) + '. Unofficial; not affiliated with Games Workshop.';
    box.append(cr);
  }

  if (secLib.length < 2) {
    box.append(note(secLib.length
      ? 'Add at least two cards to draw from — a deck of one has nothing to shuffle.'
      : 'Your secondary mission library is empty. Add your cards below — ' +
      'name and maximum VP. The app does not ship the card text; that is ' +
      'in your Chapter Approved deck or the official app.'));
    box.append(libEditor());
    return box;
  }

  // modo
  const bar = el('div','bar');
  const mode = el('select');
  for (const [v, t] of [['tactical','Tactical (draw 2 each round)'], ['fixed','Fixed (pick 2 for the battle)']]) {
    const o = el('option'); o.value = v; o.textContent = t;
    if (s.mode === v) o.selected = true;
    mode.append(o);
  }
  mode.onchange = () => {
    s.mode = mode.value; s.active = []; s.done = []; s.deck = [];
    saveBattle(b); renderBattles();
  };
  bar.append(labelled('Mode', mode));

  if (s.mode === 'tactical') {
    const sh = el('button','btn');
    sh.textContent = 'RESHUFFLE';
    sh.title = 'Start over: new deck, nothing drawn';
    sh.onclick = () => {
      s.seed = Date.now() % 2147483647;
      s.deck = shuffled(secLib.map((c) => c.id), s.seed);
      s.active = []; s.done = []; s.vp = {}; s.byRound = {}; s.drawnFor = {}; s.scored = {};
      drawSecondaries(b, true, who); renderBattles();
    };
    bar.append(sh);

    const dr = el('button','btn');
    dr.textContent = 'DRAW 2';
    dr.title = 'Two more cards for this round';
    dr.onclick = () => { drawSecondaries(b, true, who); renderBattles(); };
    bar.append(dr);
  }
  box.append(bar);

  if (who === 'me') {
  const libTog = document.createElement('details');
  libTog.className = 'cfg';
  libTog.innerHTML = '<summary>Card library <span>' + secLib.length + ' cards</span></summary>';
  const libBody = el('div');
  libBody.append(libEditor());
  libTog.append(libBody);
  box.append(libTog);
  }

  if (s.mode === 'fixed') {
    const sel = el('div');
    sel.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px';
    for (const c of secLib) {
      const on = s.fixed.includes(c.id);
      const b2 = el('button', 'chip' + (on ? ' on' : ''));
      b2.textContent = c.n + ' · ' + c.max;
      b2.onclick = () => {
        if (on) s.fixed = s.fixed.filter((x) => x !== c.id);
        else if (s.fixed.length < 2) s.fixed.push(c.id);
        saveBattle(b); renderBattles();
      };
      sel.append(b2);
    }
    box.append(sel);
    if (s.fixed.length < 2) box.append(hint('Pick two fixed missions.'));
    for (const id of s.fixed) box.append(secRow(b, id, false, who));
    return box;
  }

  if (!s.deck.length && !s.active.length) {
    box.append(hint('Shuffle the deck to start drawing.'));
    return box;
  }
