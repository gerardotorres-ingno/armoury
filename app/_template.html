    i.onchange = () => { if (i.value) { l.dets.push(i.value); saveList(l); renderLists(); } };
    box.append(i);
  }

  // presupuesto editable
  const bwrap = el('div');
  bwrap.style.cssText = 'display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:var(--ink2)';
  const bin = el('input'); bin.type='text'; bin.inputMode='numeric'; bin.value = budget;
  bin.style.cssText = 'width:52px;text-align:center;font-family:var(--mono);padding:4px 6px;' +
    'background:var(--panel);border:1px solid var(--rule2);border-radius:2px';
  bin.onchange = () => { l.dpBudget = parseInt(bin.value,10) || budget; saveList(l); renderLists(); };
  bwrap.append('DP available', bin);
  box.append(bwrap);

  box.append(hint('The DP budget for each battle size is not in the data \u2014 it lives in the official app. ' +
                  'Adjust it here if your event uses a different number.'));
  return box;
}

function enhancementsFor(l, f){
  l.enh = l.enh || [];
  const box = el('div');
  box.style.cssText = 'margin:14px 0';

  const head = el('div','rrole');
  const sum = l.enh.reduce((a, e) => a + (+e.pts || 0), 0);
  head.innerHTML = '<span>ENHANCEMENTS</span><span>' + sum + ' pts</span>';
  box.append(head);

  for (const [i, e] of l.enh.entries()) {
    const row = el('div','slot');

    // Si la facción trae mejoras en el catálogo, se eligen de una lista y los
    // puntos se completan solos. Si no, queda el campo libre de siempre.
    let name;
    // Con MFM, sólo se ofrecen las mejoras del destacamento elegido.
    // El repertorio es la UNIÓN de las mejoras de los destacamentos elegidos.
    const eb = enhByOf(f);
    const pool = eb
      ? (l.dets || []).flatMap((n) => eb[n] || [])
      : f.enh;

    if (pool && pool.length) {
      name = el('select');
      name.style.cssText = 'flex:1;min-width:0;font-family:var(--disp);font-weight:600;font-size:15px;max-width:100%';
      const o0 = el('option'); o0.value = ''; o0.textContent = 'choose an enhancement\u2026'; name.append(o0);
      for (const [n, pts] of pool) {
        const o = el('option'); o.value = n; o.textContent = n + '  \u00b7 ' + pts + ' pts';
        if (n === e.n) o.selected = true;
        name.append(o);
      }
      name.onchange = () => {
        e.n = name.value;
        const hit = pool.find(([n]) => n === name.value);
        e.pts = hit ? hit[1] : 0;
        saveList(l); renderLists();
      };
    } else {
      name = el('input'); name.type = 'text'; name.value = e.n || '';
      name.placeholder = 'Enhancement name';
      name.style.cssText = 'flex:1;min-width:0;font-family:var(--disp);font-weight:600;font-size:15px;' +
        'background:transparent;border:none;border-bottom:1px solid var(--rule2);padding:3px 0';
      name.oninput = () => { e.n = name.value; saveList(l); };
    }

    const pts = el('input'); pts.type = 'text'; pts.inputMode = 'numeric';
    pts.value = e.pts ?? 0;
    pts.style.cssText = 'width:64px;text-align:right;font-family:var(--mono);font-size:14px;' +
      'background:var(--panel);border:1px solid var(--rule2);border-radius:2px;padding:5px 7px';
    pts.onchange = () => { e.pts = parseInt(pts.value, 10) || 0; saveList(l); renderLists(); };

    // a qué personaje va
    const on = el('select'); on.style.cssText = 'font-size:12px;padding:5px 7px;max-width:190px';
    const none = el('option'); none.value = ''; none.textContent = 'unassigned'; on.append(none);
    for (const [j, sl] of l.slots.entries()) {
      const u = unitOf(l, sl.unitId);
      if (!u || !(u.kw || []).includes('Character')) continue;
      const o = el('option'); o.value = String(j);
      o.textContent = u.n;
      if (String(e.on) === String(j)) o.selected = true;
      on.append(o);
    }
    on.onchange = () => { e.on = on.value === '' ? null : +on.value; saveList(l); };

    const rm = el('button','btn'); rm.textContent = 'REMOVE';
    rm.onclick = () => { l.enh.splice(i, 1); saveList(l); renderLists(); };

    row.append(name, on, pts, rm);
    box.append(row);
  }

  const add = el('button','btn');
  add.textContent = '+ ENHANCEMENT';
  add.style.marginTop = '8px';
  add.onclick = () => { l.enh.push({ n:'', pts:0, on:null }); saveList(l); renderLists(); };
  box.append(add);

  const eb2 = enhByOf(f);
  box.append(hint(eb2 && !(l.dets || []).length
    ? 'Pick a detachment first \u2014 enhancements belong to detachments.'
    : eb2
    ? 'Enhancements and points come from the Munitorum Field Manual, filtered to your detachment. How many you may take is not checked.'
    : f.enh && f.enh.length
    ? 'Enhancement points come from the catalogue. Which ones your detachment allows, and how many you may take, are not checked.'
    : 'This faction has no enhancements in the catalogue yet, so type them in yourself. Their points still count towards the total.'));
  return box;
}

function newList(){ draftList = null; creating = true; renderLists(); }

/* ------------------------------------------------------------------
 * COMPARTIR
 *
 * El archivo guarda los NOMBRES además de los ids, y la revisión de datos
 * con la que se armó. Si el rival tiene un catálogo más nuevo y un id
 * cambió, la lista sigue siendo legible: se ve qué unidad era aunque no
 * se pueda recalcular.
 * ---------------------------------------------------------------- */
function exportList(l){
  const f = factionOf(l.faction);
  const payload = {
    schemaVersion: 1,
    kind: 'armoury-list',
    dataRevision: DATA?.revision?.sha ?? null,
    exportedAt: new Date().toISOString(),
    name: l.name || 'Untitled',
    faction: l.faction,
    factionName: f ? f.name : null,
    detachments: l.dets || [],
    dpBudget: dpBudget(l),
    mission: l.mission || null,
    enhancements: (l.enh || []).filter(e => e.n || e.pts),
    limit: l.limit,
    legends: !!l.legends,
    crucible: !!l.crucible,
    slots: l.slots.map((sl) => {
      const u = unitOf(l, sl.unitId);
      return {
        unitId: sl.unitId,
        unitName: u ? u.n : null,     // respaldo legible si el id ya no existe
        size: sl.size,
        attach: sl.attach ?? null,
        gear: sl.gear ?? null,
      };
    }),
  };

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (l.name || 'list').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

/* ------------------------------------------------------------------
 * COMPARTIR
 *
 * Tres formas, cada una para un destinatario distinto:
 *   .json  → otro usuario de Armoury, que la importa entera
 *   PDF    → papel o celular. La app NO genera el PDF: abre el diálogo de
 *            impresión, donde el navegador ofrece "Guardar como PDF".
 *            Generarlo en el archivo costaría sumar una librería de 300 KB.
 *   texto  → WhatsApp o Discord, que es como se comparte en la práctica.
 * ---------------------------------------------------------------- */
function shareMenu(l){
  const wrap = el('div');
  wrap.style.cssText = 'position:relative';

  const btn = el('button','btn');
  btn.textContent = 'SHARE \u25be';

  const menu = el('div','shmenu');
  menu.hidden = true;

  const item = (title, sub, fn) => {
    const b = el('button');
    b.innerHTML = '<b>' + title + '</b><i>' + sub + '</i>';
    b.onclick = () => { menu.hidden = true; fn(); };
    return b;
  };

  menu.append(
    item('Armoury file', 'A .json another Armoury user can import', () => exportList(l)),
    item('PDF or print', 'Opens the print dialog \u2014 choose Save as PDF', () => printList(l)),
    item('Copy as text', 'Plain text for chat', () => copyListText(l)),
  );

  btn.onclick = () => { menu.hidden = !menu.hidden; };
  document.addEventListener('click', (ev) => {
    if (!wrap.contains || menu.hidden) return;
    if (!wrap.contains(ev.target)) menu.hidden = true;
  });

  wrap.append(btn, menu);
  return wrap;
}

/* Texto plano, con el formato que se usa para pegar una lista en un chat. */
function listAsText(l){
  const f = factionOf(l.faction);
  const { total } = review(l);
  const copies = copyIndex(l);
  const lines = [];

  lines.push((l.name || 'Untitled') + '  (' + total + '/' + l.limit + ' pts)');
  lines.push(f ? f.name : '?');
  if ((l.dets || []).length) lines.push('Detachment: ' + l.dets.join(' + '));
  if (l.mission) lines.push('Mission: ' + l.mission);
  lines.push('');

  for (const [i, sl] of l.slots.entries()) {
    const u = unitOf(l, sl.unitId);
    if (!u) { lines.push('- ' + (sl.unitName || 'Unknown')); continue; }
    const pts = ptsFor(u, sl.size, copies[i]) + gearPoints(u, sl);
    lines.push('- ' + u.n + (sl.size > 1 ? ' x' + sl.size : '') + '  [' + pts + ']');

    const gear = [];
    for (const [k, v] of Object.entries(sl.gear || {})) {
      if (typeof v === 'string') { gear.push(v); continue; }
      const [gi, oi] = k.split(':').map(Number);
      const nm = u.o?.[gi]?.opts?.[oi]?.[0];
      if (nm && v > 0) gear.push(nm + ' x' + v);
    }
    if (gear.length) lines.push('    ' + gear.join(', '));

    const att = sl.attach && l.slots[sl.attach - 1];
    const au = att && unitOf(l, att.unitId);
    if (au) lines.push('    leading ' + au.n);
  }

  for (const e of (l.enh || [])) {
    if (!e.n && !e.pts) continue;
    const host = e.on != null && l.slots[e.on];
    const hu = host && unitOf(l, host.unitId);
    lines.push('- ' + (e.n || 'Enhancement') + '  [' + (+e.pts || 0) + ']' +
               (hu ? '  on ' + hu.n : ''));
  }

  lines.push('');
  lines.push('Total: ' + total + ' / ' + l.limit + ' pts');
  return lines.join('\n');
}

function copyListText(l){
  const txt = listAsText(l);
  const done = () => alert('List copied. Paste it wherever you like.');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done, () => fallback());
  } else fallback();

  function fallback(){
    // Sin portapapeles (pasa en file://): se descarga como .txt.
    const url = URL.createObjectURL(new Blob([txt], { type:'text/plain' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = (l.name || 'list').toLowerCase().replace(/[^a-z0-9]+/g,'-') + '.txt';
    a.click();
    URL.revokeObjectURL(url);
  }
}

function importList(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json';
  inp.onchange = async () => {
    try {
      const d = JSON.parse(await inp.files[0].text());
      if (d.kind !== 'armoury-list' || !Array.isArray(d.slots))
        throw new Error('Not an Armoury list file.');

      const l = {
        id: Date.now(),
        name: d.name || 'Imported list',
        faction: d.faction,
        dets: Array.isArray(d.detachments) ? d.detachments : (d.detachment ? [d.detachment] : []),
        dpBudget: d.dpBudget ?? null,
        mission: d.mission || '',
        enh: Array.isArray(d.enhancements) ? d.enhancements : [],
        limit: d.limit || 2000,
        legends: !!d.legends,
        crucible: !!d.crucible,
        // Marca de lista ajena: sin esto, la app avisaría que "te faltan
        // miniaturas" para una lista que no es tuya.
        foreign: true,
        importedRevision: d.dataRevision ?? null,
        slots: d.slots.map((sl) => ({
          unitId: sl.unitId, size: sl.size,
          attach: sl.attach ?? null, gear: sl.gear ?? null,
          unitName: sl.unitName ?? null,
        })),
      };
      lists.push(l); saveList(l); editing = l.id; renderLists();
    } catch (e) {
      alert(e.message || 'Could not read that file.');
    }
  };
  inp.click();
}

/* ------------------------------------------------------------------
 * IMPRESIÓN — hoja de consulta rápida.
 * Primero el resumen de la lista, después una ficha por unidad, cada una
 * sin cortarse entre páginas.
 * ---------------------------------------------------------------- */
/* Longitud máxima del texto de una habilidad impresa. Es la perilla que
 * regula cuántas páginas ocupa la lista. */
const PRINT_AB_LEN = 190;

function printList(l){
  const f = factionOf(l.faction);
  const { total } = review(l);
  const area = document.getElementById('printArea');
  area.innerHTML = '';

  const head = el('div','pr-head');
  head.innerHTML = '<h1>' + esc(l.name || 'Untitled') + '</h1>' +
    '<div class="m">' + esc(f ? f.name : '?') +
    ((l.dets || []).length ? ' \u00b7 ' + esc(l.dets.join(' + ')) : '') +
    (l.mission ? ' \u00b7 ' + esc(l.mission) : '') +
    ' \u00b7 ' + total + ' / ' + l.limit + ' pts' +
    (l.foreign ? ' \u00b7 OPPONENT LIST' : '') +
    ' \u00b7 data ' + esc(String(l.importedRevision || DATA?.revision?.sha || '?')) + '</div>';
  area.append(head);

  // resumen
  const t = el('table','pr-roster');
  const prCopies = copyIndex(l);
  t.innerHTML = l.slots.map((sl, pi) => {
    const u = unitOf(l, sl.unitId);
    const att = sl.attach && l.slots[sl.attach - 1];
    const au = att && unitOf(l, att.unitId);
    const gear = sl.gear ? Object.entries(sl.gear).filter(([,v]) => v).map(([k,v]) =>
      typeof v === 'number' ? gearName(u, k) + ' \u00d7' + v : v).filter(Boolean) : [];
    return '<tr><td>' + esc(u ? u.n : (sl.unitName || 'Unknown')) +
      (sl.size > 1 ? ' \u00d7' + sl.size : '') +
      (au ? '<br><span style="font-size:11px;color:#555">leading ' + esc(au.n) + '</span>' : '') +
      (gear.length ? '<br><span style="font-size:11px;color:#555">' + esc(gear.join(', ')) + '</span>' : '') +
      '</td><td>' + (u ? (ptsFor(u, sl.size, prCopies[pi]) + gearPoints(u, sl)) : '\u2014') + '</td></tr>';
  }).join('') +
    (l.enh || []).filter(e => e.n || e.pts).map((e) => {
      const host = e.on != null && l.slots[e.on];
      const hu = host && unitOf(l, host.unitId);
      return '<tr><td>' + esc(e.n || 'Enhancement') +
        (hu ? '<br><span style="font-size:11px;color:#555">on ' + esc(hu.n) + '</span>' : '') +
        '</td><td>' + (+e.pts || 0) + '</td></tr>';
    }).join('') +
    '<tr class="tot"><td>TOTAL</td><td>' + total + '</td></tr>';
  area.append(t);

  // fichas, una por unidad distinta
  // Fichas de referencia, dos por fila. Una ficha por combinación de unidad
  // y equipamiento: dos Defilers con armas distintas son dos fichas.
  const grid = el('div','pr-grid');
  const seen = new Set();

  for (const [si, sl] of l.slots.entries()) {
    const key = sl.unitId + '|' + JSON.stringify(sl.gear || {});
    if (seen.has(key)) continue;
    seen.add(key);
    const u = unitOf(l, sl.unitId);
    if (!u || !hasSheet(u)) continue;

    const card = el('div','pr-card');
    const pts = ptsFor(u, sl.size, copyIndex(l)[si]) + gearPoints(u, sl);
    let inner = '<h3><span>' + esc(u.n) + '</span><em>\u00d7' + sl.size + ' \u00b7 ' + pts + ' pts</em></h3>';

    if (u.st) {
      const labs = ['M','T','SV','W','LD','OC'];
      inner += '<div class="pr-strip">' + u.st
        .map((v, i) => {
          if (!v) return '';
          // En papel la invulnerable va dentro de la caja de salvación con
          // una barra: "2+/4+". Una caja aparte gastaba espacio sin ganar nada.
          const txt = (i === 2 && u.inv) ? v + '/' + u.inv : v;
          const lab = (i === 2 && u.inv) ? 'SV/INV' : labs[i];
          return '<span' + (i === 2 && u.inv ? ' class="wide"' : '') +
                 '><i>' + lab + '</i>' + esc(txt) + '</span>';
        })
        .join('') + '</div>';
    }

    // Sólo las armas que la unidad lleva de verdad, con cuántas la portan.
    const ws = weaponsAfterGear(u, sl);
    const counts = weaponCounts(u, sl);
    if (ws.length) {
      // Ranged primero, melee después: es el orden de la ficha oficial.
      const shown = [...ws].sort((a, b) => a[1] - b[1]).slice(0, 6);
      inner += '<table class="pr-w">' + shown.map((w) => {
        const c = counts && counts.get(wkey(w[0]));
        return '<tr' + (w[1] ? ' class="mel"' : '') + '><td>' + esc(w[0]) +
          (c > 1 ? ' <b>\u00d7' + c + '</b>' : '') + '</td>' +
          '<td>' + esc(w[2]) + '</td><td>' + esc(w[3]) + '</td><td>' + esc(w[4]) +
          '</td><td>' + esc(w[5]) + '</td><td>' + esc(w[6]) + '</td><td>' + esc(w[7]) + '</td></tr>';
      }).join('') + '</table>';
      if (ws.length > shown.length)
        inner += '<div class="pr-more">+' + (ws.length - shown.length) + ' more weapons</div>';
    }

    // Habilidades con su texto. Ocupa bastante, así que va en cuerpo 8,5 y
    // el texto muy largo se recorta: en la mesa alcanza con el enunciado
    // para saber qué hace, y el detalle se consulta en la app.
    if (u.ab && u.ab.length) {
      inner += '<div class="pr-abs">' + u.ab.map(([n, t]) => {
        const cut = t.length > PRINT_AB_LEN ? t.slice(0, PRINT_AB_LEN).replace(/\s+\S*$/, '') + '\u2026' : t;
        return '<p><b>' + esc(n) + '.</b> ' + esc(cut) + '</p>';
      }).join('') + '</div>';
    }

    // Palabras clave: la línea que se consulta para saber si una regla aplica.
    if (u.kw && u.kw.length)
      inner += '<div class="pr-kw">' + esc(u.kw.join(' \u00b7 ')) + '</div>';

    card.innerHTML = inner;
    grid.append(card);
  }
  area.append(grid);

  window.print();
}

// nombre legible de una opción de armamento a partir de su clave "grupo:opción"
function gearName(u, key){
  if (!u || !u.o) return key;
  const [gi, oi] = key.split(':').map(Number);
  return u.o[gi]?.opts?.[oi]?.[0] ?? key;
}

/* ============================================================
   BATALLAS
   
   Registro de una partida: tus listas contra un rival, la misión, el
   marcador ronda por ronda y un reloj por jugador.
   
   El reloj es lo que más pediste y lo que ninguna app resuelve bien:
   marca el ritmo. A 2000 puntos y 5 rondas, cada jugador tiene unos
   80 minutos; si vas 10 minutos por encima del ritmo, lo avisa antes
   de que se acabe el tiempo, no después.
   ============================================================ */
let battles = [];
let openBattle = null;

function saveBattle(b){ store.put('battles', b); }
function loadBattles(){ return store.getAll('battles'); }

const ROUNDS = 5;

/* ------------------------------------------------------------------
 * MISIONES DE EVENTO
 *
 * Tu Force Disposition contra la del rival determina la Misión Primaria de
 * cada uno. Las cinco disposiciones dan 15 combinaciones, y las trae el
 * Warhammer Event Companion (v1.1). Cada combinación tiene además tres
 * disposiciones de terreno recomendadas: A, B y C.
 *
 * Se guarda sólo el mapa de nombres — lo necesario para saber qué jugás.
 * Las condiciones de puntuación de cada carta son de la baraja de GW y no
 * están acá: el marcador sigue siendo manual.
 * ---------------------------------------------------------------- */
const DISPOSITIONS = ['TAKE AND HOLD','PURGE THE FOE','DISRUPTION','RECONNAISSANCE','PRIORITY ASSETS'];

const MISSION_TABLE = {
  'TAKE AND HOLD|TAKE AND HOLD':      ['Battlefield Dominance','Battlefield Dominance'],
  'TAKE AND HOLD|PURGE THE FOE':      ['Immovable Object','Unstoppable Force'],
  'TAKE AND HOLD|DISRUPTION':         ['Determined Acquisition','Death Trap'],
  'TAKE AND HOLD|RECONNAISSANCE':     ['Purge and Secure','Reconnaissance Sweep'],
  'TAKE AND HOLD|PRIORITY ASSETS':    ['Inescapable Dominion','Secure Asset'],
  'PURGE THE FOE|PURGE THE FOE':      ['Meatgrinder','Meatgrinder'],
  'PURGE THE FOE|DISRUPTION':         ['Punishment','Delaying Action'],
  'PURGE THE FOE|RECONNAISSANCE':     ['Consecrate','Triangulation'],
  'PURGE THE FOE|PRIORITY ASSETS':    ["Destroyer's Wrath",'Vital Link'],
  'DISRUPTION|DISRUPTION':            ['Outmanoeuvre','Outmanoeuvre'],
  'DISRUPTION|RECONNAISSANCE':        ['Smoke and Mirrors','Surveil the Foe'],
  'DISRUPTION|PRIORITY ASSETS':       ['Locate and Deny','Extract Relic'],
  'RECONNAISSANCE|RECONNAISSANCE':    ['Gather Intel','Gather Intel'],
  'RECONNAISSANCE|PRIORITY ASSETS':   ['Search and Scour','Vanguard Operation'],
  'PRIORITY ASSETS|PRIORITY ASSETS':  ['Sabotage','Sabotage'],
};

/* Con el dataset comunitario cargado, las disposiciones y la matriz salen
 * de ahí; la tabla de arriba queda como respaldo si no se corrió missions.mjs. */
function dispositionList(){
  return DATA.missions?.dispositions ?? DISPOSITIONS;
}

/** Celda completa de la matriz: nombre de misión y sus tramos de puntuación. */
function primaryCell(mine, theirs){
  const mx = DATA.missions?.matrix;
  if (mx && mx[mine] && mx[mine][theirs]) return mx[mine][theirs];
  const up = (x) => String(x).toUpperCase();
  const t = MISSION_TABLE[up(mine) + '|' + up(theirs)];
  if (t) return { n: t[0], score: [] };
  const f = MISSION_TABLE[up(theirs) + '|' + up(mine)];
  return f ? { n: f[1], score: [] } : null;
}

/** Devuelve [misión propia, misión del rival] a partir de las disposiciones. */
function missionsFrom(mine, theirs){
  if (!mine || !theirs) return null;
  const a = primaryCell(mine, theirs), b = primaryCell(theirs, mine);
  return (a && b) ? [a.n, b.n] : null;
}

/* Topes de puntos de victoria del Event Companion. */
const VP_CAP = { perRound: 15, primary: 45, secondary: 45, painted: 10 };

function newBattle(){
  const b = {
    id: Date.now(),
    date: new Date().toISOString().slice(0, 10),
    mine: lists[0]?.id ?? null,
    opponent: '',
    oppList: null,          // id de una lista importada, si la cargaste
    disp: { me: '', them: '' },   // Force Disposition de cada jugador
    layout: '',                   // A, B o C
    painted: { me: false, them: false },
    limit: 2000,
    // marcador: [{ primary, secondary }] por ronda y jugador
    me: Array.from({ length: ROUNDS }, () => ({ p: 0, s: 0 })),
    them: Array.from({ length: ROUNDS }, () => ({ p: 0, s: 0 })),
    cp: { me: 0, them: 0 },
    clock: { me: 0, them: 0, budget: 80 * 60, running: null, since: null },
    round: 1,
    notes: '',
    done: false,
  };
  battles.push(b); saveBattle(b); openBattle = b.id; renderBattles();
}

/* --- reloj: se guarda el acumulado y el instante de arranque, no un
   intervalo. Así el tiempo sigue corriendo aunque cierres la pestaña. --- */
let clockTimer = null;

function elapsed(b, who){
  const c = b.clock;
  let t = c[who] || 0;
  if (c.running === who && c.since) t += Math.floor((Date.now() - c.since) / 1000);
  return t;
}

function toggleClock(b, who){
  const c = b.clock;
  if (c.running === who) {
    c[who] = elapsed(b, who);
    c.running = null; c.since = null;
  } else {
    if (c.running) { c[c.running] = elapsed(b, c.running); }
    c.running = who; c.since = Date.now();
  }
  saveBattle(b); renderBattles();
}

function mmss(s){
  const m = Math.floor(s / 60), r = s % 60;
  return m + ':' + String(r).padStart(2, '0');
}

/* Ritmo esperado: el presupuesto repartido entre las rondas jugadas. */
function pace(b, who){
  const spent = elapsed(b, who);
  const should = Math.round(b.clock.budget * (b.round - 1 + 0.5) / ROUNDS);
  return { spent, should, over: spent - should };
}

/* Total con los topes del Event Companion aplicados: 15 VP por ronda en
 * cada fuente, 45 de primaria, 45 de secundarias y 10 por ejército pintado.
 * Sin esto la app deja sumar cualquier cifra y el marcador no sirve. */
function battleTotals(b){
  const side = (who) => {
    let prim = 0, sec = 0;
    for (const r of b[who]) {
      prim += Math.min(+r.p || 0, VP_CAP.perRound);
      sec  += Math.min(+r.s || 0, VP_CAP.perRound);
    }
    prim = Math.min(prim, VP_CAP.primary);
    sec  = Math.min(sec,  VP_CAP.secondary);
    const paint = (b.painted && b.painted[who]) ? VP_CAP.painted : 0;
    return { prim, sec, paint, total: prim + sec + paint };
  };
  const me = side('me'), them = side('them');
  return { me: me.total, them: them.total, detail: { me, them } };
}

function renderBattles(){
  try { renderBattlesInner(); }
  catch (e) {
    const v = document.getElementById('viewBattles');
    v.innerHTML = '';
    const w = el('div','warn');
    w.innerHTML = '<b>BATTLE VIEW FAILED</b>' + escSafe(e.message);
    v.append(w);
  }
}

function renderBattlesInner(){
  const v = document.getElementById('viewBattles');
  v.innerHTML = '';

  if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }

  if (openBattle == null) {
    const bar = el('div','bar');
    const nw = el('button','btn pri'); nw.textContent = 'NEW BATTLE';
    nw.onclick = newBattle;
    bar.append(nw); v.append(bar);

    if (!battles.length) { v.append(note('No battles yet. Start one to track the score and the clock.')); return; }

    for (const b of [...battles].sort((a, c) => c.id - a.id)) {
      const t = battleTotals(b);
      const mine = lists.find((x) => x.id === b.mine);
      const c = el('div','card');
      c.innerHTML = '<div><div class="nm">' + esc(mine ? mine.name || 'Untitled' : '?') +
        ' vs ' + esc(b.opponent || '?') + '</div>' +
        '<div class="meta">' + esc(b.date) + (b.mission ? ' · ' + esc(b.mission) : '') +
        (b.done ? ' · finished' : ' · round ' + b.round) + '</div></div>' +
        '<div class="pts">' + t.me + ' – ' + t.them + '</div>';
      c.onclick = () => { openBattle = b.id; renderBattles(); };
      v.append(c);
    }
    return;
  }

  const b = battles.find((x) => x.id === openBattle);
  if (!b) { openBattle = null; return renderBattles(); }

  // ---- cabecera
  const bar = el('div','bar');
  const back = el('button','btn'); back.textContent = '\u2190 ALL BATTLES';
  back.onclick = () => { openBattle = null; renderBattles(); };
  const del = el('button','btn'); del.textContent = 'DELETE';
  del.onclick = () => {
    if (!confirm('Delete this battle?')) return;
    store.del('battles', b.id);
    battles = battles.filter((x) => x.id !== b.id);
    openBattle = null; renderBattles();
  };
  bar.append(back, del); v.append(bar);

  // ---- configuración
  const cfg = el('div','bar');
  const mySel = el('select');
  const none = el('option'); none.value=''; none.textContent='(no list)'; mySel.append(none);
  for (const l of lists) {
    if (l.foreign) continue;
    const o = el('option'); o.value = l.id; o.textContent = l.name || 'Untitled';
    if (l.id === b.mine) o.selected = true;
    mySel.append(o);
  }
  mySel.onchange = () => { b.mine = mySel.value ? +mySel.value : null; saveBattle(b); renderBattles(); };
  cfg.append(labelled('My list', mySel));

  const opp = el('input'); opp.type='text'; opp.placeholder='opponent';
  opp.style.cssText='width:150px;font-size:13px'; opp.value = b.opponent;
  opp.oninput = () => { b.opponent = opp.value; saveBattle(b); };
  cfg.append(labelled('Against', opp));

  // Lista del rival: sólo las importadas, que son las suyas.
  const foreign = lists.filter((x) => x.foreign);
  if (foreign.length) {
    const os = el('select');
    const n0 = el('option'); n0.value=''; n0.textContent='—'; os.append(n0);
    for (const l of foreign) {
      const o = el('option'); o.value = l.id; o.textContent = l.name || 'Untitled';
      if (l.id === b.oppList) o.selected = true;
      os.append(o);
    }
    os.onchange = () => { b.oppList = os.value ? +os.value : null; saveBattle(b); };
    cfg.append(labelled('Their list', os));
  }

  v.append(cfg);
  v.append(missionPanel(b));

  // ---- reloj
  v.append(clockPanel(b));

  // ---- marcador
  const t = battleTotals(b);
  const head = el('div','ledger');
  head.innerHTML = '<div class="lf">Round ' + b.round + '</div>' +
    '<div class="lm"><b>' + t.me + '</b><i>me</i></div>' +
    '<div class="lm"><b>' + t.them + '</b><i>them</i></div>';
  v.append(head);
  v.append(scoreTable(b));
  v.append(secondaryPanel(b));

  const d = t.detail;
  const brk = el('div','hint');
  brk.textContent =
    'Me: ' + d.me.prim + ' primary + ' + d.me.sec + ' secondary' +
    (d.me.paint ? ' + ' + d.me.paint + ' painted' : '') + '   ·   ' +
    'Them: ' + d.them.prim + ' + ' + d.them.sec +
    (d.them.paint ? ' + ' + d.them.paint : '') +
    '   ·   caps: 15/round, 45 primary, 45 secondary';
  v.append(brk);

  // ---- puntos de mando y notas
  const cpBar = el('div','bar');
  for (const who of ['me','them']) {
    const i = el('input'); i.type='text'; i.inputMode='numeric';
    i.style.cssText='width:56px;text-align:center;font-family:var(--mono)';
    i.value = b.cp[who];
    i.onchange = () => {
      // El Event Companion limita a 1 PM por ronda además del CP básico.
      const max = b.round;
      const n = Math.max(0, Math.min(max, parseInt(i.value,10) || 0));
      b.cp[who] = n; i.value = n; saveBattle(b);
    };
    cpBar.append(labelled(who === 'me' ? 'My CP' : 'Their CP', i));
  }
  // Selector simple: numSelect() rotula en puntos y mostraba "3 pts".
  const rnd = el('select');
  for (let i = 1; i <= ROUNDS; i++) {
    const o = el('option'); o.value = i; o.textContent = 'Round ' + i;
    if (i === b.round) o.selected = true;
    rnd.append(o);
  }
  rnd.onchange = () => {
    b.round = +rnd.value;
    // Al empezar la ronda se roba hasta tener dos activas: es la regla, y
    // esperar a que el usuario apriete un botón era un paso de más.
    drawSecondaries(b);
    saveBattle(b); renderBattles();
  };
  cpBar.append(rnd);

  // Tope de primaria por ronda: 15 por defecto, ajustable si la misión
  // que te tocó puntúa distinto.
  const pc = el('input'); pc.type='text'; pc.inputMode='numeric';
  pc.style.cssText='width:52px;text-align:center;font-family:var(--mono)';
  pc.value = b.primCap ?? VP_CAP.perRound;
  pc.onchange = () => { b.primCap = Math.max(0, parseInt(pc.value,10) || VP_CAP.perRound); saveBattle(b); };
  cpBar.append(labelled('Primary cap/round', pc));
  b.painted = b.painted || { me:false, them:false };
  for (const who of ['me','them'])
    cpBar.append(check(who === 'me' ? 'Mine painted' : 'Theirs painted', b.painted[who],
      (x) => { b.painted[who] = x; saveBattle(b); renderBattles(); }));
  const fin = check('Finished', b.done, (x) => { b.done = x; saveBattle(b); renderBattles(); });
  cpBar.append(fin);
  v.append(cpBar);

  const nt = el('textarea');
  nt.placeholder = 'Notes — deployment, what went wrong, what to change';
  nt.style.cssText = 'width:100%;min-height:80px;margin-top:12px;padding:10px;' +
    'background:var(--panel);border:1px solid var(--rule2);border-radius:2px;' +
    'color:var(--ink);font:inherit;resize:vertical';
  nt.value = b.notes;
  nt.oninput = () => { b.notes = nt.value; saveBattle(b); };
  v.append(nt);

  // Redibujar sólo el reloj cada segundo: volver a dibujar todo perdería
  // el foco de los campos mientras escribís.
  if (b.clock.running) {
    clockTimer = setInterval(() => {
      for (const who of ['me','them']) {
        const box = document.getElementById('clk-' + who);
        if (!box) continue;
        const p = pace(b, who);
        box.textContent = mmss(p.spent);
        box.className = 'clkt' + (p.over > 600 ? ' late' : (p.over > 0 ? ' over' : ''));
      }
    }, 1000);
  }
}

 * las dos misiones primarias. La disposición propia sale de la lista si ya

  // Sugerencia desde la lista: si la lista ya fijó su Force Disposition,

    if (hit) { b.disp.me = hit; saveBattle(b); }

  lay.onchange = () => { b.layout = lay.value; saveBattle(b); };
  bar.append(labelled('Terrain', lay));

  // El documento dice que la disposición se puede sortear entre las tres.
  const roll = el('button','btn'); roll.textContent = 'ROLL';
  roll.onclick = () => {
    b.layout = ['A','B','C'][Math.floor(Math.random() * 3)];

  const m = missionsFrom(b.disp.me, b.disp.them);

  if (m) {
    b.mission = m[0]; saveBattle(b);
    const cellMe = primaryCell(b.disp.me, b.disp.them);
    const cellTh = primaryCell(b.disp.them, b.disp.me);
    const tiers = (c) => (c?.score ?? []).map((t) =>
      '<u>' + esc(t.w) + (t.max ? ' · max ' + esc(t.max) : '') + '</u>' +
      t.i.map(([vp, tx]) => '<em><b>' + esc(vp) + '</b> ' + esc(tx) + '</em>').join('')).join('');
    out.innerHTML =
      '<div><b>' + esc(m[0]) + '</b><i>my primary mission</i>' + tiers(cellMe) + '</div>' +
      '<div><b>' + esc(m[1]) + '</b><i>theirs</i>' + tiers(cellTh) + '</div>';
  } else {
    out.innerHTML = '<div class="empty">Pick both Force Dispositions to see the primary missions.</div>';
  }
  box.append(out);
  return box;
}

    const btn = el('button','btn' + (b.clock.running === who ? ' pri' : ''));

    'background:var(--panel);border:1px solid var(--rule2);border-radius:2px;color:var(--ink)';
  bud.value = Math.round(b.clock.budget / 60);

    saveBattle(b); renderBattles();

function scoreTable(b){
  const t = el('table','score');
  const hdr = '<tr><th></th>' +
    Array.from({length:ROUNDS}, (_,i) => '<th>R' + (i+1) + '</th>').join('') +
    '<th>Total</th></tr>';

  const row = (who, label) => {
    const cells = b[who].map((r, i) =>
      '<td><input data-w="' + who + '" data-i="' + i + '" data-k="p" value="' + (r.p||0) + '">' +
      '<input data-w="' + who + '" data-i="' + i + '" data-k="s" value="' + (r.s||0) + '"></td>').join('');
    const tot = b[who].reduce((a, r) => a + (+r.p||0) + (+r.s||0), 0);
    return '<tr><th class="who">' + esc(label) + '</th>' + cells + '<td class="tot">' + tot + '</td></tr>';
  };

  t.innerHTML = hdr + row('me','Me') + row('them', b.opponent || 'Them') +
    '<tr class="lg"><th></th><td colspan="' + (ROUNDS+1) + '">primary / secondary</td></tr>';

  // Un solo manejador para las 20 celdas.
  t.addEventListener('input', (ev) => {
    const el2 = ev.target;
    if (!el2.dataset || !el2.dataset.w) return;
    const n = Math.max(0, parseInt(el2.value, 10) || 0);
    b[el2.dataset.w][+el2.dataset.i][el2.dataset.k] = n;
    saveBattle(b);
    const tot = b[el2.dataset.w].reduce((a, r) => a + (+r.p||0) + (+r.s||0), 0);
    const cell = el2.closest('tr').querySelector('.tot');
    if (cell) cell.textContent = tot;
  });
  return t;
}

/* ============================================================
   MISIONES SECUNDARIAS
   
   La app NO trae el texto de las cartas: son de la baraja de GW. Lo que
   trae es la MECÁNICA — biblioteca propia, barajado, robo de dos por
   ronda, descarte por 1 PM — y cada quien carga sus cartas con el nombre
   y el máximo de VP.
   
   Se guardan una sola vez y sirven para todas las batallas.
   ============================================================ */
let secLib = [];

/* En su propio almacén: guardarla junto a la colección la hacía aparecer
 * como una miniatura más, con un JSON gigante en el campo de cantidad. */
function saveLib(){ store.put('misc', { id: 'secondaries', qty: JSON.stringify(secLib) }); }

async function loadLib(){
  const rows = await store.getAll('misc');
  const row = rows.find((r) => r.id === 'secondaries');
  try { secLib = row ? JSON.parse(row.qty) : []; } catch { secLib = []; }

  // Las cartas sin nombre no cuentan: quedaban de probar "+ CARD" y hacían
  // que la app creyera que ya tenías biblioteca propia, bloqueando la del
  // dataset. El síntoma era una carta "max 5" sin nombre ni reglas.
  secLib = secLib.filter((c) => c && String(c.n || '').trim());

  if (!secLib.length) secLib = communityCards();
}

/** Copia editable de las cartas del dataset comunitario. */
function communityCards(){
  return (DATA.missions?.cards ?? []).map((c) => ({
    id: c.id, n: c.n, max: c.max, pr: 0,
    type: c.type, drawn: c.drawn, tiers: c.tiers,
  }));
}

/* Barajado Fisher-Yates con semilla guardada: el mazo tiene que sobrevivir
   a un recargue de página en medio de la partida. */
function shuffled(ids, seed){
  const a = [...ids];
  let s = seed >>> 0;
  const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function secOf(id){ return secLib.find((c) => c.id === id); }

/* Estado de secundarias dentro de una batalla. */
function initSec(b){
  b.sec = b.sec || { mode: 'tactical', seed: 0, deck: [], active: [], done: [], fixed: [], vp: {} };
  return b.sec;
}

/* Roba hasta tener dos activas.
 *
 * Si no hay mazo, lo arma solo. Antes había que apretar SHUFFLE primero y,
 * si no lo hacías, el robo no pasaba nada y no explicaba por qué. Un botón
 * que falla en silencio es peor que uno que no está. */
function drawSecondaries(b){
  const s = initSec(b);
  if (s.mode !== 'tactical') return;
  if (secLib.length < 2) return;

  if (!s.deck.length) {
    const used = new Set([...(s.active || []), ...(s.done || [])]);
    const rest = secLib.map((c) => c.id).filter((id) => !used.has(id));
    if (rest.length) {
      s.seed = s.seed || (Date.now() % 2147483647);
      s.deck = shuffled(rest, s.seed + (s.done || []).length);
    }
  }

  while (s.active.length < 2 && s.deck.length) s.active.push(s.deck.shift());
  saveBattle(b);
}

function secondaryPanel(b){
  const s = initSec(b);
  // Al entrar ya tenés tus dos cartas: no hace falta ningún paso previo.
  if (s.mode === 'tactical' && s.active.length < 2 && secLib.length >= 2) drawSecondaries(b);
  const box = el('div');
  box.style.cssText = 'margin:16px 0';

  const head = el('div','rrole');
  const scored = Object.values(s.vp).reduce((a, n) => a + (+n || 0), 0);
  head.innerHTML = '<span>SECONDARY MISSIONS</span><span>' + scored + ' VP</span>';
  box.append(head);

  if (DATA.missions) {
    const cr = el('div','hint');
    cr.innerHTML = 'Missions and cards from the community dataset ' +
      '<b>' + esc(DATA.missions.source) + '</b> (' + esc(DATA.missions.licence) + '), ' +
      'version ' + esc(DATA.missions.version) + '. Unofficial; not affiliated with Games Workshop.';
    box.append(cr);
  }

  if (secLib.length < 2) {
    box.append(note(secLib.length
      ? 'Add at least two cards to draw from — a deck of one has nothing to shuffle.'
      : 'Your secondary mission library is empty. Add your cards below — ' +
      'name and maximum VP. The app does not ship the card text; that is ' +
      'in your Chapter Approved deck or the official app.'));
    box.append(libEditor());
    return box;
  }

  // modo
  const bar = el('div','bar');
  const mode = el('select');
  for (const [v, t] of [['tactical','Tactical (draw 2 each round)'], ['fixed','Fixed (pick 2 for the battle)']]) {
    const o = el('option'); o.value = v; o.textContent = t;
    if (s.mode === v) o.selected = true;
    mode.append(o);
  }
  mode.onchange = () => {
    s.mode = mode.value; s.active = []; s.done = []; s.deck = [];
    saveBattle(b); renderBattles();
  };
  bar.append(labelled('Mode', mode));

  if (s.mode === 'tactical') {
    const sh = el('button','btn');
    sh.textContent = 'RESHUFFLE';
    sh.title = 'Start over: new deck, nothing drawn';
    sh.onclick = () => {
      s.seed = Date.now() % 2147483647;
      s.deck = shuffled(secLib.map((c) => c.id), s.seed);
      s.active = []; s.done = []; s.vp = {};
      drawSecondaries(b); renderBattles();
    };
    bar.append(sh);

    const dr = el('button','btn');
    dr.textContent = 'DRAW';
    dr.title = 'Fill back up to two active cards';
    dr.onclick = () => { drawSecondaries(b); renderBattles(); };
    bar.append(dr);
  }
  box.append(bar);

  const libTog = document.createElement('details');
  libTog.className = 'cfg';
  libTog.innerHTML = '<summary>Card library <span>' + secLib.length + ' cards</span></summary>';
  const libBody = el('div');
  libBody.append(libEditor());
  libTog.append(libBody);
  box.append(libTog);

  if (s.mode === 'fixed') {
    const sel = el('div');
    sel.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px';
    for (const c of secLib) {
      const on = s.fixed.includes(c.id);
      const b2 = el('button', 'chip' + (on ? ' on' : ''));
      b2.textContent = c.n + ' · ' + c.max;
      b2.onclick = () => {
        if (on) s.fixed = s.fixed.filter((x) => x !== c.id);
        else if (s.fixed.length < 2) s.fixed.push(c.id);
        saveBattle(b); renderBattles();
      };
      sel.append(b2);
    }
    box.append(sel);
    if (s.fixed.length < 2) box.append(hint('Pick two fixed missions.'));
    for (const id of s.fixed) box.append(secRow(b, id, false));
    return box;
  }

  if (!s.deck.length && !s.active.length) {
    box.append(hint('Shuffle the deck to start drawing.'));
    return box;
  }

  for (const id of s.active) box.append(secRow(b, id, true));

  const foot = el('div','hint');
  foot.textContent = s.deck.length + ' left in deck · ' + s.done.length + ' achieved';
  box.append(foot);
  return box;
}

function secRow(b, id, tactical){
  const s = b.sec, c = secOf(id);
  const row = el('div','slot');
  if (!c) { row.textContent = 'Card removed from the library.'; return row; }

  // Los VP se llevan POR RONDA, no como un acumulado suelto: cada carta
  // tiene su tope por ronda además del de la partida, y sin separar las
  // rondas no se puede aplicar ninguno de los dos.
  s.byRound = s.byRound || {};
  const key = id + '@' + b.round;
  const scoredBefore = Object.entries(s.byRound)
    .reduce((a, [k, v]) => k.startsWith(id + '@') && k !== key ? a + (+v || 0) : a, 0);

  const capRound = +c.pr || +c.max || 99;
  const capLeft  = Math.max(0, (+c.max || 99) - scoredBefore);
  const cap = Math.min(capRound, capLeft);

  const info = el('div','id');
  const rules = (c.tiers || []).map((t) =>
    '<u>' + esc([t.mode, t.w].filter(Boolean).join(' · ')) +
    (t.max ? ' · max ' + esc(t.max) : '') + '</u>' +
    (t.i || []).map(([vp, tx]) => '<em><b>' + esc(vp) + '</b> ' + esc(tx) + '</em>').join('')
  ).join('');
  info.innerHTML = '<div class="nm">' + esc(c.n) + '</div>' +
    '<div class="meta">' + (c.pr ? c.pr + ' per round · ' : '') + 'max ' + c.max +
    (scoredBefore ? ' · ' + scoredBefore + ' already scored' : '') + '</div>' +
    (rules ? '<div class="crules">' + rules + '</div>' : '');

  const stepv = el('div','step');
  const minus = el('button'); minus.textContent = '\u2212';
  const val = el('input'); val.type='text'; val.inputMode='numeric';
  val.value = s.byRound[key] ?? 0;
  const plus = el('button'); plus.textContent = '+';
  const set = (n) => {
    n = Math.max(0, Math.min(cap, n | 0));
    s.byRound[key] = n;
    s.vp[id] = scoredBefore + n;
    val.value = n; saveBattle(b); syncSecToScore(b);
  };
  minus.onclick = () => set((s.byRound[key] ?? 0) - 1);
  plus.onclick  = () => set((s.byRound[key] ?? 0) + 1);
  val.onchange  = () => set(parseInt(val.value,10) || 0);
  stepv.append(minus, val, plus);

  row.append(info, stepv);

  if (tactical) {
    const ok = el('button','btn'); ok.textContent = 'ACHIEVED';
    ok.onclick = () => {
      s.active = s.active.filter((x) => x !== id);
      s.done.push(id);
      saveBattle(b); renderBattles();
    };
    ok.title = 'Scored — the card leaves play';
    // Descartar cuesta y da 1 PM: es la regla, y conviene que se vea.
    const dc = el('button','btn'); dc.textContent = 'DISCARD +1CP';
    dc.onclick = () => {
      s.active = s.active.filter((x) => x !== id);
      s.deck.push(id);
      b.cp.me = Math.min(b.round, (b.cp.me || 0) + 1);
      saveBattle(b); renderBattles();
    };
    row.append(ok, dc);
  }
  return row;
}

/* Los VP de secundarias alimentan la fila del marcador de la ronda actual. */
/* Los VP de la ronda actual salen de las cartas puntuadas EN esa ronda. */
function syncSecToScore(b){
  const s = b.sec;
  s.byRound = s.byRound || {};
  const suffix = '@' + b.round;
  const thisRound = Object.entries(s.byRound)
    .reduce((a, [k, v]) => k.endsWith(suffix) ? a + (+v || 0) : a, 0);
  b.me[b.round - 1].s = Math.min(VP_CAP.perRound, thisRound);
  saveBattle(b);
}

/* Editor de la biblioteca. Se comparte entre batallas. */
function libEditor(){
  const box = el('div');
  box.style.cssText = 'margin-top:10px';

  for (const [i, c] of secLib.entries()) {
    const row = el('div','slot');
    const n = el('input'); n.type='text'; n.value = c.n; n.placeholder='card name';
    n.style.cssText = 'flex:1;min-width:0;font-family:var(--disp);font-weight:600;font-size:15px;' +
      'background:transparent;border:none;border-bottom:1px solid var(--rule2);padding:3px 0;color:var(--ink)';
    n.oninput = () => { c.n = n.value; saveLib(); };

    const numBox = (v, ph, fn) => {
      const w = el('label');
      w.style.cssText = 'display:flex;flex-direction:column;gap:2px;font-family:var(--mono);' +
        'font-size:8.5px;letter-spacing:.1em;color:var(--ink2);text-transform:uppercase';
      const i = el('input'); i.type='text'; i.inputMode='numeric'; i.value = v;
      i.style.cssText = 'width:52px;text-align:center;font-family:var(--mono);padding:5px;' +
        'background:var(--panel);border:1px solid var(--rule2);border-radius:2px;color:var(--ink)';
      i.onchange = () => fn(parseInt(i.value,10) || 0);
      w.append(ph, i);
      return w;
    };
    const m  = numBox(c.max, 'total',     (n) => { c.max = n; saveLib(); });
    const pr = numBox(c.pr ?? 0, 'per rd', (n) => { c.pr = n;  saveLib(); });

    const rm = el('button','btn'); rm.textContent='REMOVE';
    rm.onclick = () => { secLib.splice(i,1); saveLib(); renderBattles(); };

    row.append(n, pr, m, rm);
    box.append(row);
  }

  /* Pegado masivo: cargar veinte cartas de a un clic era el motivo real
   * por el que la biblioteca quedaba vacía y el robo no hacía nada. */
  const paste = el('details');
  paste.className = 'cfg';
  paste.innerHTML = '<summary>Paste a whole list <span>one card per line</span></summary>';
  const pbody = el('div');
  const ta = el('textarea');
  ta.placeholder = 'Area Denial, 5, 5\nBehind Enemy Lines, 4, 8\nBring It Down 6\n\n' +
    'Formats accepted:\n  Name\n  Name, total\n  Name, per round, total';
  ta.style.cssText = 'width:100%;min-height:120px;padding:9px;background:var(--field);' +
    'border:1px solid var(--rule2);border-radius:2px;color:var(--ink);font-family:var(--mono);' +
    'font-size:12px;resize:vertical';
  const go = el('button','btn pri');
  go.textContent = 'ADD THESE';
  go.style.marginTop = '8px';
  go.onclick = () => {
    const added = parseCards(ta.value);
    if (!added.length) { alert('No card names found.'); return; }
    secLib = secLib.concat(added);
    saveLib(); renderBattles();
  };
  pbody.append(ta, go);
  paste.append(pbody);
  box.append(paste);

  const bar = el('div','bar');
  const add = el('button','btn'); add.textContent='+ CARD';
  add.onclick = () => {
    secLib.push({ id: 'c' + Date.now(), n: 'New card', max: 5, pr: 0 });
    saveLib(); renderBattles();
  };
  if (DATA.missions?.cards?.length) {
    const rst = el('button','btn');
    rst.textContent = 'RESET TO COMMUNITY SET';
    rst.onclick = () => {
      if (!confirm('Replace your library with the ' + DATA.missions.cards.length +
                   ' community cards? Your own edits are lost.')) return;
      secLib = communityCards(); saveLib(); renderBattles();
    };
    bar.append(rst);
  }

  const imp = el('button','btn'); imp.textContent='IMPORT';
  imp.onclick = importLib;
  const exp = el('button','btn'); exp.textContent='EXPORT';
  exp.onclick = () => {
    const url = URL.createObjectURL(new Blob([JSON.stringify(secLib,null,2)], {type:'application/json'}));
    const a = document.createElement('a'); a.href=url; a.download='armoury-secondaries.json'; a.click();
    URL.revokeObjectURL(url);
  };
  bar.append(add, imp, exp);
  box.append(bar);
  box.append(hint('PER RD is the most you can score with that card in a single round; ' +
                  'TOTAL is the cap for the whole battle. Leave PER RD at 0 for no per-round cap. ' +
                  'Cards are shared across every battle — export to share your set.'));
  return box;
}

/* Acepta "Nombre", "Nombre, total" y "Nombre, por ronda, total", con coma,
 * punto y coma, tabulación o el último número pegado al nombre. Cuanto más
 * tolerante, menos veces hay que volver a tipear. */
function parseCards(text){
  const out = [];
  for (const raw of String(text).split(/\r?\n/)) {
    let line = raw.trim();
    if (!line || /^formats accepted/i.test(line)) continue;

    let parts = line.split(/\s*[,;\t|]\s*/).filter(Boolean);
    if (parts.length === 1) {
      // "Bring It Down 6" → nombre y un número al final
      const m = /^(.*?)\s+(\d{1,2})$/.exec(line);
      if (m) parts = [m[1], m[2]];
    }

    const name = (parts[0] || '').trim();
    if (!name) continue;
    const nums = parts.slice(1).map((x) => parseInt(x, 10)).filter(Number.isFinite);

    let pr = 0, max = 5;
    if (nums.length >= 2) { pr = nums[0]; max = nums[1]; }
    else if (nums.length === 1) { max = nums[0]; }

    out.push({ id: 'c' + Date.now() + '_' + out.length, n: name, max, pr });
  }
  return out;
}

function importLib(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='application/json';
  inp.onchange = async () => {
    try {
      const d = JSON.parse(await inp.files[0].text());
      if (!Array.isArray(d)) throw new Error('Not a card list.');
      secLib = d.filter((c) => c && c.n).map((c, i) => ({
        id: c.id || 'c' + (Date.now() + i),
        n: String(c.n),
        max: parseInt(c.max, 10) || 5,
        pr: parseInt(c.pr ?? c.perRound, 10) || 0,   // 0 = sin tope por ronda
      }));
      saveLib(); renderBattles();
    } catch (e) { alert(e.message || 'Could not read that file.'); }
  };
  inp.click();
}

/* ============================================================
   ASISTENTE DE LISTA
   
   Cuatro pasos: facción y tamaño → destacamentos → mejoras → unidades.
   No sugiere qué llevar: no tengo datos de meta y una recomendación
   inventada es peor que ninguna. Lo que hace es no dejarte avanzar sin
   lo obligatorio y mostrar en todo momento qué falta.
   
   El único mínimo de composición que declara el catálogo es 1 Personaje
   por ejército; el resto son los topes que la app ya valida.
   ============================================================ */
let wizStep = 0;

const WIZ_STEPS = ['Army', 'Detachment', 'Enhancements', 'Units'];

/* Requisitos de una lista, con su estado. Alimenta la barra del asistente
   y también sirve como resumen dentro del editor. */
function requirements(l){
  const f = factionOf(l.faction);
  const req = [];
  if (!f) return req;

  const { total } = review(l);
  const chars = l.slots.filter((sl) => {
    const u = unitOf(l, sl.unitId);
    return u && (u.kw || []).includes('Character');
  }).length;

  req.push({
    k: 'char', t: 'At least one Character',
    ok: chars > 0,
    d: chars ? chars + ' in the list' : 'The army roster requires one',
  });

  const dl = detsOf(f);
  const spent = (l.dets || []).reduce((a, n) =>
    a + ((dl.find(([x]) => x === n) || [])[1] ?? 0), 0);
  req.push({
    k: 'det', t: 'A detachment',
    ok: (l.dets || []).length > 0,
    d: (l.dets || []).length ? spent + ' / ' + dpBudget(l) + ' DP used' : 'Pick at least one',
  });

  const missions = missionsFor(l, f);
  if (missions.size) {
    req.push({
      k: 'mis', t: 'Force Disposition',
      ok: !!l.mission && missions.has(l.mission),
      d: l.mission || [...missions.keys()].join(' / '),
    });
  }

  req.push({
    k: 'pts', t: 'Within the points limit',
    ok: total <= l.limit,
    d: total + ' / ' + l.limit + (total > l.limit ? '  (' + (total - l.limit) + ' over)' : ''),
  });

  const hard = review(l).issues.filter((i) => i.hard).length;
  req.push({
    k: 'legal', t: 'No blocking issues',
    ok: hard === 0,
    d: hard ? hard + ' to fix' : 'clear',
  });

  return req;
}

function reqBar(l){
  const box = el('div','reqbar');
  for (const r of requirements(l)) {
    const c = el('div', 'req' + (r.ok ? ' ok' : ''));
    c.innerHTML = '<b>' + (r.ok ? '\u2713' : '\u2022') + ' ' + esc(r.t) + '</b>' +
                  '<i>' + esc(r.d) + '</i>';
    box.append(c);
  }
  return box;
}

function renderWizard(v, l){
  const f = factionOf(l.faction);

  // pasos
  const nav = el('div','wsteps');
  WIZ_STEPS.forEach((name, i) => {
    const b = el('button', 'wstep' + (i === wizStep ? ' on' : (i < wizStep ? ' done' : '')));
    b.innerHTML = '<span>' + (i + 1) + '</span>' + name;
    b.onclick = () => { wizStep = i; renderLists(); };
    nav.append(b);
  });
  v.append(nav);

  const body = el('div');
  body.style.cssText = 'margin-top:4px';

  if (wizStep === 0) {
    body.append(hint('Faction and points are fixed once the list exists — changing ' +
                     'them later would silently invalidate what you built.'));

    const fsel = el('select');
    fsel.style.cssText = 'width:100%;font-family:var(--disp);font-weight:600;font-size:16px';
    for (const group of ['Imperium','Chaos','Xenos','Otros']) {
      const fs = DATA.factions.filter((x) => x.group === group);
      if (!fs.length) continue;
      const og = document.createElement('optgroup'); og.label = group;
      for (const x of fs) {
        const o = el('option'); o.value = x.slug; o.textContent = x.name;
        if (x.slug === l.faction) o.selected = true;
        og.append(o);
      }
      fsel.append(og);
    }
    fsel.onchange = () => {
      l.faction = fsel.value; l.dets = []; l.enh = []; l.slots = []; l.mission = '';
      saveList(l); renderLists();
    };
    body.append(labelledBlock('Faction', fsel));

    const psel = numSelect([500,1000,1500,2000,2500,3000], l.limit, (n) => {
      l.limit = n; saveList(l); renderLists();
    });
    psel.style.width = '100%';
    body.append(labelledBlock('Battle size', psel));

    const fmt = el('div','bar');
    fmt.append(check('Allow Legends',  l.legends,  (x) => { l.legends = x; saveList(l); }));
    fmt.append(check('Allow Crucible', l.crucible, (x) => { l.crucible = x; saveList(l); }));
    body.append(fmt);
  }

  if (wizStep === 1) {
    body.append(hint('Spend your Detachment Points. Two detachments with the same ' +
                     'unique tag cannot be combined, and your Force Disposition ' +
                     'comes from the one you pick.'));
    body.append(detachmentsFor(l, f));
    const bar2 = el('div','bar');
    bar2.append(labelled('Mission', missionInput(l, f)));
    body.append(bar2);
  }

  if (wizStep === 2) {
    body.append(hint('Optional. Enhancements go on Characters and their points ' +
                     'count towards the limit.'));
    body.append(enhancementsFor(l, f));
  }

  if (wizStep === 3) {
    const add = el('button','btn pri');
    add.textContent = '+ ADD UNIT';
    add.style.cssText = 'width:100%;padding:11px;margin-bottom:10px';
    add.onclick = () => { picking = true; selected = null; wizard = false; renderLists(); };
    body.append(add);
    body.append(hint('The assistant stops here: which units to take is a judgement ' +
                     'call, and I have no tournament data to base a recommendation on. ' +
                     'What it does check is on the left.'));
  }

  v.append(body);
  v.append(reqBar(l));

  // navegación
  const foot = el('div','bar');
  foot.style.marginTop = '14px';
  if (wizStep > 0) {
    const back = el('button','btn'); back.textContent = '\u2190 BACK';
    back.onclick = () => { wizStep--; renderLists(); };
    foot.append(back);
  }
  if (wizStep < WIZ_STEPS.length - 1) {
    const next = el('button','btn pri'); next.textContent = 'NEXT \u2192';
    next.onclick = () => { wizStep++; renderLists(); };
    foot.append(next);
  } else {
    const done = el('button','btn pri'); done.textContent = 'OPEN THE LIST';
    done.onclick = () => { wizard = false; renderLists(); };
    foot.append(done);
  }
  const skip = el('button','btn'); skip.textContent = 'SKIP TO EDITOR';
  skip.onclick = () => { wizard = false; renderLists(); };
  foot.append(skip);
  v.append(foot);
}

boot();

  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
